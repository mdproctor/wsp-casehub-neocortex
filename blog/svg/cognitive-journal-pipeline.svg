<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">CognitiveJournal — tick-scoped observability pipeline</text>

  <!-- Scope lifecycle bar -->
  <rect x="30" y="44" width="740" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="50" y="60" font-size="10" font-weight="600" fill="#1d4ed8">beginScope()</text>
  <text x="400" y="60" text-anchor="middle" font-size="10" fill="#3b82f6">ThreadLocal&lt;CognitiveTrace&gt; — collects entries for this tick</text>
  <text x="750" y="60" text-anchor="end" font-size="10" font-weight="600" fill="#1d4ed8">endScope()</text>

  <!-- CognitionCore.tick() box -->
  <rect x="30" y="80" width="300" height="340" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="180" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">CognitionCore.tick()</text>

  <!-- Entry types as phases -->
  <rect x="50" y="112" width="260" height="30" rx="4" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="180" y="132" text-anchor="middle" font-size="10" font-weight="500" fill="#4338ca">AttentionBriefed</text>

  <rect x="50" y="150" width="260" height="30" rx="4" fill="#fce7f3" stroke="#f472b6"/>
  <text x="180" y="170" text-anchor="middle" font-size="10" font-weight="500" fill="#be185d">MoodShifted (pre-appraisal)</text>

  <rect x="50" y="188" width="260" height="30" rx="4" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="180" y="208" text-anchor="middle" font-size="10" font-weight="500" fill="#92400e">DriveActivated</text>

  <rect x="50" y="226" width="260" height="30" rx="4" fill="#dcfce7" stroke="#4ade80"/>
  <text x="180" y="246" text-anchor="middle" font-size="10" font-weight="500" fill="#166534">AppraisalRecorded</text>

  <rect x="50" y="264" width="260" height="30" rx="4" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="180" y="284" text-anchor="middle" font-size="10" font-weight="500" fill="#0369a1">RegulationDecided</text>

  <rect x="50" y="302" width="260" height="30" rx="4" fill="#fce7f3" stroke="#f472b6"/>
  <text x="180" y="322" text-anchor="middle" font-size="10" font-weight="500" fill="#be185d">MoodShifted (post-appraisal)</text>

  <rect x="50" y="340" width="260" height="30" rx="4" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="180" y="360" text-anchor="middle" font-size="10" font-weight="500" fill="#92400e">DriveActivated (post-appraisal)</text>

  <text x="180" y="398" text-anchor="middle" font-size="9" fill="#64748b">7 record() calls per tick</text>

  <!-- Bridges -->
  <rect x="30" y="430" width="300" height="72" rx="6" fill="#faf5ff" stroke="#c084fc"/>
  <text x="180" y="450" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">Bridges (derivation + recall)</text>
  <rect x="50" y="460" width="120" height="28" rx="4" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="110" y="479" text-anchor="middle" font-size="9" fill="#6d28d9">DerivationBridge</text>
  <rect x="190" y="460" width="120" height="28" rx="4" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="250" y="479" text-anchor="middle" font-size="9" fill="#6d28d9">MemoryRecallBridge</text>

  <!-- record() arrow fan -->
  <line x1="310" y1="127" x2="390" y2="200" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="310" y1="165" x2="390" y2="200" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="310" y1="203" x2="390" y2="200" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="310" y1="241" x2="390" y2="215" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="310" y1="279" x2="390" y2="230" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="310" y1="317" x2="390" y2="240" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="310" y1="355" x2="390" y2="250" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ScopedCognitiveJournal -->
  <rect x="395" y="130" width="180" height="160" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="485" y="155" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">ScopedCognitiveJournal</text>
  <text x="485" y="172" text-anchor="middle" font-size="10" fill="#3b82f6">@ApplicationScoped</text>

  <rect x="410" y="186" width="150" height="40" rx="4" fill="#bfdbfe" stroke="#60a5fa"/>
  <text x="485" y="204" text-anchor="middle" font-size="9" fill="#1e40af">ThreadLocal scope</text>
  <text x="485" y="216" text-anchor="middle" font-size="9" fill="#1e40af">→ CognitiveTrace</text>

  <rect x="410" y="236" width="150" height="40" rx="4" fill="#bfdbfe" stroke="#60a5fa"/>
  <text x="485" y="254" text-anchor="middle" font-size="9" fill="#1e40af">persist(entry)</text>
  <text x="485" y="266" text-anchor="middle" font-size="9" fill="#1e40af">→ CognitiveJournalStore</text>

  <!-- CognitiveJournalStore -->
  <rect x="620" y="180" width="150" height="100" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="695" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">JournalStore</text>
  <text x="695" y="222" text-anchor="middle" font-size="10" fill="#16a34a">@ApplicationScoped</text>
  <text x="695" y="248" text-anchor="middle" font-size="9" fill="#166534">InMemory impl</text>
  <text x="695" y="262" text-anchor="middle" font-size="9" fill="#166534">CopyOnWriteArrayList</text>

  <!-- Arrow: Scoped → Store -->
  <line x1="575" y1="256" x2="617" y2="240" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- CDI wiring box -->
  <rect x="395" y="340" width="375" height="160" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="582" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">CDI wiring (#969)</text>

  <rect x="410" y="376" width="170" height="48" rx="4" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="495" y="395" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">CognitionCoreFactory</text>
  <text x="495" y="410" text-anchor="middle" font-size="8" fill="#a16207">Instance&lt;CognitiveJournal&gt;</text>
  <text x="495" y="420" text-anchor="middle" font-size="8" fill="#a16207">→ builder.cognitiveJournal()</text>

  <rect x="595" y="376" width="165" height="48" rx="4" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="677" y="395" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">ConsolidationScheduler</text>
  <text x="677" y="410" text-anchor="middle" font-size="8" fill="#a16207">Instance&lt;CognitiveJournal&gt;</text>
  <text x="677" y="420" text-anchor="middle" font-size="8" fill="#a16207">in CDI constructor</text>

  <rect x="410" y="436" width="350" height="48" rx="4" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="585" y="455" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">InMemoryCognitiveJournalStore</text>
  <text x="585" y="470" text-anchor="middle" font-size="8" fill="#a16207">+ @ApplicationScoped  →  ScopedCognitiveJournal becomes satisfiable</text>

  <!-- CDI arrows -->
  <line x1="485" y1="376" x2="485" y2="295" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="677" y1="376" x2="695" y2="283" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
</svg>
