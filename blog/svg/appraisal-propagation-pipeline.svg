<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">CognitionCore.tick() — appraisal state propagation</text>

  <!-- Phase boxes -->
  <!-- Early ticks -->
  <rect x="30" y="55" width="160" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="110" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Mood tick</text>
  <text x="110" y="96" text-anchor="middle" font-size="10" fill="#64748b">process pending signals</text>

  <rect x="30" y="135" width="160" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="110" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Drive tick</text>
  <text x="110" y="176" text-anchor="middle" font-size="10" fill="#64748b">evaluate sources + compose</text>

  <!-- DERIVED phase -->
  <rect x="240" y="55" width="200" height="140" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="340" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">DERIVED phase</text>
  <rect x="256" y="88" width="168" height="38" rx="4" fill="#bfdbfe" stroke="#60a5fa"/>
  <text x="340" y="112" text-anchor="middle" font-size="11" fill="#1e40af">Appraisal → emotions</text>
  <rect x="256" y="136" width="168" height="38" rx="4" fill="#bfdbfe" stroke="#60a5fa"/>
  <text x="340" y="160" text-anchor="middle" font-size="11" fill="#1e40af">Regulation → strategy</text>

  <!-- The fix: post-DERIVED propagation -->
  <rect x="240" y="220" width="200" height="160" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Post-DERIVED propagation</text>

  <rect x="256" y="254" width="168" height="34" rx="4" fill="#bbf7d0" stroke="#4ade80"/>
  <text x="340" y="276" text-anchor="middle" font-size="10" fill="#166534">bridgeAppraisalToMood</text>

  <rect x="256" y="296" width="168" height="34" rx="4" fill="#bbf7d0" stroke="#4ade80"/>
  <text x="340" y="318" text-anchor="middle" font-size="10" fill="#166534">AppraisalDriveModulator</text>

  <rect x="256" y="338" width="168" height="34" rx="4" fill="#bbf7d0" stroke="#4ade80"/>
  <text x="340" y="360" text-anchor="middle" font-size="10" fill="#166534">re-tick mood + drives</text>

  <!-- Prompt rendering -->
  <rect x="500" y="55" width="190" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="595" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">MoodPromptSection</text>
  <text x="595" y="92" text-anchor="middle" font-size="10" fill="#a16207">"tense and agitated"</text>

  <rect x="500" y="135" width="190" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="595" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">DrivePromptSection</text>
  <text x="595" y="172" text-anchor="middle" font-size="10" fill="#a16207">"Competence: 0.5 — mastery"</text>

  <!-- Arrows -->
  <!-- Early tick to DERIVED -->
  <line x1="190" y1="85" x2="237" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="165" x2="237" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DERIVED to post-DERIVED -->
  <line x1="340" y1="195" x2="340" y2="217" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Post-DERIVED to prompt sections -->
  <path d="M440,271 L470,271 Q480,271 480,200 L480,85 L497,85" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M440,313 L460,313 Q470,313 470,240 L470,165 L497,165" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Legend -->
  <text x="520" y="250" font-size="10" fill="#64748b">Before: signals queued</text>
  <text x="520" y="264" font-size="10" fill="#64748b">for next tick → stale prompt</text>
  <text x="520" y="290" font-size="10" font-weight="600" fill="#16a34a">After: propagated within</text>
  <text x="520" y="304" font-size="10" font-weight="600" fill="#16a34a">same tick → coherent prompt</text>

  <!-- Frijda mapping mini-table -->
  <rect x="500" y="325" width="190" height="80" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="595" y="343" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Frijda → Drives</text>
  <text x="510" y="360" font-size="9" fill="#475569">antagonism → COMPETENCE</text>
  <text x="510" y="374" font-size="9" fill="#475569">avoidance  → AUTONOMY</text>
  <text x="510" y="388" font-size="9" fill="#475569">approach   → CURIOSITY</text>
  <text x="510" y="402" font-size="9" fill="#475569">being-with → AFFILIATION</text>
</svg>
