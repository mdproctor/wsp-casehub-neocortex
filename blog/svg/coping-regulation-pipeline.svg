<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="520" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="460" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#111">Coping → Regulation Pipeline</text>

  <!-- Appraisal box -->
  <rect x="20" y="50" width="130" height="44" rx="6" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="85" y="76" text-anchor="middle" font-weight="500" fill="#312e81">Appraisal</text>

  <!-- Arrow to safety gate -->
  <line x1="150" y1="72" x2="180" y2="72" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Safety Gate -->
  <rect x="185" y="50" width="130" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="250" y="68" text-anchor="middle" font-weight="500" fill="#78350f">Safety Gate</text>
  <text x="250" y="82" text-anchor="middle" font-size="10" fill="#92400e">fatigue/intensity</text>

  <!-- Safety gate bypass arrow (down to AD) -->
  <line x1="250" y1="94" x2="250" y2="130" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <rect x="185" y="135" width="130" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="250" y="156" text-anchor="middle" font-size="11" fill="#991b1b">→ AD (bypass coping)</text>

  <!-- Arrow to CAPS -->
  <line x1="315" y1="72" x2="345" y2="72" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CAPS Settling -->
  <rect x="350" y="50" width="130" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="415" y="68" text-anchor="middle" font-weight="500" fill="#1e3a8a">CAPS Settling</text>
  <text x="415" y="82" text-anchor="middle" font-size="10" fill="#1e40af">learned preferences</text>

  <!-- Arrow to Predictor -->
  <line x1="480" y1="72" x2="510" y2="72" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Predictor -->
  <rect x="515" y="50" width="130" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="580" y="68" text-anchor="middle" font-weight="500" fill="#064e3b">Predictor</text>
  <text x="580" y="82" text-anchor="middle" font-size="10" fill="#065f46">personality × SEC</text>

  <!-- Arrow to LLM -->
  <line x1="645" y1="72" x2="675" y2="72" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM Generation -->
  <rect x="680" y="50" width="130" height="44" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="745" y="68" text-anchor="middle" font-weight="500" fill="#831843">LLM Generation</text>
  <text x="745" y="82" text-anchor="middle" font-size="10" fill="#9d174d">narrative reinterpret</text>

  <!-- Micro-loop arrow back -->
  <path d="M810,72 Q850,72 850,120 Q850,168 745,168 Q640,168 640,140 Q640,112 580,112 Q520,112 520,94" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="860" y="125" font-size="10" fill="#666">re-evaluate</text>

  <!-- Divider -->
  <line x1="20" y1="195" x2="900" y2="195" stroke="#ddd" stroke-width="1"/>
  <text x="460" y="215" text-anchor="middle" font-size="12" fill="#888">Strategy routing after micro-loop convergence</text>

  <!-- Routing decision -->
  <polygon points="460,240 530,275 460,310 390,275" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="460" y="272" text-anchor="middle" font-size="11" font-weight="500" fill="#374151">isRegulation</text>
  <text x="460" y="285" text-anchor="middle" font-size="11" font-weight="500" fill="#374151">Routed?</text>

  <!-- YES branch — regulation -->
  <line x1="390" y1="275" x2="250" y2="275" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="310" y="268" font-size="11" fill="#3b82f6" font-weight="500">yes (7 strategies)</text>

  <rect x="80" y="253" width="170" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="165" y="272" text-anchor="middle" font-weight="500" fill="#1e3a8a">generateForCoping()</text>
  <text x="165" y="286" text-anchor="middle" font-size="10" fill="#1e40af">assess effectiveness</text>

  <!-- Regulation result → CAPS update -->
  <line x1="165" y1="297" x2="165" y2="330" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="80" y="335" width="170" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="165" y="356" text-anchor="middle" font-size="11" fill="#5b21b6">CAPS weight update</text>

  <!-- Regulation result → result storage -->
  <line x1="165" y1="369" x2="165" y2="400" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="80" y="405" width="170" height="34" rx="6" fill="#e0e7ff" stroke="#818cf8" stroke-width="1"/>
  <text x="165" y="426" text-anchor="middle" font-size="11" fill="#312e81">narrative + fatigue tracking</text>

  <!-- NO branch — direct effects -->
  <line x1="530" y1="275" x2="650" y2="275" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="590" y="268" font-size="11" fill="#10b981" font-weight="500">no (9 strategies)</text>

  <rect x="655" y="253" width="170" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="740" y="272" text-anchor="middle" font-weight="500" fill="#064e3b">Direct Effects</text>
  <text x="740" y="286" text-anchor="middle" font-size="10" fill="#065f46">no regulation call</text>

  <!-- Direct effects dispatch -->
  <line x1="740" y1="297" x2="740" y2="330" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Goal operations -->
  <rect x="620" y="335" width="110" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="675" y="350" text-anchor="middle" font-size="11" fill="#78350f">Goals</text>
  <text x="675" y="362" text-anchor="middle" font-size="9" fill="#92400e">create/drop/defer</text>

  <!-- Drive modulation -->
  <rect x="740" y="335" width="110" height="34" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="795" y="350" text-anchor="middle" font-size="11" fill="#831843">Drives</text>
  <text x="795" y="362" text-anchor="middle" font-size="9" fill="#9d174d">modulate axis</text>

  <!-- Both paths converge to dispatch -->
  <line x1="165" y1="439" x2="165" y2="470" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="675" y1="369" x2="675" y2="470" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="280" y="470" width="360" height="40" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="460" y="494" text-anchor="middle" font-weight="500" fill="#374151">Goal lifecycle + drive profile → next tick</text>
</svg>
