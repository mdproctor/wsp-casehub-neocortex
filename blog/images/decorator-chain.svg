<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Inter', 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">CDI Decorator Chain — SituationClassifier</text>

  <!-- Consumer box -->
  <rect x="30" y="60" width="140" height="50" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="100" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Consumer</text>
  <text x="100" y="97" text-anchor="middle" font-size="9" fill="#4b5563">BehavioralSynthesis</text>

  <!-- Arrow -->
  <line x1="170" y1="85" x2="210" y2="85" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SubThought decorator -->
  <rect x="215" y="55" width="150" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="290" y="77" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">SubThought</text>
  <text x="290" y="92" text-anchor="middle" font-size="9" fill="#4b5563">@Priority(70)</text>
  <text x="290" y="105" text-anchor="middle" font-size="8" fill="#6b7280">cognitiveKind → activations</text>

  <!-- Arrow -->
  <line x1="365" y1="85" x2="405" y2="85" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CBR Caching decorator -->
  <rect x="410" y="55" width="150" height="60" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="485" y="77" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">CBR Cache</text>
  <text x="485" y="92" text-anchor="middle" font-size="9" fill="#4b5563">@Priority(60)</text>
  <text x="485" y="105" text-anchor="middle" font-size="8" fill="#6b7280">check → hit? return : delegate</text>

  <!-- Arrow -->
  <line x1="560" y1="85" x2="600" y2="85" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM classifier -->
  <rect x="605" y="60" width="90" height="50" rx="6" fill="#fae8ff" stroke="#d946ef" stroke-width="1.5"/>
  <text x="650" y="82" text-anchor="middle" font-size="10" font-weight="600" fill="#86198f">LLM</text>
  <text x="650" y="97" text-anchor="middle" font-size="9" fill="#4b5563">Haiku</text>

  <!-- CBR miss path — down from CBR to LLM and back -->
  <text x="360" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">Classification Flow</text>

  <!-- CBR Hit path -->
  <rect x="50" y="175" width="280" height="65" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="190" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">CBR Hit (similarity ≥ 0.85)</text>
  <text x="190" y="212" text-anchor="middle" font-size="10" fill="#4b5563">Deserialise stored activations</text>
  <text x="190" y="227" text-anchor="middle" font-size="10" fill="#4b5563">Return immediately — no LLM call</text>

  <!-- CBR Miss path -->
  <rect x="380" y="175" width="310" height="65" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="535" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#9a3412">CBR Miss</text>
  <text x="535" y="212" text-anchor="middle" font-size="10" fill="#4b5563">Delegate to LLM → classify</text>
  <text x="535" y="227" text-anchor="middle" font-size="10" fill="#4b5563">Store result in CBR → return</text>

  <!-- Future tiers note -->
  <rect x="50" y="270" width="620" height="50" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="360" y="290" text-anchor="middle" font-size="10" font-weight="500" fill="#5b21b6">Future tiers slot in as additional decorators at different priorities</text>
  <text x="360" y="308" text-anchor="middle" font-size="9" fill="#7c3aed">ONNX @Priority(50)  ·  Local Ollama @Priority(40)  ·  each independently deployable</text>
</svg>
