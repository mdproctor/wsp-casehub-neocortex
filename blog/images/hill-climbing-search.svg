<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ar3" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- BIC landscape curve -->
  <path d="M 40 170 Q 80 120, 120 130 Q 160 140, 200 90 Q 240 40, 280 50 Q 320 60, 360 45 Q 400 30, 440 35" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Axes -->
  <line x1="40" y1="185" x2="450" y2="185" stroke="#334155" stroke-width="1"/>
  <line x1="40" y1="185" x2="40" y2="20" stroke="#334155" stroke-width="1"/>
  <text x="15" y="100" text-anchor="middle" font-size="10" fill="#64748b" transform="rotate(-90, 15, 100)">BIC (lower = better)</text>
  <text x="245" y="205" text-anchor="middle" font-size="10" fill="#64748b">DAG search space</text>

  <!-- Restart 1 path -->
  <circle cx="60" cy="168" r="4" fill="#f59e0b" opacity="0.5"/>
  <circle cx="110" cy="135" r="4" fill="#f59e0b" opacity="0.5"/>
  <circle cx="155" cy="138" r="4" fill="#f59e0b" opacity="0.5"/>
  <circle cx="195" cy="92" r="5" fill="#f59e0b" opacity="0.7"/>
  <text x="195" y="82" text-anchor="middle" font-size="8" fill="#b45309">restart 1</text>
  <line x1="64" y1="166" x2="106" y2="137" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.4"/>
  <line x1="114" y1="134" x2="151" y2="137" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.4"/>
  <line x1="159" y1="137" x2="191" y2="94" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.4"/>

  <!-- Restart 2 path (finds global) -->
  <circle cx="250" cy="130" r="4" fill="#10b981" opacity="0.5"/>
  <circle cx="310" cy="80" r="4" fill="#10b981" opacity="0.5"/>
  <circle cx="355" cy="48" r="4" fill="#10b981" opacity="0.7"/>
  <circle cx="395" cy="32" r="6" fill="#10b981" stroke="#10b981" stroke-width="2" opacity="0.9"/>
  <text x="395" y="22" text-anchor="middle" font-size="8" font-weight="600" fill="#065f46">restart 3 ★</text>
  <line x1="254" y1="128" x2="306" y2="82" stroke="#10b981" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.4"/>
  <line x1="314" y1="79" x2="351" y2="50" stroke="#10b981" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.4"/>
  <line x1="359" y1="47" x2="391" y2="34" stroke="#10b981" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.4"/>

  <!-- Restart 3 stuck -->
  <circle cx="140" cy="155" r="4" fill="#ef4444" opacity="0.4"/>
  <circle cx="175" cy="132" r="5" fill="#ef4444" opacity="0.5"/>
  <text x="185" y="148" text-anchor="start" font-size="8" fill="#ef4444">restart 2 (local optimum)</text>

  <!-- Legend -->
  <rect x="60" y="10" width="170" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="70" y="28" font-size="9" fill="#64748b">each step: best of add / remove / reverse</text>
</svg>
