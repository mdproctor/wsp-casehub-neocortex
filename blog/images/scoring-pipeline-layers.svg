<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d2e3fc"/>
    </linearGradient>
    <linearGradient id="badGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce8e6"/>
      <stop offset="100%" stop-color="#f8d0cc"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Where scoring happens in a multi-stage retrieval pipeline</text>

  <!-- Pipeline column -->
  <text x="200" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#5f6368" letter-spacing="1">SEARCH PIPELINE</text>

  <!-- Stage 1 -->
  <rect x="60" y="82" width="280" height="52" rx="8" fill="url(#pipeGrad)" stroke="#4285f4" stroke-width="1.2"/>
  <text x="200" y="103" text-anchor="middle" font-size="13" font-weight="600" fill="#1a73e8">Hybrid retrieval</text>
  <text x="200" y="121" text-anchor="middle" font-size="11" fill="#5f6368">BM25 + dense + sparse → RRF fusion</text>

  <!-- Arrow -->
  <line x1="200" y1="134" x2="200" y2="148" stroke="#aab0b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#aab0b8"/></marker></defs>

  <!-- Stage 2 -->
  <rect x="60" y="150" width="280" height="52" rx="8" fill="url(#pipeGrad)" stroke="#4285f4" stroke-width="1.2"/>
  <text x="200" y="171" text-anchor="middle" font-size="13" font-weight="600" fill="#1a73e8">Cross-encoder reranking</text>
  <text x="200" y="189" text-anchor="middle" font-size="11" fill="#5f6368">Pairwise relevance confirmation</text>

  <line x1="200" y1="202" x2="200" y2="216" stroke="#aab0b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="60" y="218" width="280" height="52" rx="8" fill="url(#pipeGrad)" stroke="#4285f4" stroke-width="1.2"/>
  <text x="200" y="239" text-anchor="middle" font-size="13" font-weight="600" fill="#1a73e8">Temporal + version scoring</text>
  <text x="200" y="257" text-anchor="middle" font-size="11" fill="#5f6368">TemporalDecayScorer · VersionScorer</text>

  <line x1="200" y1="270" x2="200" y2="284" stroke="#aab0b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="60" y="286" width="280" height="52" rx="8" fill="url(#pipeGrad)" stroke="#4285f4" stroke-width="1.2"/>
  <text x="200" y="307" text-anchor="middle" font-size="13" font-weight="600" fill="#1a73e8">Quality gating (CRAG)</text>
  <text x="200" y="325" text-anchor="middle" font-size="11" fill="#5f6368">Score threshold → CORRECT / AMBIGUOUS / INCORRECT</text>

  <!-- Bracket label -->
  <line x1="355" y1="86" x2="370" y2="86" stroke="#4285f4" stroke-width="1.2"/>
  <line x1="370" y1="86" x2="370" y2="334" stroke="#4285f4" stroke-width="1.2"/>
  <line x1="355" y1="334" x2="370" y2="334" stroke="#4285f4" stroke-width="1.2"/>
  <text x="382" y="200" font-size="11" fill="#4285f4" font-weight="500">Configurable</text>
  <text x="382" y="215" font-size="11" fill="#4285f4" font-weight="500">per deployment.</text>
  <text x="382" y="230" font-size="11" fill="#4285f4" font-weight="500">Recency already</text>
  <text x="382" y="245" font-size="11" fill="#4285f4" font-weight="500">handled here.</text>

  <!-- Big arrow to consumer layer -->
  <line x1="200" y1="338" x2="200" y2="368" stroke="#aab0b8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="260" y="358" font-size="10" fill="#aab0b8" font-style="italic">results scored &amp; ranked</text>

  <!-- Consumer layer label -->
  <text x="200" y="388" text-anchor="middle" font-size="12" font-weight="600" fill="#5f6368" letter-spacing="1">CONSUMER LAYER</text>

  <!-- The bad box -->
  <rect x="60" y="398" width="280" height="52" rx="8" fill="url(#badGrad)" stroke="#d93025" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="200" y="419" text-anchor="middle" font-size="13" font-weight="600" fill="#c5221f">Hardcoded 30-day decay</text>
  <text x="200" y="437" text-anchor="middle" font-size="11" fill="#80271c">recencyDecay(Duration.ofDays(30))</text>

  <!-- Strike-through -->
  <line x1="80" y1="424" x2="320" y2="424" stroke="#d93025" stroke-width="2.5" opacity="0.6"/>

  <!-- Label -->
  <text x="382" y="418" font-size="11" fill="#d93025" font-weight="600">Duplicate concern.</text>
  <text x="382" y="433" font-size="11" fill="#d93025" font-weight="500">Recency already scored</text>
  <text x="382" y="448" font-size="11" fill="#d93025" font-weight="500">by the pipeline above.</text>

  <!-- Result -->
  <rect x="60" y="466" width="280" height="38" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.2"/>
  <text x="200" y="490" text-anchor="middle" font-size="13" font-weight="600" fill="#137333">Pass through — trust the pipeline</text>

  <line x1="200" y1="450" x2="200" y2="466" stroke="#34a853" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <defs><marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34a853"/></marker></defs>
</svg>