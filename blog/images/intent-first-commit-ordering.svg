<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui,-apple-system,sans-serif" font-size="13">
  <style>
    .step-box { rx: 6; ry: 6; }
    .safe { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.5; }
    .danger { fill: #fff3e0; stroke: #ff9800; stroke-width: 1.5; }
    .critical { fill: #fce4ec; stroke: #e53935; stroke-width: 1.5; }
    .label { font-size: 12px; fill: #424242; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #757575; }
    .arrow { stroke: #616161; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .crash-line { stroke: #e53935; stroke-width: 2; stroke-dasharray: 6,4; }
    .crash-label { font-size: 11px; fill: #c62828; font-weight: 600; }
    .title { font-size: 15px; fill: #212121; font-weight: 700; }
    .note { font-size: 10.5px; fill: #616161; font-style: italic; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#616161"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" class="title">Intent-First Commit Ordering (Option A)</text>

  <!-- Step 1: Intent + Lived Profile -->
  <rect x="30" y="55" width="150" height="60" class="step-box safe"/>
  <text x="105" y="78" text-anchor="middle" class="label">1. Intent</text>
  <text x="105" y="94" text-anchor="middle" class="sublabel">pendingEvolution</text>
  <text x="105" y="107" text-anchor="middle" class="sublabel">+ livedProfile</text>

  <!-- Step 2 (B only, greyed) -->
  <rect x="210" y="55" width="120" height="60" class="step-box" style="fill:#f5f5f5; stroke:#bdbdbd; stroke-width:1; stroke-dasharray:4,3;"/>
  <text x="270" y="78" text-anchor="middle" class="sublabel" style="fill:#9e9e9e;">2. Identity write</text>
  <text x="270" y="94" text-anchor="middle" class="sublabel" style="fill:#bdbdbd;">(Option B only)</text>

  <!-- Step 3: Clear signals -->
  <rect x="360" y="55" width="140" height="60" class="step-box danger"/>
  <text x="430" y="78" text-anchor="middle" class="label">3. Clear signals</text>
  <text x="430" y="94" text-anchor="middle" class="sublabel">close signal epoch</text>

  <!-- Step 5: Close epoch -->
  <rect x="530" y="55" width="150" height="60" class="step-box safe"/>
  <text x="605" y="78" text-anchor="middle" class="label">5. Close epoch</text>
  <text x="605" y="94" text-anchor="middle" class="sublabel">intent cleared</text>
  <text x="605" y="107" text-anchor="middle" class="sublabel">case → outbox</text>

  <!-- Arrows -->
  <path d="M180,85 L208,85" class="arrow"/>
  <path d="M330,85 L358,85" class="arrow"/>
  <path d="M500,85 L528,85" class="arrow"/>

  <!-- Crash window annotations -->
  <line x1="340" y1="130" x2="340" y2="175" class="crash-line"/>
  <line x1="520" y1="130" x2="520" y2="175" class="crash-line"/>

  <text x="430" y="150" text-anchor="middle" class="crash-label">crash window</text>

  <!-- Recovery box -->
  <rect x="80" y="190" width="560" height="85" class="step-box" style="fill:#e3f2fd; stroke:#1976d2; stroke-width:1.5;"/>
  <text x="360" y="212" text-anchor="middle" class="label" style="fill:#1565c0;">Recovery (runs BEFORE wall-clock gate, every run)</text>
  <text x="360" y="232" text-anchor="middle" class="sublabel">if pendingEvolution != null:</text>
  <text x="360" y="248" text-anchor="middle" class="sublabel">clear signals → closeEpoch → flush audit outbox</text>
  <text x="360" y="264" text-anchor="middle" class="sublabel">resumes at the first incomplete step — never re-commits</text>

  <!-- Crash consequence table -->
  <rect x="30" y="300" width="660" height="105" class="step-box" style="fill:#fafafa; stroke:#e0e0e0; stroke-width:1;"/>
  <text x="40" y="320" class="label">Crash point</text>
  <text x="340" y="320" class="label">Effect</text>
  <text x="560" y="320" class="label">Class</text>
  <line x1="30" y1="328" x2="690" y2="328" stroke="#e0e0e0" stroke-width="1"/>
  <text x="40" y="348" class="sublabel">After intent, before clear</text>
  <text x="340" y="348" class="sublabel">Recovery re-clears; idempotent</text>
  <text x="560" y="348" class="sublabel">retried</text>
  <line x1="30" y1="358" x2="690" y2="358" stroke="#f5f5f5" stroke-width="1"/>
  <text x="40" y="378" class="sublabel">After clear, before closeEpoch</text>
  <text x="340" y="378" class="sublabel">Re-clear erases ≤1 interval of signals</text>
  <text x="560" y="378" class="sublabel">boundary under-count</text>
  <line x1="30" y1="388" x2="690" y2="388" stroke="#f5f5f5" stroke-width="1"/>
  <text x="40" y="405" class="sublabel">CBR store down for days</text>
  <text x="340" y="405" class="sublabel">Outbox retries; give-up after 5 periods</text>
  <text x="560" y="405" class="sublabel">audit only</text>
</svg>
