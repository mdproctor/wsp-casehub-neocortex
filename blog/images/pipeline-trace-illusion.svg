<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
    .label { font-size: 12px; fill: #1a1a2e; }
    .sublabel { font-size: 10px; fill: #666; }
    .tick-box { fill: #e8f4f8; stroke: #2196F3; stroke-width: 1.5; rx: 6; }
    .consol-box { fill: #fce4ec; stroke: #e91e63; stroke-width: 1.5; rx: 6; }
    .trace-box { fill: #f3e5f5; stroke: #9c27b0; stroke-width: 1.5; rx: 6; }
    .arrow { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .arrow-false { stroke: #e91e63; stroke-width: 1.5; stroke-dasharray: 6,4; fill: none; }
    .arrow-real { stroke: #2196F3; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .arrow-assemble { stroke: #9c27b0; stroke-width: 1.5; fill: none; marker-end: url(#arrowpurple); }
    .phase-label { font-size: 11px; font-weight: 600; }
    .tick-label { fill: #1565C0; }
    .consol-label { fill: #c62828; }
    .warning { font-size: 11px; fill: #c62828; font-style: italic; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <marker id="arrowpurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9c27b0"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" class="title" font-size="16">What the Trace Shows vs What Actually Happens</text>

  <!-- Phase labels -->
  <text x="200" y="60" text-anchor="middle" class="phase-label tick-label">tick() — runs every turn</text>
  <text x="620" y="60" text-anchor="middle" class="phase-label consol-label">consolidate() — runs periodically</text>

  <!-- Tick-time boxes -->
  <rect x="40" y="75" width="130" height="36" class="tick-box"/>
  <text x="105" y="97" text-anchor="middle" class="label">Observation</text>

  <rect x="40" y="135" width="130" height="36" class="tick-box"/>
  <text x="105" y="152" text-anchor="middle" class="label">Salience</text>
  <text x="105" y="164" text-anchor="middle" class="sublabel">ConcernBased</text>

  <rect x="40" y="195" width="130" height="36" class="tick-box"/>
  <text x="105" y="212" text-anchor="middle" class="label">Appraisal</text>
  <text x="105" y="224" text-anchor="middle" class="sublabel">LLM emotions + PAD</text>

  <rect x="200" y="195" width="130" height="36" class="tick-box"/>
  <text x="265" y="212" text-anchor="middle" class="label">Regulation</text>
  <text x="265" y="224" text-anchor="middle" class="sublabel">LLM strategy selection</text>

  <rect x="200" y="135" width="130" height="36" class="tick-box"/>
  <text x="265" y="152" text-anchor="middle" class="label">Drives</text>
  <text x="265" y="164" text-anchor="middle" class="sublabel">4 axes + curiosity</text>

  <rect x="200" y="75" width="130" height="36" class="tick-box"/>
  <text x="265" y="92" text-anchor="middle" class="label">Search Budget</text>
  <text x="265" y="104" text-anchor="middle" class="sublabel">4D personality envelope</text>

  <rect x="40" y="265" width="290" height="36" class="tick-box"/>
  <text x="185" y="287" text-anchor="middle" class="label">Prompt Sections (rendered text)</text>

  <!-- Tick arrows -->
  <path d="M 105 111 L 105 135" class="arrow-real"/>
  <path d="M 105 171 L 105 195" class="arrow-real"/>
  <path d="M 170 213 L 200 213" class="arrow-real"/>
  <path d="M 170 153 L 200 153" class="arrow-real"/>
  <path d="M 265 171 L 265 195" class="arrow-real"/>
  <path d="M 185 231 L 185 265" class="arrow-real"/>

  <!-- Consolidation-time boxes -->
  <rect x="500" y="95" width="160" height="36" class="consol-box"/>
  <text x="580" y="112" text-anchor="middle" class="label">Graduated Nodes</text>
  <text x="580" y="124" text-anchor="middle" class="sublabel">from MindMap experiences</text>

  <rect x="500" y="155" width="160" height="36" class="consol-box"/>
  <text x="580" y="172" text-anchor="middle" class="label">CAPS Activation</text>
  <text x="580" y="184" text-anchor="middle" class="sublabel">input node → activation</text>

  <rect x="500" y="215" width="160" height="36" class="consol-box"/>
  <text x="580" y="232" text-anchor="middle" class="label">CAPS Settling</text>
  <text x="580" y="244" text-anchor="middle" class="sublabel">convergence + attractors</text>

  <!-- Consolidation arrows -->
  <path d="M 580 131 L 580 155" class="arrow-real"/>
  <path d="M 580 191 L 580 215" class="arrow-real"/>

  <!-- The false arrow -->
  <path d="M 170 213 Q 380 213 500 173" class="arrow-false"/>
  <text x="350" y="200" text-anchor="middle" class="warning">✗ This causal link does not exist</text>

  <!-- Trace assembly -->
  <rect x="380" y="320" width="380" height="100" class="trace-box"/>
  <text x="570" y="345" text-anchor="middle" class="title">PipelineTrace</text>
  <text x="570" y="365" text-anchor="middle" class="sublabel">assembled by currentTrace() — reads from both phases</text>
  <text x="440" y="390" text-anchor="start" class="sublabel">tick: appraisal, regulation, drives, channelWeights, prompts</text>
  <text x="440" y="405" text-anchor="start" class="sublabel">consolidation: capsInputActivations, capsSettling</text>

  <!-- Assembly arrows -->
  <path d="M 185 301 Q 185 360 380 360" class="arrow-assemble"/>
  <path d="M 580 251 Q 580 340 760 340 L 760 320" class="arrow-assemble"/>

  <!-- Dividing line -->
  <line x1="420" y1="50" x2="420" y2="305" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>
</svg>
