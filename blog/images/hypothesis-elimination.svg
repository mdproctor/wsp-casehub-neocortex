<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="system-ui, -apple-system, sans-serif">
  <!-- Title -->
  <text x="280" y="22" font-size="14" fill="#334155" font-weight="600" text-anchor="middle">Two elimination mechanisms</text>

  <!-- Hard elimination -->
  <rect x="20" y="40" width="250" height="220" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="145" y="65" font-size="12" fill="#dc2626" font-weight="600" text-anchor="middle">Hard elimination</text>
  <text x="145" y="82" font-size="10" fill="#64748b" text-anchor="middle">P(evidence | Hᵢ) = 0</text>

  <!-- Example -->
  <rect x="35" y="95" width="220" height="40" rx="4" fill="#fff" stroke="#fca5a5" stroke-width="1"/>
  <text x="145" y="112" font-size="10" fill="#475569" text-anchor="middle">Hypothesis: "enemy never builds</text>
  <text x="145" y="125" font-size="10" fill="#475569" text-anchor="middle">gateways"  →  prior: [0.0, 1.0]</text>

  <line x1="145" y1="135" x2="145" y2="150" stroke="#dc2626" stroke-width="1.5"/>
  <polygon points="141,150 149,150 145,156" fill="#dc2626"/>

  <rect x="35" y="158" width="220" height="30" rx="4" fill="#fff" stroke="#fca5a5" stroke-width="1"/>
  <text x="145" y="178" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="500">Observe gateway → P = 0.0</text>

  <line x1="145" y1="188" x2="145" y2="203" stroke="#dc2626" stroke-width="1.5"/>
  <polygon points="141,203 149,203 145,209" fill="#dc2626"/>

  <text x="145" y="228" font-size="11" fill="#dc2626" font-weight="600" text-anchor="middle">Eliminated immediately</text>
  <text x="145" y="245" font-size="10" fill="#64748b" text-anchor="middle">before normalisation</text>

  <!-- Soft elimination -->
  <rect x="290" y="40" width="250" height="220" rx="6" fill="#fefce8" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="415" y="65" font-size="12" fill="#a16207" font-weight="600" text-anchor="middle">Soft elimination</text>
  <text x="415" y="82" font-size="10" fill="#64748b" text-anchor="middle">weight &lt; threshold</text>

  <!-- Decay visualization -->
  <text x="310" y="105" font-size="10" fill="#475569">obs 1:  w = 0.26</text>
  <rect x="400" y="94" width="104" height="14" rx="2" fill="#fde68a"/>

  <text x="310" y="128" font-size="10" fill="#475569">obs 2:  w = 0.18</text>
  <rect x="400" y="117" width="72" height="14" rx="2" fill="#fcd34d"/>

  <text x="310" y="151" font-size="10" fill="#475569">obs 3:  w = 0.11</text>
  <rect x="400" y="140" width="44" height="14" rx="2" fill="#f59e0b"/>

  <!-- Threshold line -->
  <line x1="400" y1="165" x2="510" y2="165" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="515" y="169" font-size="9" fill="#dc2626">threshold = 0.15</text>

  <text x="310" y="186" font-size="10" fill="#dc2626" font-weight="500">obs 3:  w = 0.11  &lt;  0.15</text>
  <rect x="400" y="175" width="44" height="14" rx="2" fill="#dc2626" opacity="0.3"/>

  <line x1="415" y1="200" x2="415" y2="215" stroke="#dc2626" stroke-width="1.5"/>
  <polygon points="411,215 419,215 415,221" fill="#dc2626"/>

  <text x="415" y="240" font-size="11" fill="#a16207" font-weight="600" text-anchor="middle">Eliminated after normalise</text>
  <text x="415" y="257" font-size="10" fill="#64748b" text-anchor="middle">gradual evidence accumulation</text>
</svg>
