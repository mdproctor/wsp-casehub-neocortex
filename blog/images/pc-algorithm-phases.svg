<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ar2" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Phase 1: Complete graph -->
  <g transform="translate(30, 30)">
    <text x="50" y="-5" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Start</text>
    <circle cx="20" cy="20" r="12" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="20" y="24" text-anchor="middle" font-size="9" fill="#334155">A</text>
    <circle cx="80" cy="20" r="12" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="80" y="24" text-anchor="middle" font-size="9" fill="#334155">B</text>
    <circle cx="50" cy="70" r="12" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="50" y="74" text-anchor="middle" font-size="9" fill="#334155">C</text>
    <line x1="32" y1="20" x2="68" y2="20" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="25" y1="30" x2="43" y2="60" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="75" y1="30" x2="57" y2="60" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="50" y="100" text-anchor="middle" font-size="9" fill="#64748b">complete graph</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="135" y1="60" x2="165" y2="60" stroke="#8b5cf6" stroke-width="1" marker-end="url(#ar2)"/>
  <text x="150" y="50" text-anchor="middle" font-size="8" fill="#8b5cf6">CI tests</text>

  <!-- Phase 2: Skeleton -->
  <g transform="translate(170, 30)">
    <text x="50" y="-5" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Skeleton</text>
    <circle cx="20" cy="20" r="12" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="20" y="24" text-anchor="middle" font-size="9" fill="#334155">A</text>
    <circle cx="80" cy="20" r="12" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="80" y="24" text-anchor="middle" font-size="9" fill="#334155">B</text>
    <circle cx="50" cy="70" r="12" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="50" y="74" text-anchor="middle" font-size="9" fill="#334155">C</text>
    <!-- A-B removed (independent given C) -->
    <line x1="25" y1="30" x2="43" y2="60" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="75" y1="30" x2="57" y2="60" stroke="#8b5cf6" stroke-width="1.5"/>
    <!-- Removed edge shown dashed -->
    <line x1="32" y1="20" x2="68" y2="20" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
    <text x="50" y="100" text-anchor="middle" font-size="9" fill="#64748b">A⊥B | C → remove</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="275" y1="60" x2="305" y2="60" stroke="#8b5cf6" stroke-width="1" marker-end="url(#ar2)"/>
  <text x="290" y="50" text-anchor="middle" font-size="8" fill="#8b5cf6">orient</text>

  <!-- Phase 3: CPDAG -->
  <g transform="translate(310, 30)">
    <text x="50" y="-5" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">CPDAG</text>
    <circle cx="20" cy="20" r="12" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="24" text-anchor="middle" font-size="9" fill="#334155">A</text>
    <circle cx="80" cy="20" r="12" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="80" y="24" text-anchor="middle" font-size="9" fill="#334155">B</text>
    <circle cx="50" cy="70" r="12" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="50" y="74" text-anchor="middle" font-size="9" fill="#334155">C</text>
    <!-- Directed: A→C←B (v-structure) -->
    <line x1="28" y1="30" x2="43" y2="58" stroke="#10b981" stroke-width="1.5" marker-end="url(#ar2)"/>
    <line x1="72" y1="30" x2="57" y2="58" stroke="#10b981" stroke-width="1.5" marker-end="url(#ar2)"/>
    <text x="50" y="100" text-anchor="middle" font-size="9" fill="#64748b">A→C←B (v-structure)</text>
  </g>

  <!-- Lower: explanation -->
  <g transform="translate(30, 140)">
    <rect x="0" y="0" width="460" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="15" y="20" font-size="10" font-weight="600" fill="#334155">How PC discovers causation from correlation:</text>
    <text x="15" y="38" font-size="9" fill="#64748b">1. Start with every variable connected to every other</text>
    <text x="15" y="52" font-size="9" fill="#64748b">2. Test conditional independence — if A⊥B|C, remove the A—B edge</text>
    <text x="15" y="66" font-size="9" fill="#64748b">3. Orient edges using v-structures (A→C←B when A and B are not adjacent) + Meek's rules</text>
  </g>
</svg>
