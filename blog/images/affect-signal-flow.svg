<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-ok" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2d8a4e"/>
    </marker>
    <marker id="arrow-broken" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#c44"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Affect Signal Flow — Before and After SE6</text>

  <!-- Before side -->
  <text x="200" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#c44">Before: signals computed but lost</text>

  <!-- Boxes - Before -->
  <rect x="30" y="75" width="120" height="36" rx="6" fill="#f0f4ff" stroke="#667"/>
  <text x="90" y="98" text-anchor="middle" font-size="11" fill="#333">Appraisal</text>

  <rect x="30" y="140" width="120" height="36" rx="6" fill="#f0f4ff" stroke="#667"/>
  <text x="90" y="163" text-anchor="middle" font-size="11" fill="#333">Emotion Mapper</text>

  <rect x="30" y="205" width="120" height="36" rx="6" fill="#f0f4ff" stroke="#667"/>
  <text x="90" y="228" text-anchor="middle" font-size="11" fill="#333">Mood</text>

  <rect x="200" y="140" width="120" height="36" rx="6" fill="#f0f4ff" stroke="#667"/>
  <text x="260" y="163" text-anchor="middle" font-size="11" fill="#333">Drives</text>

  <rect x="200" y="205" width="120" height="36" rx="6" fill="#f0f4ff" stroke="#667"/>
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#333">Regulation</text>

  <rect x="200" y="75" width="120" height="36" rx="6" fill="#f0f4ff" stroke="#667"/>
  <text x="260" y="98" text-anchor="middle" font-size="11" fill="#333">Gut Feeling</text>

  <!-- Broken connections - Before -->
  <line x1="90" y1="111" x2="90" y2="137" stroke="#c44" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-broken)"/>
  <text x="105" y="130" font-size="8" fill="#c44">6 OCC gaps</text>

  <line x1="90" y1="176" x2="90" y2="202" stroke="#c44" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-broken)"/>
  <text x="105" y="196" font-size="8" fill="#c44">wrong order</text>

  <line x1="150" y1="158" x2="197" y2="158" stroke="#c44" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-broken)"/>
  <text x="175" y="152" font-size="8" fill="#c44">no agent key</text>

  <line x1="260" y1="176" x2="260" y2="202" stroke="#c44" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-broken)"/>
  <text x="275" y="196" font-size="8" fill="#c44">no pool</text>

  <line x1="200" y1="223" x2="153" y2="223" stroke="#c44" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="175" y="240" font-size="8" fill="#c44">no bridge</text>

  <line x1="260" y1="111" x2="260" y2="137" stroke="#c44" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-broken)"/>
  <text x="275" y="130" font-size="8" fill="#c44">all agents</text>

  <!-- Annotations - Before -->
  <rect x="20" y="260" width="320" height="90" rx="4" fill="#fff5f5" stroke="#c44" stroke-dasharray="3,2"/>
  <text x="35" y="280" font-size="9" fill="#933">C14: 6 missing OCC emotion mappings</text>
  <text x="35" y="295" font-size="9" fill="#933">C3: decay applied after signals, not before</text>
  <text x="35" y="310" font-size="9" fill="#933">C9: drives shared state across agents</text>
  <text x="35" y="325" font-size="9" fill="#933">C5: regulation had no resource pool</text>
  <text x="35" y="340" font-size="9" fill="#933">C12: regulated intensity never reached mood</text>

  <!-- After side -->
  <text x="600" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#2d8a4e">After: complete circuit</text>

  <!-- Boxes - After -->
  <rect x="430" y="75" width="120" height="36" rx="6" fill="#f0fff4" stroke="#2d8a4e"/>
  <text x="490" y="98" text-anchor="middle" font-size="11" fill="#333">Appraisal</text>

  <rect x="430" y="140" width="120" height="36" rx="6" fill="#f0fff4" stroke="#2d8a4e"/>
  <text x="490" y="163" text-anchor="middle" font-size="11" fill="#333">Emotion Mapper</text>

  <rect x="430" y="205" width="120" height="36" rx="6" fill="#f0fff4" stroke="#2d8a4e"/>
  <text x="490" y="228" text-anchor="middle" font-size="11" fill="#333">Mood</text>

  <rect x="600" y="140" width="120" height="36" rx="6" fill="#f0fff4" stroke="#2d8a4e"/>
  <text x="660" y="163" text-anchor="middle" font-size="11" fill="#333">Drives</text>

  <rect x="600" y="205" width="120" height="36" rx="6" fill="#f0fff4" stroke="#2d8a4e"/>
  <text x="660" y="228" text-anchor="middle" font-size="11" fill="#333">Regulation</text>

  <rect x="600" y="75" width="120" height="36" rx="6" fill="#f0fff4" stroke="#2d8a4e"/>
  <text x="660" y="98" text-anchor="middle" font-size="11" fill="#333">Gut Feeling</text>

  <!-- Connected lines - After -->
  <line x1="490" y1="111" x2="490" y2="137" stroke="#2d8a4e" stroke-width="1.5" marker-end="url(#arrow-ok)"/>
  <line x1="490" y1="176" x2="490" y2="202" stroke="#2d8a4e" stroke-width="1.5" marker-end="url(#arrow-ok)"/>
  <line x1="550" y1="158" x2="597" y2="158" stroke="#2d8a4e" stroke-width="1.5" marker-end="url(#arrow-ok)"/>
  <line x1="660" y1="176" x2="660" y2="202" stroke="#2d8a4e" stroke-width="1.5" marker-end="url(#arrow-ok)"/>
  <line x1="660" y1="111" x2="660" y2="137" stroke="#2d8a4e" stroke-width="1.5" marker-end="url(#arrow-ok)"/>

  <!-- Return path - regulation back to mood -->
  <path d="M600,223 L555,223 L555,223 L553,223" stroke="#2d8a4e" stroke-width="1.5" marker-end="url(#arrow-ok)"/>
  <text x="575" y="218" font-size="8" fill="#2d8a4e">RegulatedShift</text>

  <!-- Labels on After connections -->
  <text x="505" y="130" font-size="8" fill="#2d8a4e">all 24 OCC</text>
  <text x="505" y="196" font-size="8" fill="#2d8a4e">decay first</text>
  <text x="575" y="152" font-size="8" fill="#2d8a4e">per-agent</text>
  <text x="675" y="196" font-size="8" fill="#2d8a4e">pool wired</text>
  <text x="675" y="130" font-size="8" fill="#2d8a4e">scoped</text>

  <!-- Summary -->
  <rect x="420" y="260" width="360" height="90" rx="4" fill="#f0fff4" stroke="#2d8a4e" stroke-dasharray="3,2"/>
  <text x="435" y="280" font-size="9" fill="#1a5c30">16 fixes across 4 affect subsystems</text>
  <text x="435" y="295" font-size="9" fill="#1a5c30">Every boundary crossing had at least one bug</text>
  <text x="435" y="310" font-size="9" fill="#1a5c30">Most bugs: transmission, not computation</text>
  <text x="435" y="325" font-size="9" fill="#1a5c30">Complete affect circuit: appraisal → mood → drives → regulation → mood</text>

  <!-- Mood detail inset -->
  <text x="400" y="390" text-anchor="middle" font-size="13" font-weight="600" fill="#555">Mood Tick Ordering (C3)</text>

  <rect x="80" y="410" width="100" height="30" rx="4" fill="#fff5f5" stroke="#c44"/>
  <text x="130" y="430" text-anchor="middle" font-size="10" fill="#333">1. Apply signals</text>

  <rect x="200" y="410" width="100" height="30" rx="4" fill="#fff5f5" stroke="#c44"/>
  <text x="250" y="430" text-anchor="middle" font-size="10" fill="#333">2. Decay</text>

  <text x="310" y="460" font-size="9" fill="#c44">Signals decayed immediately — never expressed</text>

  <line x1="180" y1="425" x2="197" y2="425" stroke="#c44" stroke-width="1.2" marker-end="url(#arrow-broken)"/>

  <rect x="480" y="410" width="100" height="30" rx="4" fill="#f0fff4" stroke="#2d8a4e"/>
  <text x="530" y="430" text-anchor="middle" font-size="10" fill="#333">1. Decay</text>

  <rect x="600" y="410" width="100" height="30" rx="4" fill="#f0fff4" stroke="#2d8a4e"/>
  <text x="650" y="430" text-anchor="middle" font-size="10" fill="#333">2. Apply signals</text>

  <text x="690" y="460" font-size="9" fill="#2d8a4e">Decay clears stale state; signals land fresh</text>

  <line x1="580" y1="425" x2="597" y2="425" stroke="#2d8a4e" stroke-width="1.2" marker-end="url(#arrow-ok)"/>
</svg>