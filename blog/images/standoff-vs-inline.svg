<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="system-ui, -apple-system, sans-serif">
  <rect width="780" height="320" fill="#fafaf9" rx="8"/>
  <text x="390" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Three Ways to Handle Entity Names in Text</text>
  <rect x="20" y="50" width="240" height="250" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="140" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Inline Tokens</text>
  <text x="140" y="92" text-anchor="middle" font-size="10" fill="#dc2626">Loses surface form</text>
  <rect x="35" y="110" width="210" height="50" rx="3" fill="white" stroke="#fca5a5"/>
  <text x="140" y="132" text-anchor="middle" font-size="10" font-family="monospace" fill="#1e293b">{{entity:abc123}}</text>
  <text x="140" y="148" text-anchor="middle" font-size="10" font-family="monospace" fill="#1e293b">walked to the park</text>
  <text x="140" y="185" text-anchor="middle" font-size="10" fill="#71717a">"She" → also {{entity:abc123}}?</text>
  <text x="140" y="200" text-anchor="middle" font-size="10" fill="#71717a">Was it "Alice" or "Ms. Kahlo"?</text>
  <text x="140" y="215" text-anchor="middle" font-size="10" fill="#71717a">All original surface forms lost.</text>
  <text x="140" y="250" text-anchor="middle" font-size="11" fill="#991b1b">Every consumer must</text>
  <text x="140" y="265" text-anchor="middle" font-size="11" fill="#991b1b">resolve tokens to render</text>
  <rect x="275" y="50" width="230" height="250" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="390" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Bracket Syntax</text>
  <text x="390" y="92" text-anchor="middle" font-size="10" fill="#b45309">Changes stored text</text>
  <rect x="290" y="110" width="200" height="50" rx="3" fill="white" stroke="#fcd34d"/>
  <text x="390" y="132" text-anchor="middle" font-size="10" font-family="monospace" fill="#1e293b">Alice[node:abc123]</text>
  <text x="390" y="148" text-anchor="middle" font-size="10" font-family="monospace" fill="#1e293b">walked to the park</text>
  <text x="390" y="185" text-anchor="middle" font-size="10" fill="#71717a">Self-contained per record.</text>
  <text x="390" y="200" text-anchor="middle" font-size="10" fill="#71717a">But: every consumer must</text>
  <text x="390" y="215" text-anchor="middle" font-size="10" fill="#71717a">parse bracket syntax.</text>
  <text x="390" y="250" text-anchor="middle" font-size="11" fill="#92400e">Stored text ≠ original text</text>
  <text x="390" y="265" text-anchor="middle" font-size="11" fill="#92400e">Breaks raw consumers</text>
  <rect x="520" y="50" width="240" height="250" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="640" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Standoff Annotations ✓</text>
  <text x="640" y="92" text-anchor="middle" font-size="10" fill="#16a34a">Text unchanged, data separate</text>
  <rect x="535" y="110" width="210" height="35" rx="3" fill="white" stroke="#86efac"/>
  <text x="640" y="132" text-anchor="middle" font-size="10" font-family="monospace" fill="#1e293b">Alice walked to the park</text>
  <rect x="535" y="155" width="210" height="35" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="640" y="177" text-anchor="middle" font-size="10" font-family="monospace" fill="#166534">chars 0–5 → node:abc123</text>
  <text x="640" y="215" text-anchor="middle" font-size="10" fill="#71717a">Original text preserved.</text>
  <text x="640" y="230" text-anchor="middle" font-size="10" fill="#71717a">Surface form "Alice" kept.</text>
  <text x="640" y="245" text-anchor="middle" font-size="10" fill="#71717a">Unaware consumers work fine.</text>
  <text x="640" y="275" text-anchor="middle" font-size="11" fill="#166534">Graceful degradation</text>
  <text x="640" y="290" text-anchor="middle" font-size="11" fill="#166534">Resolution at read boundary</text>
</svg>
