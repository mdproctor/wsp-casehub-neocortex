<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="system-ui, -apple-system, sans-serif">
  <rect width="780" height="340" fill="#fafaf9" rx="8"/>
  <text x="390" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Three Ways to Handle Entity Names in Text</text>

  <!-- Option 1: Standoff annotations -->
  <rect x="20" y="50" width="235" height="270" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="137" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Standoff Annotations</text>
  <text x="137" y="92" text-anchor="middle" font-size="10" fill="#dc2626">Two systems to sync</text>

  <rect x="35" y="108" width="205" height="30" rx="3" fill="white" stroke="#fca5a5"/>
  <text x="137" y="128" text-anchor="middle" font-size="10" font-family="monospace" fill="#1e293b">Alice walked to the park</text>

  <rect x="35" y="146" width="205" height="30" rx="3" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="137" y="166" text-anchor="middle" font-size="10" font-family="monospace" fill="#991b1b">chars 0–5 → node:alice</text>

  <text x="137" y="200" text-anchor="middle" font-size="10" fill="#71717a">Parallel index with offsets.</text>
  <text x="137" y="215" text-anchor="middle" font-size="10" fill="#71717a">Lifecycle observers for sync.</text>
  <text x="137" y="230" text-anchor="middle" font-size="10" fill="#71717a">Offsets break on length change.</text>
  <text x="137" y="245" text-anchor="middle" font-size="10" fill="#71717a">Join query for "which entities?"</text>

  <text x="137" y="275" text-anchor="middle" font-size="11" fill="#991b1b">Overengineered for</text>
  <text x="137" y="290" text-anchor="middle" font-size="11" fill="#991b1b">name resolution</text>

  <!-- Option 2: Simple tokens -->
  <rect x="272" y="50" width="235" height="270" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="389" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Simple Tokens</text>
  <text x="389" y="92" text-anchor="middle" font-size="10" fill="#b45309">Loses surface form</text>

  <rect x="287" y="108" width="205" height="30" rx="3" fill="white" stroke="#fcd34d"/>
  <text x="389" y="128" text-anchor="middle" font-size="10" font-family="monospace" fill="#1e293b">{{alice}} walked to the park</text>

  <text x="389" y="170" text-anchor="middle" font-size="10" fill="#71717a">Was it "Alice" or "Ms. Kahlo"?</text>
  <text x="389" y="185" text-anchor="middle" font-size="10" fill="#71717a">No variant information.</text>
  <text x="389" y="200" text-anchor="middle" font-size="10" fill="#71717a">Can't distinguish first name</text>
  <text x="389" y="215" text-anchor="middle" font-size="10" fill="#71717a">from full name usage.</text>

  <text x="389" y="275" text-anchor="middle" font-size="11" fill="#92400e">Right idea,</text>
  <text x="389" y="290" text-anchor="middle" font-size="11" fill="#92400e">missing variant + form</text>

  <!-- Option 3: Typed tokens -->
  <rect x="524" y="50" width="235" height="270" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="641" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Typed Inline Tokens ✓</text>
  <text x="641" y="92" text-anchor="middle" font-size="10" fill="#16a34a">Identity + variant + form</text>

  <rect x="539" y="108" width="205" height="45" rx="3" fill="white" stroke="#86efac"/>
  <text x="641" y="126" text-anchor="middle" font-size="9" font-family="monospace" fill="#1e293b">{{alice:full:Alice Smith}}</text>
  <text x="641" y="142" text-anchor="middle" font-size="9" font-family="monospace" fill="#1e293b">walked to the park</text>

  <text x="641" y="180" text-anchor="middle" font-size="10" fill="#71717a">Token carries identity, variant,</text>
  <text x="641" y="195" text-anchor="middle" font-size="10" fill="#71717a">and original surface form.</text>
  <text x="641" y="210" text-anchor="middle" font-size="10" fill="#71717a">Multi-word: not a problem.</text>
  <text x="641" y="225" text-anchor="middle" font-size="10" fill="#71717a">One system, one source of truth.</text>
  <text x="641" y="240" text-anchor="middle" font-size="10" fill="#71717a">Regex scan for entity queries.</text>

  <text x="641" y="275" text-anchor="middle" font-size="11" fill="#166534">Simple, complete,</text>
  <text x="641" y="290" text-anchor="middle" font-size="11" fill="#166534">no coordination</text>
</svg>
