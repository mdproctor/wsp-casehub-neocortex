<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
    .box { rx: 8; stroke-width: 1.5; }
    .box-text { font-size: 12px; font-weight: 500; }
    .box-sub { font-size: 10px; fill: #6b7280; }
    .arrow { stroke-width: 1.5; fill: none; }
    .arrow-label { font-size: 10px; fill: #6b7280; }
    .tier-label { font-size: 10px; fill: #9ca3af; font-style: italic; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b7280"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="24" text-anchor="middle" class="title">Entity Linking Architecture — Module Dependencies</text>

  <!-- Tier labels -->
  <text x="15" y="80" class="tier-label">Tier 1</text>
  <text x="15" y="80" class="tier-label" transform="translate(0, 0)">Pure Java</text>
  <text x="15" y="190" class="tier-label">Tier 2</text>
  <text x="15" y="203" class="tier-label">Stores</text>
  <text x="15" y="290" class="tier-label">Tier 3</text>
  <text x="15" y="303" class="tier-label">CDI</text>

  <!-- Tier dividers -->
  <line x1="60" y1="130" x2="690" y2="130" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="60" y1="240" x2="690" y2="240" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Tier 1: annotation-api -->
  <rect x="230" y="48" width="240" height="70" class="box" fill="#ecfdf5" stroke="#10b981"/>
  <text x="350" y="72" text-anchor="middle" class="box-text" fill="#065f46">annotation-api</text>
  <text x="350" y="88" text-anchor="middle" class="box-sub">EntityAnnotationIndex SPI</text>
  <text x="350" y="102" text-anchor="middle" class="box-sub">AnnotationSpanResolver · AnchorParser</text>

  <!-- Tier 2: stores -->
  <rect x="120" y="148" width="170" height="55" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="205" y="172" text-anchor="middle" class="box-text" fill="#1e40af">annotation-sqlite</text>
  <text x="205" y="188" text-anchor="middle" class="box-sub">SQLite + HikariCP + Flyway</text>

  <rect x="330" y="148" width="170" height="55" class="box" fill="#fefce8" stroke="#eab308"/>
  <text x="415" y="172" text-anchor="middle" class="box-text" fill="#854d0e">annotation-inmem</text>
  <text x="415" y="188" text-anchor="middle" class="box-sub">ConcurrentHashMap (tests)</text>

  <rect x="540" y="148" width="150" height="55" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="615" y="172" text-anchor="middle" class="box-text" fill="#5b21b6">annotation-testing</text>
  <text x="615" y="188" text-anchor="middle" class="box-sub">16 contract tests</text>

  <!-- Tier 3: CDI + integration -->
  <rect x="80" y="258" width="180" height="55" class="box" fill="#fef2f2" stroke="#ef4444"/>
  <text x="170" y="282" text-anchor="middle" class="box-text" fill="#991b1b">annotation (CDI)</text>
  <text x="170" y="298" text-anchor="middle" class="box-sub">Erasure · Merge · Events</text>

  <rect x="300" y="258" width="190" height="55" class="box" fill="#fff7ed" stroke="#f97316"/>
  <text x="395" y="282" text-anchor="middle" class="box-text" fill="#9a3412">mindmap-intelligence</text>
  <text x="395" y="298" text-anchor="middle" class="box-sub">MindMapExtractor → spans</text>

  <rect x="530" y="258" width="160" height="55" class="box" fill="#fdf4ff" stroke="#d946ef"/>
  <text x="610" y="282" text-anchor="middle" class="box-text" fill="#86198f">cognition</text>
  <text x="610" y="298" text-anchor="middle" class="box-sub">Salience · Reflection · ToM</text>

  <!-- Arrows: stores → api -->
  <path d="M205,148 L320,118" class="arrow" stroke="#3b82f6" marker-end="url(#arr-blue)"/>
  <path d="M415,148 L380,118" class="arrow" stroke="#eab308" marker-end="url(#arr)"/>
  <path d="M615,148 L440,118" class="arrow" stroke="#8b5cf6" marker-end="url(#arr)"/>

  <!-- Arrows: CDI → api -->
  <path d="M170,258 L280,118" class="arrow" stroke="#ef4444" marker-end="url(#arr)"/>
  <path d="M395,258 L360,118" class="arrow" stroke="#f97316" marker-end="url(#arr)"/>
  <path d="M610,258 L420,118" class="arrow" stroke="#d946ef" marker-end="url(#arr)"/>

  <!-- Legend -->
  <text x="350" y="340" text-anchor="middle" font-size="10" fill="#9ca3af">All arrows point up — annotation-api has zero dependencies on any other neocortex module</text>
</svg>
