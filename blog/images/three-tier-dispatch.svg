<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#555"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" fill="#fafafa" rx="6"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#222">Three-Tier Dispatch — Edge Removal vs Addition</text>

  <!-- LEFT PANEL: Edge Removal (Tier 2) -->
  <rect x="16" y="44" width="338" height="340" fill="#f0faf0" rx="5" stroke="#b8e6b8"/>
  <text x="185" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#1a7a1a">Tier 2 — Edge Removal (incremental)</text>

  <!-- Original DAG -->
  <text x="100" y="92" text-anchor="middle" font-size="11" fill="#666">Before: A → B → C</text>
  <!-- Nodes -->
  <circle cx="50" cy="120" r="16" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="50" y="124" text-anchor="middle" font-weight="600" fill="#333">A</text>
  <circle cx="120" cy="120" r="16" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="120" y="124" text-anchor="middle" font-weight="600" fill="#333">B</text>
  <circle cx="190" cy="120" r="16" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="190" y="124" text-anchor="middle" font-weight="600" fill="#333">C</text>
  <!-- Edges -->
  <line x1="66" y1="120" x2="102" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="136" y1="120" x2="172" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- JT cliques before -->
  <rect x="38" y="106" width="94" height="28" rx="14" fill="none" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="108" y="106" width="94" height="28" rx="14" fill="none" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="260" y="116" font-size="10" fill="#2980b9">clique {A,B}</text>
  <text x="260" y="132" font-size="10" fill="#8e44ad">clique {B,C}</text>

  <!-- After removal -->
  <text x="100" y="178" text-anchor="middle" font-size="11" fill="#666">After: remove A→B</text>
  <!-- Nodes -->
  <circle cx="50" cy="210" r="16" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="50" y="214" text-anchor="middle" font-weight="600" fill="#333">A</text>
  <circle cx="120" cy="210" r="16" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="120" y="214" text-anchor="middle" font-weight="600" fill="#333">B</text>
  <circle cx="190" cy="210" r="16" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="190" y="214" text-anchor="middle" font-weight="600" fill="#333">C</text>
  <!-- Removed edge shown as dashed red -->
  <line x1="66" y1="210" x2="102" y2="210" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.4"/>
  <text x="84" y="200" text-anchor="middle" font-size="18" fill="#c0392b">✕</text>
  <!-- Remaining edge -->
  <line x1="136" y1="210" x2="172" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- JT cliques after — same structure! -->
  <rect x="38" y="196" width="94" height="28" rx="14" fill="none" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="108" y="196" width="94" height="28" rx="14" fill="none" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Explanation -->
  <rect x="30" y="248" width="310" height="60" rx="4" fill="#e8f5e9"/>
  <text x="185" y="266" text-anchor="middle" font-size="11" fill="#1b5e20" font-weight="600">JT unchanged — clique {A,B} ⊇ {B}</text>
  <text x="185" y="282" text-anchor="middle" font-size="11" fill="#1b5e20">B's family shrank from {A,B} to {B}</text>
  <text x="185" y="298" text-anchor="middle" font-size="11" fill="#1b5e20">Recompute clique potentials, re-calibrate</text>

  <!-- Cost label -->
  <rect x="80" y="322" width="160" height="26" rx="13" fill="#27ae60"/>
  <text x="160" y="339" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Cost: O(clique size)</text>

  <!-- RIGHT PANEL: Edge Addition (Tier 3) -->
  <rect x="366" y="44" width="338" height="340" fill="#fef0f0" rx="5" stroke="#e6b8b8"/>
  <text x="535" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#922">Tier 3 — Edge Addition (rebuild)</text>

  <!-- Original DAG -->
  <text x="470" y="92" text-anchor="middle" font-size="11" fill="#666">Before: A→C, B (separate)</text>
  <!-- Nodes -->
  <circle cx="420" cy="120" r="16" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="420" y="124" text-anchor="middle" font-weight="600" fill="#333">A</text>
  <circle cx="520" cy="120" r="16" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="520" y="124" text-anchor="middle" font-weight="600" fill="#333">B</text>
  <circle cx="470" cy="158" r="16" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="470" y="162" text-anchor="middle" font-weight="600" fill="#333">C</text>
  <!-- Edge A→C -->
  <line x1="433" y1="133" x2="458" y2="146" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- JT clique before -->
  <rect x="407" y="106" width="76" height="66" rx="12" fill="none" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="610" y="120" font-size="10" fill="#2980b9">clique {A,C}</text>
  <text x="610" y="136" font-size="10" fill="#888">B not in this clique</text>

  <!-- After addition -->
  <text x="470" y="196" text-anchor="middle" font-size="11" fill="#666">After: add B→C</text>
  <!-- Nodes -->
  <circle cx="420" cy="228" r="16" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="420" y="232" text-anchor="middle" font-weight="600" fill="#333">A</text>
  <circle cx="520" cy="228" r="16" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="520" y="232" text-anchor="middle" font-weight="600" fill="#333">B</text>
  <circle cx="470" cy="266" r="16" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="470" y="270" text-anchor="middle" font-weight="600" fill="#333">C</text>
  <!-- Edge A→C -->
  <line x1="433" y1="241" x2="458" y2="254" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- New edge B→C in green -->
  <line x1="507" y1="241" x2="482" y2="254" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="510" y="254" font-size="10" font-weight="600" fill="#27ae60">new</text>

  <!-- Explanation -->
  <rect x="380" y="290" width="310" height="60" rx="4" fill="#ffebee"/>
  <text x="535" y="308" text-anchor="middle" font-size="11" fill="#b71c1c" font-weight="600">JT invalid — {A,C} ⊉ {A,B,C}</text>
  <text x="535" y="324" text-anchor="middle" font-size="11" fill="#b71c1c">C's family grew from {A,C} to {A,B,C}</text>
  <text x="535" y="340" text-anchor="middle" font-size="11" fill="#b71c1c">Rebuild JT, snapshot + restore evidence</text>

  <!-- Cost label -->
  <rect x="430" y="356" width="210" height="26" rx="13" fill="#c0392b"/>
  <text x="535" y="373" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Cost: O(full JT construction)</text>
</svg>
