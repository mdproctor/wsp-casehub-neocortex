<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Search Budget Pipeline — Where Capacity Enters</text>

  <!-- Pipeline boxes -->
  <rect x="20" y="52" width="120" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="80" y="70" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">1. Base Logistic</text>
  <text x="80" y="83" text-anchor="middle" font-size="9" fill="#94a3b8">personality shape</text>

  <line x1="140" y1="74" x2="158" y2="74" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="160" y="52" width="120" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="220" y="70" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">2. Extreme Decay</text>
  <text x="220" y="83" text-anchor="middle" font-size="9" fill="#94a3b8">Yerkes-Dodson</text>

  <line x1="280" y1="74" x2="298" y2="74" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="300" y="52" width="120" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="360" y="70" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">3-5. Modulation</text>
  <text x="360" y="83" text-anchor="middle" font-size="9" fill="#94a3b8">drives, mood, channel</text>

  <line x1="420" y1="74" x2="438" y2="74" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="440" y="52" width="120" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="500" y="70" text-anchor="middle" font-size="10" font-weight="500" fill="#92400e">6. Fatigue</text>
  <text x="500" y="83" text-anchor="middle" font-size="9" fill="#b45309">Hockey 1997</text>

  <line x1="560" y1="74" x2="578" y2="74" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow-red)"/>

  <rect x="580" y="48" width="120" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="640" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">7. Capacity</text>
  <text x="640" y="82" text-anchor="middle" font-size="9" fill="#b91c1c">ceiling</text>
  <text x="640" y="93" text-anchor="middle" font-size="8" fill="#dc2626">NEW</text>

  <!-- Gap illustration -->
  <text x="360" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">The Capacity Gap — Wanting vs. Being Able</text>

  <!-- Two agent comparison -->
  <!-- Agent A: High Openness, High Intellect -->
  <text x="180" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">Agent A: High Openness + High Intellect</text>

  <!-- Depth bar A -->
  <text x="52" y="198" text-anchor="end" font-size="10" fill="#475569">depth</text>
  <rect x="60" y="187" width="240" height="16" rx="3" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.8"/>
  <rect x="60" y="187" width="204" height="16" rx="3" fill="#0284c7"/>
  <text x="270" y="199" text-anchor="start" font-size="9" fill="#475569">0.85</text>
  <!-- Ceiling line A -->
  <line x1="276" y1="185" x2="276" y2="205" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="280" y="213" font-size="8" fill="#16a34a">ceiling 0.90</text>

  <!-- Laterality bar A -->
  <text x="52" y="238" text-anchor="end" font-size="10" fill="#475569">laterality</text>
  <rect x="60" y="227" width="240" height="16" rx="3" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.8"/>
  <rect x="60" y="227" width="168" height="16" rx="3" fill="#0284c7"/>
  <text x="232" y="239" text-anchor="start" font-size="9" fill="#475569">0.70</text>
  <line x1="216" y1="225" x2="216" y2="245" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="220" y="253" font-size="8" fill="#16a34a">ceiling 0.85</text>

  <!-- No gap annotation -->
  <text x="180" y="273" text-anchor="middle" font-size="10" font-style="italic" fill="#16a34a">No gap — operating within capacity</text>

  <!-- Agent B: High Openness, Low Intellect -->
  <text x="540" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">Agent B: High Openness + Low Intellect</text>

  <!-- Depth bar B -->
  <text x="412" y="198" text-anchor="end" font-size="10" fill="#475569">depth</text>
  <rect x="420" y="187" width="240" height="16" rx="3" fill="#fee2e2" stroke="#fecaca" stroke-width="0.8"/>
  <rect x="420" y="187" width="204" height="16" rx="3" fill="#ef4444" opacity="0.3"/>
  <rect x="420" y="187" width="144" height="16" rx="3" fill="#dc2626"/>
  <text x="568" y="199" text-anchor="start" font-size="9" fill="#94a3b8" text-decoration="line-through">0.85</text>
  <text x="568" y="199" text-anchor="start" font-size="9" fill="#dc2626" dx="24">→ 0.60</text>
  <!-- Ceiling line B -->
  <line x1="564" y1="185" x2="564" y2="205" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Laterality bar B -->
  <text x="412" y="238" text-anchor="end" font-size="10" fill="#475569">laterality</text>
  <rect x="420" y="227" width="240" height="16" rx="3" fill="#fee2e2" stroke="#fecaca" stroke-width="0.8"/>
  <rect x="420" y="227" width="168" height="16" rx="3" fill="#ef4444" opacity="0.3"/>
  <rect x="420" y="227" width="120" height="16" rx="3" fill="#dc2626"/>
  <text x="592" y="239" text-anchor="start" font-size="9" fill="#94a3b8" text-decoration="line-through">0.70</text>
  <text x="592" y="239" text-anchor="start" font-size="9" fill="#dc2626" dx="24">→ 0.50</text>
  <line x1="540" y1="225" x2="540" y2="245" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Gap annotation -->
  <text x="540" y="273" text-anchor="middle" font-size="10" font-style="italic" fill="#dc2626">Capacity gap — motivation exceeds ability</text>

  <!-- Bottom: what the gap produces -->
  <rect x="120" y="295" width="480" height="55" rx="8" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="314" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">The gap signal drives prose generation</text>
  <text x="360" y="330" text-anchor="middle" font-size="9" fill="#64748b">Agent A (no gap): "You trace each thread methodically before moving to the next."</text>
  <text x="360" y="344" text-anchor="middle" font-size="9" fill="#dc2626">Agent B (gap): "You can feel where your reasoning chain reaches its limit —</text>
  <text x="360" y="356" text-anchor="middle" font-size="9" fill="#dc2626">three, four steps deep and the earlier links start to blur."</text>

  <!-- Legend -->
  <rect x="20" y="365" width="10" height="10" rx="2" fill="#0284c7"/>
  <text x="34" y="374" font-size="8" fill="#475569">Personality-driven activation</text>
  <rect x="170" y="365" width="10" height="10" rx="2" fill="#ef4444" opacity="0.3"/>
  <text x="184" y="374" font-size="8" fill="#475569">Clipped by ceiling</text>
  <line x1="300" y1="370" x2="320" y2="370" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="324" y="374" font-size="8" fill="#475569">Capacity ceiling (unconstrained)</text>
  <line x1="500" y1="370" x2="520" y2="370" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="524" y="374" font-size="8" fill="#475569">Capacity ceiling (binding)</text>
</svg>
