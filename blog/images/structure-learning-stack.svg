<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Phase 1: Hand-specified -->
  <rect x="20" y="195" width="400" height="45" rx="6" fill="url(#s1)" stroke="#3b82f6" stroke-width="1"/>
  <text x="30" y="215" font-size="9" fill="#3b82f6" font-weight="600">Phase 1</text>
  <text x="100" y="215" font-size="11" fill="#1e40af">Hand-specified networks + exact inference</text>
  <text x="100" y="230" font-size="9" fill="#64748b">BayesNetworkBuilder → JunctionTree → BayesInstance</text>

  <!-- Phase 2: Parameter learning -->
  <rect x="20" y="140" width="400" height="45" rx="6" fill="url(#s2)" stroke="#8b5cf6" stroke-width="1"/>
  <text x="30" y="160" font-size="9" fill="#8b5cf6" font-weight="600">Phase 2</text>
  <text x="100" y="160" font-size="11" fill="#5b21b6">Parameter learning + LLM elicitation</text>
  <text x="100" y="175" font-size="9" fill="#64748b">ParameterLearner · NetworkElicitor · OnlineParameterUpdater</text>

  <!-- Phase 3B: Structure + Validation -->
  <rect x="20" y="85" width="400" height="45" rx="6" fill="url(#s3)" stroke="#f59e0b" stroke-width="1"/>
  <text x="30" y="105" font-size="9" fill="#f59e0b" font-weight="600">Phase 3B</text>
  <text x="100" y="105" font-size="11" fill="#92400e">Structure learning + model validation</text>
  <text x="100" y="120" font-size="9" fill="#64748b">StructureLearner (PC + HC) · ModelValidator · ModelSelector · Calibration</text>

  <!-- Phase 3B+ future -->
  <rect x="20" y="30" width="400" height="45" rx="6" fill="url(#s4)" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="30" y="50" font-size="9" fill="#10b981" font-weight="600">Next</text>
  <text x="100" y="50" font-size="11" fill="#065f46">LLM + data fusion</text>
  <text x="100" y="65" font-size="9" fill="#64748b">#677 — StructuralConstraints bridge between elicitation and data</text>

  <!-- Phase labels on right -->
  <text x="425" y="220" font-size="8" fill="#94a3b8">#629</text>
  <text x="425" y="165" font-size="8" fill="#94a3b8">#642</text>
  <text x="425" y="110" font-size="8" fill="#94a3b8">#675+#676</text>
  <text x="425" y="55" font-size="8" fill="#94a3b8">#677</text>
</svg>
