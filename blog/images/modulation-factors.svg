<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafaf9" rx="8"/>
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">How Modulation Factors Compose</text>

  <!-- Raw results -->
  <rect x="30" y="55" width="140" height="220" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="100" y="78" text-anchor="middle" font-weight="600" font-size="12" fill="#475569">CaseMemoryStore</text>
  <text x="100" y="95" text-anchor="middle" font-size="11" fill="#64748b">raw results</text>

  <rect x="45" y="110" width="110" height="24" rx="3" fill="#e2e8f0"/>
  <text x="100" y="127" text-anchor="middle" font-size="10" fill="#334155">memory A — 1.0</text>
  <rect x="45" y="140" width="110" height="24" rx="3" fill="#e2e8f0"/>
  <text x="100" y="157" text-anchor="middle" font-size="10" fill="#334155">memory B — 1.0</text>
  <rect x="45" y="170" width="110" height="24" rx="3" fill="#e2e8f0"/>
  <text x="100" y="187" text-anchor="middle" font-size="10" fill="#334155">memory C — 1.0</text>
  <rect x="45" y="200" width="110" height="24" rx="3" fill="#e2e8f0"/>
  <text x="100" y="217" text-anchor="middle" font-size="10" fill="#334155">memory D — 1.0</text>
  <rect x="45" y="230" width="110" height="24" rx="3" fill="#e2e8f0"/>
  <text x="100" y="247" text-anchor="middle" font-size="10" fill="#334155">memory E — 1.0</text>

  <!-- Arrow to factors -->
  <line x1="170" y1="165" x2="198" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Factor chain -->
  <rect x="200" y="50" width="130" height="55" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="265" y="72" text-anchor="middle" font-weight="600" font-size="11" fill="#1e40af">Recency Decay</text>
  <text x="265" y="90" text-anchor="middle" font-size="10" fill="#3b82f6">static · always on</text>

  <rect x="200" y="115" width="130" height="55" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="265" y="137" text-anchor="middle" font-weight="600" font-size="11" fill="#1e40af">Confidence</text>
  <text x="265" y="155" text-anchor="middle" font-size="10" fill="#3b82f6">static · always on</text>

  <rect x="200" y="180" width="130" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="265" y="202" text-anchor="middle" font-weight="600" font-size="11" fill="#92400e">Mood Congruence</text>
  <text x="265" y="220" text-anchor="middle" font-size="10" fill="#d97706">contextual · needs mood</text>

  <rect x="200" y="245" width="130" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="265" y="267" text-anchor="middle" font-weight="600" font-size="11" fill="#92400e">Goal Relevance</text>
  <text x="265" y="285" text-anchor="middle" font-size="10" fill="#d97706">contextual · needs graph</text>

  <!-- Multiplication symbol -->
  <text x="350" y="170" text-anchor="middle" font-size="24" fill="#475569">×</text>

  <!-- Arrow to results -->
  <line x1="360" y1="165" x2="398" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Modulated results -->
  <rect x="400" y="55" width="290" height="280" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="545" y="78" text-anchor="middle" font-weight="600" font-size="12" fill="#065f46">Modulated Output</text>
  <text x="545" y="95" text-anchor="middle" font-size="11" fill="#059669">re-ranked by composite score</text>

  <!-- Row 1: memory C -->
  <rect x="415" y="110" width="260" height="40" rx="4" fill="#d1fae5"/>
  <text x="428" y="128" font-size="12" fill="#065f46" font-weight="700">memory C</text>
  <text x="662" y="128" font-size="12" fill="#065f46" text-anchor="end" font-weight="700">0.92</text>
  <text x="428" y="143" font-size="9" fill="#047857">recent · positive affect · goal-aligned</text>

  <!-- Row 2: memory A -->
  <rect x="415" y="158" width="260" height="40" rx="4" fill="#d1fae5"/>
  <text x="428" y="176" font-size="12" fill="#065f46" font-weight="700">memory A</text>
  <text x="662" y="176" font-size="12" fill="#065f46" text-anchor="end" font-weight="700">0.71</text>
  <text x="428" y="191" font-size="9" fill="#047857">recent · high confidence</text>

  <!-- Row 3: memory E -->
  <rect x="415" y="206" width="260" height="40" rx="4" fill="#d1fae5"/>
  <text x="428" y="224" font-size="12" fill="#065f46" font-weight="700">memory E</text>
  <text x="662" y="224" font-size="12" fill="#065f46" text-anchor="end" font-weight="700">0.45</text>
  <text x="428" y="239" font-size="9" fill="#047857">moderate on all axes</text>

  <!-- Row 4: memory B -->
  <rect x="415" y="254" width="260" height="40" rx="4" fill="#fef9c3"/>
  <text x="428" y="272" font-size="12" fill="#854d0e" font-weight="700">memory B</text>
  <text x="662" y="272" font-size="12" fill="#854d0e" text-anchor="end" font-weight="700">0.18</text>
  <text x="428" y="287" font-size="9" fill="#a16207">stale · low confidence</text>

  <!-- Row 5: memory D -->
  <rect x="415" y="302" width="260" height="24" rx="4" fill="#fee2e2"/>
  <text x="428" y="319" font-size="12" fill="#991b1b" font-weight="700">memory D</text>
  <text x="662" y="319" font-size="12" fill="#991b1b" text-anchor="end" font-weight="700">0.04</text>

  <!-- Legend -->
  <rect x="30" y="345" width="12" height="12" rx="2" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="48" y="356" font-size="10" fill="#475569">static factor</text>
  <rect x="140" y="345" width="12" height="12" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="158" y="356" font-size="10" fill="#475569">contextual factor (needs tick context)</text>
</svg>
