<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Shadow Frame Data Flow</text>

  <!-- Layer 1: Extraction -->
  <rect x="30" y="50" width="660" height="90" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="50" y="72" font-weight="600" fill="#1a73e8" font-size="12">EXTRACTION (biography import)</text>

  <rect x="50" y="82" width="180" height="44" rx="4" fill="white" stroke="#aaa"/>
  <text x="140" y="100" text-anchor="middle" font-size="11" fill="#333">PersonalityProfileEntry</text>
  <text x="140" y="116" text-anchor="middle" font-size="10" fill="#666">ArchetypeSelection + PhaseSalience</text>

  <line x1="230" y1="104" x2="280" y2="104" stroke="#555" marker-end="url(#arrowhead)"/>

  <rect x="280" y="82" width="180" height="44" rx="4" fill="white" stroke="#aaa"/>
  <text x="370" y="100" text-anchor="middle" font-size="11" fill="#333">PersonalityProfileHandler</text>
  <text x="370" y="116" text-anchor="middle" font-size="10" fill="#666">writes MindMap properties</text>

  <line x1="460" y1="104" x2="510" y2="104" stroke="#555" marker-end="url(#arrowhead)"/>

  <rect x="510" y="82" width="160" height="44" rx="4" fill="#fff3e0" stroke="#e65100"/>
  <text x="590" y="100" text-anchor="middle" font-size="11" fill="#333">PERSON node</text>
  <text x="590" y="116" text-anchor="middle" font-size="10" fill="#666">archetype-1-salience-*</text>

  <!-- Layer 2: Consolidation -->
  <rect x="30" y="160" width="660" height="90" rx="6" fill="#e8f5e9" stroke="#34a853" stroke-width="1.5"/>
  <text x="50" y="182" font-weight="600" fill="#0d652d" font-size="12">CONSOLIDATION (background)</text>

  <rect x="50" y="192" width="200" height="44" rx="4" fill="white" stroke="#aaa"/>
  <text x="150" y="210" text-anchor="middle" font-size="11" fill="#333">BehavioralSynthesisPhase</text>
  <text x="150" y="226" text-anchor="middle" font-size="10" fill="#666">reads snapshot + archetype</text>

  <line x1="250" y1="214" x2="300" y2="214" stroke="#555" marker-end="url(#arrowhead)"/>

  <rect x="300" y="192" width="180" height="44" rx="4" fill="#fff3e0" stroke="#e65100"/>
  <text x="390" y="210" text-anchor="middle" font-size="11" fill="#333">BEHAVIORAL node</text>
  <text x="390" y="226" text-anchor="middle" font-size="10" fill="#666">situational-mode, displaced-facets</text>

  <rect x="510" y="192" width="160" height="44" rx="4" fill="#fce4ec" stroke="#c62828"/>
  <text x="590" y="210" text-anchor="middle" font-size="11" fill="#333">SPI bridge</text>
  <text x="590" y="226" text-anchor="middle" font-size="10" fill="#666">SituationalSnapshotAccessor</text>

  <!-- Layer 3: Tick pipeline -->
  <rect x="30" y="270" width="660" height="120" rx="6" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="50" y="292" font-weight="600" fill="#6a1b9a" font-size="12">TICK PIPELINE (per interaction)</text>

  <rect x="50" y="302" width="180" height="44" rx="4" fill="white" stroke="#aaa"/>
  <text x="140" y="320" text-anchor="middle" font-size="11" fill="#333">SituationalPersonality</text>
  <text x="140" y="336" text-anchor="middle" font-size="10" fill="#666">delta × intensity × salience</text>

  <line x1="230" y1="324" x2="280" y2="324" stroke="#555" marker-end="url(#arrowhead)"/>

  <rect x="280" y="302" width="180" height="44" rx="4" fill="white" stroke="#aaa"/>
  <text x="370" y="320" text-anchor="middle" font-size="11" fill="#333">FacetRelevanceScorer</text>
  <text x="370" y="336" text-anchor="middle" font-size="10" fill="#666">|disp| × modeBoost × attrBoost</text>

  <line x1="460" y1="324" x2="510" y2="324" stroke="#555" marker-end="url(#arrowhead)"/>

  <rect x="510" y="302" width="160" height="44" rx="4" fill="white" stroke="#aaa"/>
  <text x="590" y="320" text-anchor="middle" font-size="11" fill="#333">ShadowArchetype</text>
  <text x="590" y="336" text-anchor="middle" font-size="10" fill="#666">PromptSection → LLM</text>

  <text x="140" y="375" text-anchor="middle" font-size="10" fill="#666">DevelopmentalPhaseResolver</text>
  <text x="140" y="385" text-anchor="middle" font-size="10" fill="#888">born date → current phase</text>

  <!-- Vertical connectors -->
  <line x1="590" y1="126" x2="590" y2="192" stroke="#555" stroke-dasharray="4" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="236" x2="590" y2="302" stroke="#555" stroke-dasharray="4" marker-end="url(#arrowhead)"/>
  <line x1="140" y1="140" x2="140" y2="192" stroke="#555" stroke-dasharray="4" marker-end="url(#arrowhead)"/>
</svg>
