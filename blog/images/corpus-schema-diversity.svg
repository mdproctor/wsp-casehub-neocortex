<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
    .field { font-size: 11px; fill: #2d3748; }
    .type-tag { font-size: 10px; font-weight: 500; }
    .domain-label { font-size: 13px; font-weight: 600; fill: #fff; }
    .center-label { font-size: 15px; font-weight: 700; fill: #1a1a2e; }
    .center-sub { font-size: 11px; fill: #718096; }
  </style>

  <!-- Center: CorpusType -->
  <rect x="300" y="210" width="200" height="100" rx="12" fill="#f7fafc" stroke="#cbd5e0" stroke-width="2"/>
  <text x="400" y="245" text-anchor="middle" class="center-label">CorpusType</text>
  <text x="400" y="265" text-anchor="middle" class="center-sub">requiredFields + optionalFields</text>
  <text x="400" y="282" text-anchor="middle" class="center-sub">→ Map&lt;String, FieldSchema&gt;</text>

  <!-- Garden (top-left) -->
  <rect x="30" y="20" width="240" height="170" rx="8" fill="#fff" stroke="#48bb78" stroke-width="2"/>
  <rect x="30" y="20" width="240" height="30" rx="8" fill="#48bb78"/>
  <rect x="30" y="42" width="240" height="8" fill="#48bb78"/>
  <text x="150" y="42" text-anchor="middle" class="domain-label">Knowledge Garden</text>
  <text x="45" y="72" class="field">id</text><text x="200" y="72" class="type-tag" fill="#48bb78">STRING</text>
  <text x="45" y="90" class="field">title</text><text x="200" y="90" class="type-tag" fill="#48bb78">STRING</text>
  <text x="45" y="108" class="field">type, domain</text><text x="200" y="108" class="type-tag" fill="#48bb78">STRING</text>
  <line x1="45" y1="118" x2="255" y2="118" stroke="#e2e8f0" stroke-width="1"/>
  <text x="45" y="134" class="field">tags</text><text x="200" y="134" class="type-tag" fill="#718096">STRING_LIST</text>
  <text x="45" y="152" class="field">score</text><text x="200" y="152" class="type-tag" fill="#718096">DOUBLE</text>
  <text x="45" y="170" class="field">staleness_threshold</text><text x="200" y="170" class="type-tag" fill="#718096">DURATION</text>

  <!-- Literature (top-right) -->
  <rect x="530" y="20" width="240" height="170" rx="8" fill="#fff" stroke="#4299e1" stroke-width="2"/>
  <rect x="530" y="20" width="240" height="30" rx="8" fill="#4299e1"/>
  <rect x="530" y="42" width="240" height="8" fill="#4299e1"/>
  <text x="650" y="42" text-anchor="middle" class="domain-label">Academic Literature</text>
  <text x="545" y="72" class="field">title, abstract</text><text x="700" y="72" class="type-tag" fill="#4299e1">STRING</text>
  <text x="545" y="90" class="field">authors</text><text x="700" y="90" class="type-tag" fill="#4299e1">STRING_LIST</text>
  <text x="545" y="108" class="field">year</text><text x="700" y="108" class="type-tag" fill="#4299e1">INTEGER</text>
  <line x1="545" y1="118" x2="755" y2="118" stroke="#e2e8f0" stroke-width="1"/>
  <text x="545" y="134" class="field">doi, journal</text><text x="700" y="134" class="type-tag" fill="#718096">STRING</text>
  <text x="545" y="152" class="field">citations, keywords</text><text x="700" y="152" class="type-tag" fill="#718096">STRING_LIST</text>
  <text x="545" y="170" class="field">methodology</text><text x="700" y="170" class="type-tag" fill="#718096">STRING</text>

  <!-- Clinical (bottom-left) -->
  <rect x="30" y="330" width="240" height="170" rx="8" fill="#fff" stroke="#ed8936" stroke-width="2"/>
  <rect x="30" y="330" width="240" height="30" rx="8" fill="#ed8936"/>
  <rect x="30" y="352" width="240" height="8" fill="#ed8936"/>
  <text x="150" y="352" text-anchor="middle" class="domain-label">Clinical Guidelines</text>
  <text x="45" y="382" class="field">title, condition</text><text x="200" y="382" class="type-tag" fill="#ed8936">STRING</text>
  <text x="45" y="400" class="field">version</text><text x="200" y="400" class="type-tag" fill="#ed8936">STRING</text>
  <text x="45" y="418" class="field">effective_date</text><text x="200" y="418" class="type-tag" fill="#ed8936">INSTANT</text>
  <line x1="45" y1="428" x2="255" y2="428" stroke="#e2e8f0" stroke-width="1"/>
  <text x="45" y="444" class="field">contraindications</text><text x="200" y="444" class="type-tag" fill="#718096">STRING_LIST</text>
  <text x="45" y="462" class="field">review_date</text><text x="200" y="462" class="type-tag" fill="#718096">INSTANT</text>
  <text x="45" y="480" class="field">evidence_grade</text><text x="200" y="480" class="type-tag" fill="#718096">STRING</text>

  <!-- NPC (bottom-right) -->
  <rect x="530" y="330" width="240" height="170" rx="8" fill="#fff" stroke="#9f7aea" stroke-width="2"/>
  <rect x="530" y="330" width="240" height="30" rx="8" fill="#9f7aea"/>
  <rect x="530" y="352" width="240" height="8" fill="#9f7aea"/>
  <text x="650" y="352" text-anchor="middle" class="domain-label">Game NPC World</text>
  <text x="545" y="382" class="field">name, location</text><text x="700" y="382" class="type-tag" fill="#9f7aea">STRING</text>
  <text x="545" y="400" class="field">entity_type</text><text x="700" y="400" class="type-tag" fill="#9f7aea">STRING</text>
  <line x1="545" y1="418" x2="755" y2="418" stroke="#e2e8f0" stroke-width="1"/>
  <text x="545" y="434" class="field">relationships</text><text x="700" y="434" class="type-tag" fill="#718096">STRING_LIST</text>
  <text x="545" y="452" class="field">inventory</text><text x="700" y="452" class="type-tag" fill="#718096">STRING_LIST</text>
  <text x="545" y="470" class="field">dialogue_tags</text><text x="700" y="470" class="type-tag" fill="#718096">STRING_LIST</text>
  <text x="545" y="488" class="field">quest_refs, faction</text><text x="700" y="488" class="type-tag" fill="#718096">STRING_LIST</text>

  <!-- Connector lines -->
  <line x1="270" y1="140" x2="300" y2="240" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="530" y1="140" x2="500" y2="240" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="270" y1="400" x2="300" y2="290" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="530" y1="400" x2="500" y2="290" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="6,3"/>
</svg>
