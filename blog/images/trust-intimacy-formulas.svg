<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="af" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Trust and Intimacy Update — Personality Modulation</text>

  <!-- Trust section -->
  <rect x="20" y="45" width="340" height="255" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="190" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Trust [-1, 1]</text>

  <!-- Trust positive path -->
  <rect x="40" y="85" width="300" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="190" y="102" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Positive valence (kind interactions)</text>
  <text x="190" y="118" text-anchor="middle" font-size="9" fill="#15803d">Δtrust = rate × valence × (1 − Callousness)</text>

  <!-- Trust negative path -->
  <rect x="40" y="135" width="300" height="42" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="190" y="152" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Negative valence (hostile interactions)</text>
  <text x="190" y="168" text-anchor="middle" font-size="9" fill="#dc2626">Δtrust = rate × valence × conflictMultiplier</text>

  <!-- Trust ceiling -->
  <rect x="40" y="190" width="300" height="36" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="190" y="207" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Ceiling: 1.0 − avoidance</text>
  <text x="190" y="220" text-anchor="middle" font-size="9" fill="#b45309">dismissive-avoidant (0.8) → max trust 0.2</text>

  <!-- Trust asymmetry callout -->
  <rect x="40" y="238" width="300" height="50" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="190" y="255" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">Key asymmetry</text>
  <text x="190" y="270" text-anchor="middle" font-size="9" fill="#3b82f6">Callousness dampens trust gain from kindness</text>
  <text x="190" y="282" text-anchor="middle" font-size="9" fill="#3b82f6">but NOT trust loss from betrayal</text>

  <!-- Intimacy section -->
  <rect x="380" y="45" width="320" height="185" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="540" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">Intimacy [0, 1]</text>

  <!-- Intimacy base -->
  <rect x="400" y="85" width="280" height="36" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="540" y="102" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6">Base: rate × max(0, valence) × (1 − avoidance)</text>
  <text x="540" y="115" text-anchor="middle" font-size="9" fill="#7c3aed">negative interactions have zero effect</text>

  <!-- Intimacy anxiety -->
  <rect x="400" y="130" width="280" height="36" rx="4" fill="#fdf4ff" stroke="#a855f7" stroke-width="1"/>
  <text x="540" y="147" text-anchor="middle" font-size="10" font-weight="600" fill="#6b21a8">Anxiety amplifier: × (1 + 0.5 × anxiety)</text>
  <text x="540" y="160" text-anchor="middle" font-size="9" fill="#a855f7">anxious attachment seeks closeness faster</text>

  <!-- Intimacy avoidance -->
  <rect x="400" y="175" width="280" height="42" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="540" y="192" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Avoidance dampener</text>
  <text x="540" y="208" text-anchor="middle" font-size="9" fill="#b45309">dismissive-avoidant: slow intimacy growth</text>

  <!-- Conflict multiplier table -->
  <rect x="380" y="245" width="320" height="55" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="540" y="262" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">ConflictInterpretation multipliers</text>
  <text x="430" y="280" font-size="9" fill="#16a34a" font-weight="600">REPAIR 0.6×</text>
  <text x="510" y="280" font-size="9" fill="#475569">INFO 0.9×</text>
  <text x="585" y="280" font-size="9" fill="#475569">NEUTRAL 1.0×</text>
  <text x="670" y="280" font-size="9" fill="#dc2626" font-weight="600">DISENGAGE 1.4×</text>
  <text x="540" y="295" text-anchor="middle" font-size="8" fill="#64748b">applied to negative trust delta only</text>
</svg>
