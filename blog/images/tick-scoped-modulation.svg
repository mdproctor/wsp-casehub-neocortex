<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">CognitionCore.tick() — Modulation Context Lifecycle</text>

  <!-- Phase boxes -->
  <rect x="30" y="55" width="130" height="40" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="95" y="80" text-anchor="middle" font-weight="600" fill="#1e40af">FOUNDATION</text>

  <rect x="190" y="55" width="130" height="40" rx="6" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="255" y="80" text-anchor="middle" font-weight="600" fill="#3730a3">SOURCE</text>

  <rect x="350" y="55" width="150" height="40" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="425" y="80" text-anchor="middle" font-weight="600" fill="#5b21b6">PER-SUBJECT</text>

  <rect x="530" y="55" width="130" height="40" rx="6" fill="#fae8ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="595" y="80" text-anchor="middle" font-weight="600" fill="#7e22ce">DERIVED</text>

  <!-- Phase arrows -->
  <line x1="160" y1="75" x2="188" y2="75" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="75" x2="348" y2="75" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="75" x2="528" y2="75" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- FOUNDATION contents -->
  <rect x="30" y="110" width="130" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="95" y="129" text-anchor="middle" font-size="11" fill="#475569">Mood tick</text>
  <rect x="30" y="145" width="130" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="95" y="164" text-anchor="middle" font-size="11" fill="#475569">Memory hygiene</text>

  <!-- setTickContext call — the key moment -->
  <rect x="30" y="195" width="290" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="175" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">setTickContext(mood, personality)</text>

  <!-- Arrow from mood to setTickContext -->
  <line x1="95" y1="138" x2="95" y2="193" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead-blue)"/>
  <text x="105" y="172" font-size="10" fill="#2563eb" font-style="italic">mood available</text>

  <!-- SOURCE consumers -->
  <rect x="190" y="250" width="130" height="28" rx="4" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="255" y="269" text-anchor="middle" font-size="11" fill="#065f46">Strategy reflect</text>

  <!-- PER-SUBJECT consumers -->
  <rect x="350" y="250" width="150" height="28" rx="4" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="425" y="269" text-anchor="middle" font-size="11" fill="#065f46">MentalModel BDI</text>
  <rect x="350" y="285" width="150" height="28" rx="4" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="425" y="304" text-anchor="middle" font-size="11" fill="#065f46">UserModel synthesis</text>

  <!-- DERIVED consumers -->
  <rect x="530" y="250" width="130" height="28" rx="4" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="595" y="269" text-anchor="middle" font-size="11" fill="#065f46">Gut feeling</text>

  <!-- Arrows from setTickContext to consumers -->
  <path d="M 175 231 L 175 240 L 255 240 L 255 248" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 175 231 L 175 240 L 425 240 L 425 248" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 175 231 L 175 240 L 595 240 L 595 248" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- UserModel arrow from shared line -->
  <line x1="425" y1="278" x2="425" y2="283" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Retriever box -->
  <rect x="180" y="340" width="380" height="50" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="370" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">CognitiveMemoryRetriever</text>
  <text x="370" y="378" text-anchor="middle" font-size="11" fill="#c2410c">query(MemoryQuery) → uses tick context automatically</text>

  <!-- Arrow from consumers to retriever -->
  <line x1="255" y1="278" x2="255" y2="338" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  <line x1="425" y1="313" x2="425" y2="338" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  <line x1="595" y1="278" x2="595" y2="338" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>

  <!-- Legend -->
  <rect x="580" y="390" width="12" height="12" rx="2" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="598" y="401" font-size="10" fill="#475569">= modulated consumer</text>
</svg>
