<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="system-ui, -apple-system, sans-serif">
  <rect width="720" height="460" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Positional Markdown: From PDF Page to Annotated Text</text>

  <!-- Left: PDF page visual -->
  <rect x="30" y="50" width="200" height="280" fill="white" stroke="#999" stroke-width="1.5" rx="2"/>
  <text x="130" y="42" text-anchor="middle" font-size="11" font-weight="bold" fill="#666">Original PDF Page</text>

  <!-- Header region -->
  <rect x="40" y="60" width="180" height="35" fill="#e8e0f0" stroke="#9a7aca" stroke-width="1" rx="3"/>
  <text x="130" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#6a4a9a">Annual Report 2025</text>

  <!-- Left column -->
  <rect x="40" y="105" width="85" height="160" fill="#e8f4e8" stroke="#6a9a6a" stroke-width="1" rx="3"/>
  <text x="82" y="122" text-anchor="middle" font-size="8" fill="#4a7a4a">Revenue increased</text>
  <text x="82" y="134" text-anchor="middle" font-size="8" fill="#4a7a4a">23% year over year,</text>
  <text x="82" y="146" text-anchor="middle" font-size="8" fill="#4a7a4a">driven by expansion</text>
  <text x="82" y="158" text-anchor="middle" font-size="8" fill="#4a7a4a">into SE Asian</text>
  <text x="82" y="170" text-anchor="middle" font-size="8" fill="#4a7a4a">markets...</text>
  <text x="82" y="195" text-anchor="middle" font-size="7" fill="#6a9a6a">left column</text>

  <!-- Right column -->
  <rect x="135" y="105" width="85" height="160" fill="#e8eef8" stroke="#6a8aba" stroke-width="1" rx="3"/>
  <text x="177" y="122" text-anchor="middle" font-size="7" fill="#4a6a9a">Q1  |  $4.2M</text>
  <text x="177" y="134" text-anchor="middle" font-size="7" fill="#4a6a9a">Q2  |  $4.8M</text>
  <text x="177" y="146" text-anchor="middle" font-size="7" fill="#4a6a9a">Q3  |  $5.1M</text>
  <text x="177" y="158" text-anchor="middle" font-size="7" fill="#4a6a9a">Q4  |  $5.6M</text>
  <text x="177" y="195" text-anchor="middle" font-size="7" fill="#6a8aba">right column</text>

  <!-- Footer -->
  <rect x="40" y="275" width="180" height="25" fill="#f0e8e8" stroke="#ba8a8a" stroke-width="1" rx="3"/>
  <text x="130" y="292" text-anchor="middle" font-size="8" fill="#8a5a5a">Page 1 of 24 - Confidential</text>

  <!-- Coordinate labels -->
  <text x="35" y="345" font-size="9" fill="#888">Panels have normalized</text>
  <text x="35" y="358" font-size="9" fill="#888">coordinates (0.0-1.0)</text>

  <!-- Arrow -->
  <line x1="240" y1="190" x2="290" y2="190" stroke="#666" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="265" y="180" text-anchor="middle" font-size="9" fill="#888">extract</text>

  <!-- Right: Positional markdown -->
  <rect x="300" y="50" width="390" height="380" fill="white" stroke="#4a8a4a" stroke-width="2" rx="6"/>
  <text x="495" y="42" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a6a2a">Positional Markdown Output</text>

  <!-- Frontmatter -->
  <rect x="310" y="58" width="370" height="95" fill="#f8f8f0" rx="3"/>
  <text x="320" y="74" font-size="10" fill="#888" font-family="monospace">---</text>
  <text x="320" y="88" font-size="10" fill="#666" font-family="monospace">content_format: positional-markdown</text>
  <text x="320" y="102" font-size="10" fill="#666" font-family="monospace">layout: 2-column</text>
  <text x="320" y="116" font-size="10" fill="#666" font-family="monospace">panels:</text>
  <text x="320" y="130" font-size="10" fill="#666" font-family="monospace">  - id: left   x: 0.06 w: 0.42</text>
  <text x="320" y="144" font-size="10" fill="#666" font-family="monospace">  - id: right  x: 0.52 w: 0.42</text>
  <text x="320" y="148" font-size="10" fill="#888" font-family="monospace">---</text>

  <!-- Body with annotations -->
  <text x="320" y="175" font-size="10" fill="#c44a2a" font-weight="bold" font-family="monospace">#@ panel: header</text>
  <text x="320" y="192" font-size="10" fill="#333" font-family="monospace"># Annual Report 2025</text>

  <text x="320" y="215" font-size="10" fill="#c44a2a" font-weight="bold" font-family="monospace">#@ panel: left</text>
  <text x="320" y="232" font-size="10" fill="#333" font-family="monospace">Revenue increased 23% year</text>
  <text x="320" y="246" font-size="10" fill="#333" font-family="monospace">over year, driven by the</text>
  <text x="320" y="260" font-size="10" fill="#333" font-family="monospace">expansion into SE Asian</text>
  <text x="320" y="274" font-size="10" fill="#333" font-family="monospace">markets...</text>

  <text x="320" y="297" font-size="10" fill="#c44a2a" font-weight="bold" font-family="monospace">#@ panel: right</text>
  <text x="320" y="312" font-size="10" fill="#c44a2a" font-family="monospace">#@ table: rows=4 cols=3</text>
  <text x="320" y="329" font-size="10" fill="#333" font-family="monospace">| Quarter | Revenue | Growth |</text>
  <text x="320" y="343" font-size="10" fill="#333" font-family="monospace">| Q1      | $4.2M   | 18%    |</text>
  <text x="320" y="357" font-size="10" fill="#333" font-family="monospace">| Q2      | $4.8M   | 22%    |</text>

  <text x="320" y="380" font-size="10" fill="#c44a2a" font-weight="bold" font-family="monospace">#@ panel: footer</text>
  <text x="320" y="397" font-size="10" fill="#333" font-family="monospace">Page 1 of 24 - Confidential</text>

  <!-- Legend box -->
  <rect x="310" y="408" width="370" height="18" fill="#fff3e0" rx="3"/>
  <text x="495" y="421" text-anchor="middle" font-size="9" fill="#c44a2a">#@ annotations are stripped before embedding — only clean text is indexed</text>

  <!-- Connection lines from PDF regions to annotations -->
  <line x1="220" y1="77" x2="310" y2="175" stroke="#9a7aca" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="125" y1="140" x2="310" y2="215" stroke="#6a9a6a" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="220" y1="140" x2="310" y2="297" stroke="#6a8aba" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="220" y1="287" x2="310" y2="380" stroke="#ba8a8a" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>
