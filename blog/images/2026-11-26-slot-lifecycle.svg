<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">EffectiveCognitiveDefaults Slot Lifecycle</text>

  <!-- States -->
  <rect x="40" y="60" width="120" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="100" y="86" text-anchor="middle" font-weight="500" fill="#0c4a6e">Empty</text>

  <rect x="240" y="60" width="120" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="300" y="86" text-anchor="middle" font-weight="500" fill="#14532d">Fresh</text>

  <rect x="440" y="60" width="120" height="44" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="500" y="86" text-anchor="middle" font-weight="500" fill="#713f12">Stale</text>

  <rect x="560" y="200" width="120" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="620" y="226" text-anchor="middle" font-weight="500" fill="#7f1d1d">Evicted</text>

  <!-- Transitions -->
  <!-- Empty → Fresh: forAgent() -->
  <line x1="160" y1="82" x2="232" y2="82" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="196" y="72" text-anchor="middle" font-size="11" fill="#555">forAgent()</text>

  <!-- Fresh → Stale: no access for maxAge -->
  <line x1="360" y1="82" x2="432" y2="82" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="396" y="72" text-anchor="middle" font-size="11" fill="#555">lastAccess &gt; 1h</text>

  <!-- Stale → Fresh: refreshStale() -->
  <path d="M500,104 C500,140 300,140 300,104" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="400" y="150" text-anchor="middle" font-size="11" font-weight="500" fill="#2563eb">refreshStale()</text>
  <text x="400" y="164" text-anchor="middle" font-size="10" fill="#2563eb">incrementVersion + ensureSlot</text>

  <!-- Fresh → Fresh: forAgent() / updateBase() -->
  <path d="M300,60 C280,30 320,30 300,60" fill="none" stroke="#16a34a" stroke-width="1.2"/>
  <text x="300" y="40" text-anchor="middle" font-size="10" fill="#16a34a">forAgent() / updateBase()</text>

  <!-- Stale → Evicted: idle > 24h -->
  <path d="M530,104 C550,150 600,170 610,192" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="590" y="160" text-anchor="middle" font-size="11" font-weight="500" fill="#dc2626">evictIdle()</text>
  <text x="590" y="174" text-anchor="middle" font-size="10" fill="#dc2626">lastAccess &gt; 24h</text>

  <!-- Scheduler box -->
  <rect x="40" y="200" width="440" height="120" rx="6" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="260" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">EffectiveCognitiveDefaultsScheduler (every 10m)</text>

  <rect x="60" y="240" width="180" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="150" y="262" text-anchor="middle" font-size="11" fill="#1e40af">refreshStale(60min)</text>

  <rect x="280" y="240" width="180" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="370" y="262" text-anchor="middle" font-size="11" fill="#991b1b">evictIdle(24h)</text>

  <!-- Legend -->
  <text x="60" y="302" font-size="10" fill="#6b7280">Config: casehub.cognitive.defaults.stale-refresh-minutes / idle-eviction-hours / scan-interval-minutes</text>
</svg>
