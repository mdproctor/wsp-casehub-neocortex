<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 15px; font-weight: 600; fill: #1a1a2e; }
    .label { font-size: 11px; fill: #1a1a2e; }
    .sublabel { font-size: 10px; fill: #666; }
    .real-label { font-size: 10px; fill: #1b5e20; }
    .opt-label { font-size: 10px; fill: #1565C0; font-style: italic; }
    .harness { fill: #e8f5e9; stroke: #388e3c; stroke-width: 1.5; rx: 8; }
    .orch-real { fill: #ffffff; stroke: #4caf50; stroke-width: 1; rx: 4; }
    .core-box { fill: #f3e5f5; stroke: #9c27b0; stroke-width: 1.5; rx: 6; }
    .drive-real { fill: #ffffff; stroke: #4caf50; stroke-width: 1; rx: 4; }
    .api-box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 1; rx: 4; }
    .section-label { font-size: 12px; font-weight: 600; fill: #1b5e20; }
    .connector { stroke: #999; stroke-width: 1; fill: none; marker-end: url(#arrow); }
    .pipeline-box { fill: #fff3e0; stroke: #ef6c00; stroke-width: 1; rx: 4; }
    .group-label { font-size: 10px; font-weight: 600; fill: #555; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#999"/>
    </marker>
  </defs>

  <text x="310" y="28" text-anchor="middle" class="title">After: One Harness, Real Wiring, Full API</text>

  <rect x="20" y="50" width="580" height="430" class="harness"/>
  <text x="310" y="72" text-anchor="middle" class="section-label">CognitionTestHarness</text>
  <text x="310" y="86" text-anchor="middle" class="sublabel">cognition/src/test — single source of truth</text>

  <!-- Orchestrators column -->
  <text x="130" y="108" text-anchor="middle" class="group-label">ORCHESTRATORS</text>

  <rect x="40" y="116" width="140" height="26" class="orch-real"/>
  <text x="110" y="133" text-anchor="middle" class="label">UserModelOrch</text>
  <text x="190" y="133" class="real-label">real</text>

  <rect x="40" y="146" width="140" height="26" class="orch-real"/>
  <text x="110" y="163" text-anchor="middle" class="label">MentalModelOrch</text>
  <text x="190" y="163" class="real-label">real</text>

  <rect x="40" y="176" width="140" height="26" class="orch-real"/>
  <text x="110" y="193" text-anchor="middle" class="label">StrategyOrch</text>
  <text x="190" y="193" class="real-label">real</text>

  <rect x="40" y="206" width="140" height="26" class="orch-real"/>
  <text x="110" y="223" text-anchor="middle" class="label">NarrativeOrch</text>
  <text x="190" y="223" class="real-label">real</text>

  <rect x="40" y="236" width="140" height="26" class="orch-real"/>
  <text x="110" y="253" text-anchor="middle" class="label">GoalProposalOrch</text>
  <text x="190" y="253" class="real-label">real</text>

  <rect x="40" y="266" width="140" height="26" class="orch-real"/>
  <text x="110" y="283" text-anchor="middle" class="label">InnerLifeOrch</text>
  <text x="190" y="283" class="real-label">real</text>

  <!-- Drives column -->
  <text x="130" y="312" text-anchor="middle" class="group-label">DRIVES (orchestrator-backed)</text>

  <rect x="40" y="320" width="155" height="26" class="drive-real"/>
  <text x="117" y="337" text-anchor="middle" class="label">CompetenceDrive</text>
  <text x="206" y="337" class="real-label">← Strategy</text>

  <rect x="40" y="350" width="155" height="26" class="drive-real"/>
  <text x="117" y="367" text-anchor="middle" class="label">AffiliationDrive</text>
  <text x="206" y="367" class="real-label">← UserModel</text>

  <rect x="40" y="380" width="155" height="26" class="drive-real"/>
  <text x="117" y="397" text-anchor="middle" class="label">AutonomyDrive</text>
  <text x="206" y="397" class="real-label">← MentalModel</text>

  <!-- SessionPipeline -->
  <rect x="350" y="116" width="140" height="26" class="pipeline-box"/>
  <text x="420" y="133" text-anchor="middle" class="label">SessionPipeline</text>
  <text x="500" y="133" class="opt-label">optional</text>

  <!-- Builder API -->
  <text x="420" y="172" text-anchor="middle" class="group-label">BUILDER API</text>

  <rect x="330" y="180" width="250" height="26" class="api-box"/>
  <text x="455" y="197" text-anchor="middle" class="label">.withCognitionConfig(config)</text>

  <rect x="330" y="210" width="250" height="26" class="api-box"/>
  <text x="455" y="227" text-anchor="middle" class="label">.withSessionPipeline(pipeline)</text>

  <rect x="330" y="240" width="250" height="26" class="api-box"/>
  <text x="455" y="257" text-anchor="middle" class="label">.withMindMapStore(store)</text>

  <rect x="330" y="270" width="250" height="26" class="api-box"/>
  <text x="455" y="287" text-anchor="middle" class="label">.agentFromAxes(...) / agentFromDefaults(...)</text>

  <!-- Wrapper API -->
  <text x="420" y="322" text-anchor="middle" class="group-label">WRAPPER API</text>

  <rect x="330" y="330" width="120" height="26" class="api-box"/>
  <text x="390" y="347" text-anchor="middle" class="label">tick()</text>

  <rect x="460" y="330" width="120" height="26" class="api-box"/>
  <text x="520" y="347" text-anchor="middle" class="label">observe()</text>

  <rect x="330" y="360" width="120" height="26" class="api-box"/>
  <text x="390" y="377" text-anchor="middle" class="label">renderPrompt()</text>

  <rect x="460" y="360" width="120" height="26" class="api-box"/>
  <text x="520" y="377" text-anchor="middle" class="label">consolidate()</text>

  <rect x="330" y="390" width="120" height="26" class="api-box"/>
  <text x="390" y="407" text-anchor="middle" class="label">searchBudget()</text>

  <rect x="460" y="390" width="120" height="26" class="api-box"/>
  <text x="520" y="407" text-anchor="middle" class="label">core()</text>

  <!-- CognitionCore -->
  <rect x="60" y="435" width="520" height="32" class="core-box"/>
  <text x="320" y="455" text-anchor="middle" class="label">CognitionCore — production-equivalent wiring</text>
</svg>