<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <text x="370" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Signal degradation across the shame-regulation pipeline</text>
  <text x="370" y="40" text-anchor="middle" font-size="11" fill="#64748b">Before fixes (left) vs after (right)</text>

  <!-- BEFORE -->
  <text x="185" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">BEFORE</text>

  <!-- Appraisal -->
  <rect x="20" y="80" width="140" height="60" rx="5" fill="#fef2f2" stroke="#dc2626"/>
  <text x="90" y="98" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">Appraisal</text>
  <text x="90" y="113" text-anchor="middle" font-size="10" fill="#334155">SHAME 0.87</text>
  <text x="90" y="126" text-anchor="middle" font-size="10" fill="#334155">"stomach drops..."</text>

  <!-- Regulation -->
  <rect x="20" y="155" width="140" height="55" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="90" y="173" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Regulation</text>
  <text x="90" y="188" text-anchor="middle" font-size="10" fill="#334155">0.87 → 0.54</text>
  <text x="90" y="201" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">narrative lost ✗</text>

  <!-- Prompt -->
  <rect x="20" y="225" width="140" height="65" rx="5" fill="#fee2e2" stroke="#ef4444"/>
  <text x="90" y="243" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">Prompt output</text>
  <text x="90" y="258" text-anchor="middle" font-size="10" fill="#dc2626">"displeased"</text>
  <text x="90" y="271" text-anchor="middle" font-size="10" fill="#dc2626">"short-tempered"</text>
  <text x="90" y="284" text-anchor="middle" font-size="10" fill="#dc2626">"no mental models"</text>

  <!-- Arrows -->
  <line x1="90" y1="140" x2="90" y2="153" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="90" y1="210" x2="90" y2="223" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Score -->
  <text x="185" y="298" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">Mean: 3.475</text>

  <!-- Divider -->
  <line x1="370" y1="62" x2="370" y2="295" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6,3"/>

  <!-- AFTER -->
  <text x="555" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">AFTER</text>

  <!-- Appraisal -->
  <rect x="390" y="80" width="140" height="60" rx="5" fill="#fef2f2" stroke="#dc2626"/>
  <text x="460" y="98" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">Appraisal</text>
  <text x="460" y="113" text-anchor="middle" font-size="10" fill="#334155">SHAME 0.87</text>
  <text x="460" y="126" text-anchor="middle" font-size="10" fill="#334155">"stomach drops..."</text>

  <!-- Regulation -->
  <rect x="390" y="155" width="140" height="55" rx="5" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="460" y="173" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Regulation</text>
  <text x="460" y="188" text-anchor="middle" font-size="10" fill="#334155">0.87 → 0.54</text>
  <text x="460" y="201" text-anchor="middle" font-size="10" fill="#166534">narrative propagated ✓</text>

  <!-- Prompt -->
  <rect x="390" y="225" width="140" height="65" rx="5" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="460" y="243" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Prompt output</text>
  <text x="460" y="258" text-anchor="middle" font-size="10" fill="#166534">Regulated narrative ✓</text>
  <text x="460" y="271" text-anchor="middle" font-size="10" fill="#166534">No mood label ✓</text>
  <text x="460" y="284" text-anchor="middle" font-size="10" fill="#166534">"elevated by emotion" ✓</text>

  <!-- Arrows -->
  <line x1="460" y1="140" x2="460" y2="153" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="460" y1="210" x2="460" y2="223" stroke="#22c55e" stroke-width="1.5"/>

  <!-- Score -->
  <text x="555" y="298" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Mean: 4.28</text>

  <!-- Delta arrow -->
  <text x="600" y="178" text-anchor="start" font-size="22" fill="#22c55e">→</text>
  <text x="625" y="175" text-anchor="start" font-size="11" font-weight="600" fill="#166534">+0.8</text>
</svg>
