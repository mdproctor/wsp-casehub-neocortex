<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Pull Model: compositionVersion Freshness</text>

  <!-- Writers (left column) -->
  <rect x="20" y="60" width="180" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="78" text-anchor="middle" font-weight="600" fill="#1e40af">Tick Participant</text>
  <text x="110" y="93" text-anchor="middle" font-size="11" fill="#3b82f6">transition(fn)</text>

  <rect x="20" y="120" width="180" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="138" text-anchor="middle" font-weight="600" fill="#1e40af">Deformation Phase</text>
  <text x="110" y="153" text-anchor="middle" font-size="11" fill="#3b82f6">transition(fn) + promote</text>

  <rect x="20" y="180" width="180" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="198" text-anchor="middle" font-weight="600" fill="#1e40af">Evolution Phase</text>
  <text x="110" y="213" text-anchor="middle" font-size="11" fill="#3b82f6">transition(fn) + reflect</text>

  <!-- State Service (center) -->
  <rect x="260" y="90" width="200" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="115" text-anchor="middle" font-weight="700" fill="#166534">PersonalityStateService</text>
  <text x="360" y="135" text-anchor="middle" font-size="11" fill="#16a34a">ReentrantLock[256] stripes</text>
  <line x1="280" y1="148" x2="440" y2="148" stroke="#bbf7d0" stroke-width="1"/>
  <text x="360" y="168" text-anchor="middle" font-size="12" fill="#166534">version++</text>
  <text x="360" y="186" text-anchor="middle" font-size="12" fill="#166534">compositionVersion</text>
  <text x="360" y="204" text-anchor="middle" font-size="11" fill="#6b7280">bumps only on grid crossing</text>

  <!-- CDE (right) -->
  <rect x="520" y="100" width="180" height="110" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="610" y="125" text-anchor="middle" font-weight="700" fill="#92400e">EffectiveCognitive</text>
  <text x="610" y="142" text-anchor="middle" font-weight="700" fill="#92400e">Defaults</text>
  <line x1="540" y1="155" x2="680" y2="155" stroke="#fde68a" stroke-width="1"/>
  <text x="610" y="175" text-anchor="middle" font-size="12" fill="#92400e">slot.compVersion</text>
  <text x="610" y="193" text-anchor="middle" font-size="12" fill="#92400e">== source.compVersion?</text>

  <!-- Arrows: writers → state service -->
  <line x1="200" y1="82" x2="258" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="142" x2="258" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="202" x2="258" y2="185" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: state service → CDE (pull = green, dashed) -->
  <line x1="460" y1="155" x2="518" y2="155" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>
  <text x="490" y="145" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="600">PULL</text>

  <!-- Old push (crossed out, below) -->
  <rect x="260" y="260" width="440" height="50" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="480" y="282" text-anchor="middle" font-size="12" fill="#991b1b">OLD: updateState() — writer publishes snapshot → slot</text>
  <text x="480" y="298" text-anchor="middle" font-size="11" fill="#b91c1c">❌ Deleted: writers forgot, gates were wrong, install order raced</text>

  <!-- Legend -->
  <line x1="30" y1="310" x2="60" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="65" y="314" font-size="11" fill="#475569">write (transition)</text>
  <line x1="180" y1="310" x2="210" y2="310" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>
  <text x="215" y="314" font-size="11" fill="#16a34a">pull (lazy re-derive)</text>
</svg>
