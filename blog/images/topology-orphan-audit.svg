<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
    <marker id="arrow-new" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2d7d46"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">CAPS Topology — Before and After the Orphan Audit</text>

  <!-- Before panel -->
  <rect x="10" y="40" width="380" height="410" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="200" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#666">Before: 131 connections</text>
  <text x="200" y="78" text-anchor="middle" font-size="11" fill="#999">19 of 51 output nodes orphaned (37%)</text>

  <!-- Input layer -->
  <rect x="30" y="95" width="340" height="30" rx="4" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="200" y="115" text-anchor="middle" font-size="11" fill="#1565c0">INPUT (40 nodes) — all connected</text>

  <!-- Mediating layer -->
  <rect x="30" y="145" width="340" height="30" rx="4" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="200" y="165" text-anchor="middle" font-size="11" fill="#e65100">MEDIATING (16 nodes)</text>

  <!-- Connected output -->
  <rect x="30" y="200" width="340" height="30" rx="4" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="200" y="220" text-anchor="middle" font-size="11" fill="#2e7d32">OUTPUT — connected (32 nodes)</text>

  <!-- Orphaned output -->
  <rect x="30" y="250" width="340" height="130" rx="4" fill="#ffebee" stroke="#ef9a9a"/>
  <text x="200" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">OUTPUT — orphaned (19 nodes)</text>
  <text x="45" y="290" font-size="10" fill="#c62828">conflict: assert, submit</text>
  <text x="45" y="306" font-size="10" fill="#c62828">achievement: abandon, perfectionism, risk_take</text>
  <text x="45" y="322" font-size="10" fill="#c62828">autonomy: rebel, self_direct, depend</text>
  <text x="45" y="338" font-size="10" fill="#c62828">learning: explore, consolidate, generalize, discriminate</text>
  <text x="45" y="354" font-size="10" fill="#c62828">coping: seek_information, suppress_information,</text>
  <text x="45" y="368" font-size="10" fill="#c62828">  shift_responsibility, wishful_thinking, denial,</text>
  <text x="45" y="382" font-size="10" fill="#c62828">  procrastination, resignation</text>

  <!-- No connections arrow -->
  <text x="200" y="410" text-anchor="middle" font-size="11" fill="#c62828">⚠ No incoming connections — can never activate</text>

  <!-- Arrows before -->
  <line x1="200" y1="125" x2="200" y2="145" stroke="#666" marker-end="url(#arrow)"/>
  <line x1="200" y1="175" x2="200" y2="200" stroke="#666" marker-end="url(#arrow)"/>

  <!-- After panel -->
  <rect x="410" y="40" width="380" height="410" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="600" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d7d46">After: 163 connections (+32)</text>
  <text x="600" y="78" text-anchor="middle" font-size="11" fill="#999">9 predictor-only (documented), 0 orphaned</text>

  <!-- Input layer -->
  <rect x="430" y="95" width="340" height="30" rx="4" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="600" y="115" text-anchor="middle" font-size="11" fill="#1565c0">INPUT (40 nodes)</text>

  <!-- Mediating layer -->
  <rect x="430" y="145" width="340" height="30" rx="4" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="600" y="165" text-anchor="middle" font-size="11" fill="#e65100">MEDIATING (16 nodes)</text>

  <!-- Connected output -->
  <rect x="430" y="200" width="340" height="30" rx="4" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="600" y="220" text-anchor="middle" font-size="11" fill="#2e7d32">OUTPUT — connected (42 nodes, +10)</text>

  <!-- Newly wired -->
  <rect x="430" y="250" width="340" height="90" rx="4" fill="#c8e6c9" stroke="#66bb6a" stroke-dasharray="4,2"/>
  <text x="600" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">Newly wired (10 nodes, 25 connections)</text>
  <text x="445" y="290" font-size="10" fill="#2e7d32">conflict: assert ← self_efficacy + BAS</text>
  <text x="445" y="304" font-size="10" fill="#2e7d32">achievement: abandon, perfectionism, risk_take</text>
  <text x="445" y="318" font-size="10" fill="#2e7d32">autonomy: rebel, self_direct, depend</text>
  <text x="445" y="332" font-size="10" fill="#2e7d32">learning: explore, consolidate</text>

  <!-- Predictor-only (documented) -->
  <rect x="430" y="355" width="340" height="55" rx="4" fill="#f3e5f5" stroke="#ce93d8"/>
  <text x="600" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#6a1b9a">Predictor-only — documented (9 nodes)</text>
  <text x="445" y="395" font-size="10" fill="#6a1b9a">coping (7): CopingStrategy enum, not CAPS-settled</text>
  <text x="445" y="407" font-size="10" fill="#6a1b9a">learning (2): generalize, discriminate</text>

  <!-- Coping→Regulation bridge -->
  <rect x="430" y="420" width="340" height="24" rx="4" fill="#e0f7fa" stroke="#80deea"/>
  <text x="600" y="436" text-anchor="middle" font-size="10" fill="#00695c">+ 7 coping→regulation bridges (Gross 1998)</text>

  <!-- Arrows after -->
  <line x1="600" y1="125" x2="600" y2="145" stroke="#666" marker-end="url(#arrow)"/>
  <line x1="600" y1="175" x2="600" y2="200" stroke="#2d7d46" stroke-width="1.5" marker-end="url(#arrow-new)"/>
  <line x1="600" y1="175" x2="540" y2="250" stroke="#2d7d46" stroke-width="1.5" marker-end="url(#arrow-new)"/>
</svg>
