<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <style>
      text { font-family: -apple-system, 'Segoe UI', sans-serif; }
      .axis { stroke: #333; stroke-width: 1.5; }
      .grid { stroke: #e0e0e0; stroke-width: 0.5; }
      .label { font-size: 12px; fill: #555; }
      .title { font-size: 14px; fill: #333; font-weight: 600; }
      .legend { font-size: 11px; fill: #444; }
    </style>
  </defs>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" class="title">Activation at Extreme Intensity: Before and After</text>

  <!-- Grid -->
  <line x1="70" y1="55" x2="70" y2="285" class="grid"/>
  <line x1="170" y1="55" x2="170" y2="285" class="grid"/>
  <line x1="270" y1="55" x2="270" y2="285" class="grid"/>
  <line x1="370" y1="55" x2="370" y2="285" class="grid"/>
  <line x1="470" y1="55" x2="470" y2="285" class="grid"/>
  <line x1="570" y1="55" x2="570" y2="285" class="grid"/>
  <line x1="70" y1="55" x2="570" y2="55" class="grid"/>
  <line x1="70" y1="112.5" x2="570" y2="112.5" class="grid"/>
  <line x1="70" y1="170" x2="570" y2="170" class="grid"/>
  <line x1="70" y1="227.5" x2="570" y2="227.5" class="grid"/>

  <!-- Axes -->
  <line x1="70" y1="285" x2="570" y2="285" class="axis"/>
  <line x1="70" y1="55" x2="70" y2="285" class="axis"/>

  <!-- X labels -->
  <text x="70" y="302" text-anchor="middle" class="label">0.0</text>
  <text x="170" y="302" text-anchor="middle" class="label">0.2</text>
  <text x="270" y="302" text-anchor="middle" class="label">0.4</text>
  <text x="370" y="302" text-anchor="middle" class="label">0.6</text>
  <text x="470" y="302" text-anchor="middle" class="label">0.8</text>
  <text x="570" y="302" text-anchor="middle" class="label">1.0</text>
  <text x="320" y="325" text-anchor="middle" class="label">Motivation intensity</text>

  <!-- Y labels -->
  <text x="60" y="289" text-anchor="end" class="label">0.0</text>
  <text x="60" y="231.5" text-anchor="end" class="label">0.25</text>
  <text x="60" y="174" text-anchor="end" class="label">0.50</text>
  <text x="60" y="116.5" text-anchor="end" class="label">0.75</text>
  <text x="60" y="59" text-anchor="end" class="label">1.0</text>
  <text x="30" y="170" text-anchor="middle" class="label" transform="rotate(-90,30,170)">Activation</text>

  <!-- Current model: bare logistic (both profiles converge) -->
  <!-- Bold: logistic(x, 8, 0.44) -->
  <polyline fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,4"
    points="70,283 120,280 170,270 220,240 270,170 320,95 370,63 420,57 470,55.5 520,55.2 570,55.1"/>
  <!-- Cautious: logistic(x, 4.4, 0.54) -->
  <polyline fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,4"
    points="70,275 120,268 170,255 220,232 270,195 320,150 370,110 420,82 470,66 520,58 570,55.5"/>

  <!-- Peak markers -->
  <!-- Anxious peak at 0.72 -->
  <line x1="430" y1="55" x2="430" y2="285" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="430" y="48" text-anchor="middle" font-size="10" fill="#ef4444">peak 0.72</text>
  <!-- Bold peak at 0.95 -->
  <line x1="545" y1="55" x2="545" y2="285" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="545" y="48" text-anchor="middle" font-size="10" fill="#3b82f6">peak 0.95</text>

  <!-- New model: Bold (below peak at 0.95 - essentially same as logistic) -->
  <polyline fill="none" stroke="#3b82f6" stroke-width="2.5"
    points="70,283 120,280 170,270 220,240 270,170 320,95 370,63 420,57 470,55.5 520,55.2 570,55.1"/>

  <!-- New model: Anxious worrier (breadthDecay=2.33, peaks at 0.72) -->
  <polyline fill="none" stroke="#ef4444" stroke-width="2.5"
    points="70,275 120,268 170,255 220,232 270,195 320,150 370,110 420,82 430,75 470,105 520,155 570,195"/>

  <!-- Differentiation arrows -->
  <line x1="475" y1="55.5" x2="475" y2="105" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowG)"/>
  <line x1="475" y1="105" x2="475" y2="55.5" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="490" y="82" font-size="10" fill="#22c55e" font-weight="600">gap</text>

  <defs>
    <marker id="arrowG" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Legend -->
  <line x1="90" y1="335" x2="115" y2="335" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="120" y="339" class="legend">Current (both profiles)</text>
  <line x1="280" y1="335" x2="305" y2="335" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="310" y="339" class="legend">Bold (new)</text>
  <line x1="400" y1="335" x2="425" y2="335" stroke="#ef4444" stroke-width="2.5"/>
  <text x="430" y="339" class="legend">Anxious (new)</text>
</svg>
