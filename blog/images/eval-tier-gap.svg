<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Tier labels -->
  <text x="20" y="30" font-size="13" font-weight="600" fill="#334155">Testing Tiers</text>

  <!-- Tier 1: Unit -->
  <rect x="40" y="50" width="200" height="70" rx="8" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="140" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e">Tier 1 — Unit</text>
  <text x="140" y="95" text-anchor="middle" font-size="11" fill="#475569">"Does the function return</text>
  <text x="140" y="110" text-anchor="middle" font-size="11" fill="#475569">the right value?"</text>

  <!-- Tier 2: Structural -->
  <rect x="260" y="50" width="200" height="70" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="360" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">Tier 2 — Structural</text>
  <text x="360" y="95" text-anchor="middle" font-size="11" fill="#475569">"Does the pipeline compute</text>
  <text x="360" y="110" text-anchor="middle" font-size="11" fill="#475569">different values per profile?"</text>

  <!-- Tier 3: Behavioural -->
  <rect x="480" y="50" width="200" height="70" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="580" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Tier 3 — Behavioural</text>
  <text x="580" y="95" text-anchor="middle" font-size="11" fill="#475569">"Does the LLM actually</text>
  <text x="580" y="110" text-anchor="middle" font-size="11" fill="#475569">behave differently?"</text>

  <!-- Arrows -->
  <line x1="240" y1="85" x2="258" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="85" x2="478" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- The gap -->
  <rect x="260" y="155" width="420" height="80" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="470" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">The Gap</text>
  <text x="470" y="200" text-anchor="middle" font-size="11" fill="#475569">Structural correctness ≠ behavioural influence.</text>
  <text x="470" y="218" text-anchor="middle" font-size="11" fill="#475569">A value of 0.3 breadth means nothing if the LLM ignores it.</text>

  <!-- Bottom note -->
  <text x="360" y="270" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Unit tests verify computation. LLM-judged evals verify causation.</text>
  <text x="360" y="290" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">You need both. Neither replaces the other.</text>
</svg>
