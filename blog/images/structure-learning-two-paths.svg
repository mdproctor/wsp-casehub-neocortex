<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="dataGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="pcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="hcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="specGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Data source -->
  <rect x="190" y="15" width="140" height="45" rx="6" fill="url(#dataGrad)" stroke="#64748b" stroke-width="1.5"/>
  <text x="260" y="35" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Tabular Data</text>
  <text x="260" y="50" text-anchor="middle" font-size="10" fill="#64748b">List&lt;Map&lt;String, String&gt;&gt;</text>

  <!-- Split arrows -->
  <line x1="220" y1="60" x2="130" y2="90" stroke="#94a3b8" stroke-width="1" marker-end="url(#arw)"/>
  <line x1="300" y1="60" x2="390" y2="90" stroke="#94a3b8" stroke-width="1" marker-end="url(#arw)"/>

  <!-- PC path -->
  <rect x="30" y="90" width="200" height="50" rx="6" fill="url(#pcGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="130" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">PC Algorithm</text>
  <text x="130" y="128" text-anchor="middle" font-size="10" fill="#64748b">constraint-based</text>

  <rect x="30" y="155" width="200" height="30" rx="4" fill="none" stroke="#8b5cf6" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="130" y="174" text-anchor="middle" font-size="9" fill="#7c3aed">CI tests → skeleton → v-structures → Meek's</text>

  <text x="130" y="204" text-anchor="middle" font-size="10" font-style="italic" fill="#8b5cf6">"Which edges can't exist?"</text>

  <!-- HC path -->
  <rect x="290" y="90" width="200" height="50" rx="6" fill="url(#hcGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="390" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Hill-Climbing</text>
  <text x="390" y="128" text-anchor="middle" font-size="10" fill="#64748b">score-based</text>

  <rect x="290" y="155" width="200" height="30" rx="4" fill="none" stroke="#f59e0b" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="390" y="174" text-anchor="middle" font-size="9" fill="#b45309">add/remove/reverse → BIC score → accept best</text>

  <text x="390" y="204" text-anchor="middle" font-size="10" font-style="italic" fill="#f59e0b">"Which edges improve fit?"</text>

  <!-- Converge arrows -->
  <line x1="130" y1="215" x2="220" y2="245" stroke="#94a3b8" stroke-width="1" marker-end="url(#arw)"/>
  <line x1="390" y1="215" x2="300" y2="245" stroke="#94a3b8" stroke-width="1" marker-end="url(#arw)"/>

  <!-- NetworkSpec output -->
  <rect x="170" y="245" width="180" height="50" rx="6" fill="url(#specGrad)" stroke="#10b981" stroke-width="1.5"/>
  <text x="260" y="267" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">NetworkSpec</text>
  <text x="260" y="283" text-anchor="middle" font-size="10" fill="#64748b">reviewable · status: PROPOSED</text>

  <!-- Constraint injection hint -->
  <text x="260" y="312" text-anchor="middle" font-size="9" fill="#94a3b8">↑ StructuralConstraints — required/forbidden edges, max parents</text>
</svg>
