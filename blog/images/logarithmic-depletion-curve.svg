<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" font-family="system-ui, -apple-system, sans-serif">
  <!-- Axes -->
  <line x1="60" y1="230" x2="440" y2="230" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="230" x2="60" y2="30" stroke="#333" stroke-width="1.5"/>

  <!-- X axis label -->
  <text x="250" y="265" text-anchor="middle" font-size="11" fill="#555">accumulated cognitive effort (arbitrary units)</text>

  <!-- Y axis label -->
  <text x="18" y="130" text-anchor="middle" font-size="11" fill="#555" transform="rotate(-90, 18, 130)">depletion level</text>

  <!-- Y axis ticks -->
  <text x="50" y="234" text-anchor="end" font-size="9" fill="#888">0</text>
  <text x="50" y="134" text-anchor="end" font-size="9" fill="#888">0.5</text>
  <text x="50" y="34" text-anchor="end" font-size="9" fill="#888">1.0</text>
  <line x1="57" y1="130" x2="63" y2="130" stroke="#ccc" stroke-width="1"/>
  <line x1="57" y1="30" x2="63" y2="30" stroke="#ccc" stroke-width="1"/>
  <line x1="60" y1="130" x2="440" y2="130" stroke="#eee" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Linear curve (regulation old model) -->
  <path d="M60,230 L440,30" stroke="#e91e63" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
  <text x="370" y="65" font-size="10" fill="#e91e63">linear (old regulation)</text>

  <!-- Logarithmic curve (shared pool) -->
  <path d="M60,230 Q120,120 180,95 Q240,73 300,60 Q360,50 420,43" stroke="#009688" stroke-width="2.5" fill="none"/>
  <text x="350" y="28" font-size="10" fill="#009688" font-weight="600">logarithmic (shared pool)</text>

  <!-- Annotation: easy to partially deplete -->
  <circle cx="120" cy="160" r="4" fill="#009688"/>
  <line x1="124" y1="156" x2="175" y2="120" stroke="#009688" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="180" y="115" font-size="9" fill="#009688">early effort depletes quickly</text>

  <!-- Annotation: hard to fully deplete -->
  <circle cx="360" cy="48" r="4" fill="#009688"/>
  <line x1="355" y1="53" x2="310" y2="85" stroke="#009688" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="200" y="85" font-size="9" fill="#009688">sustained multi-source load</text>
  <text x="200" y="97" font-size="9" fill="#009688">needed for full exhaustion</text>

  <!-- Region label -->
  <rect x="85" y="140" width="120" height="20" rx="3" fill="#e0f2f1" opacity="0.7"/>
  <text x="145" y="155" text-anchor="middle" font-size="9" fill="#004d40">regulation still effective</text>
</svg>
