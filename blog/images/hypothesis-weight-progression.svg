<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="system-ui, -apple-system, sans-serif">
  <!-- Title -->
  <text x="320" y="22" font-size="14" fill="#334155" font-weight="600" text-anchor="middle">SC2 scouting — weight progression as observations arrive</text>

  <!-- Column headers -->
  <text x="80" y="52" font-size="11" fill="#64748b" font-weight="600" text-anchor="middle">Observation</text>
  <text x="260" y="52" font-size="11" fill="#64748b" font-weight="600" text-anchor="middle">proxy_rush</text>
  <text x="380" y="52" font-size="11" fill="#64748b" font-weight="600" text-anchor="middle">fast_expand</text>
  <text x="490" y="52" font-size="11" fill="#64748b" font-weight="600" text-anchor="middle">dt_rush</text>
  <text x="595" y="52" font-size="11" fill="#64748b" font-weight="600" text-anchor="middle">entropy</text>

  <!-- Separator -->
  <line x1="20" y1="60" x2="635" y2="60" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 0: Initial -->
  <text x="80" y="85" font-size="11" fill="#334155" text-anchor="middle" font-weight="500">Initial</text>

  <!-- Rush bar -->
  <rect x="210" y="72" width="100" height="18" rx="2" fill="#fecaca"/>
  <text x="260" y="85" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="500">25.0%</text>

  <!-- Expand bar -->
  <rect x="335" y="72" width="90" height="18" rx="2" fill="#bbf7d0"/>
  <text x="380" y="85" font-size="10" fill="#166534" text-anchor="middle" font-weight="500">25.0%</text>

  <!-- DT bar -->
  <rect x="445" y="72" width="90" height="18" rx="2" fill="#ddd6fe"/>
  <text x="490" y="85" font-size="10" fill="#5b21b6" text-anchor="middle" font-weight="500">25.0%</text>

  <!-- Entropy -->
  <text x="595" y="85" font-size="11" fill="#475569" text-anchor="middle">2.00</text>

  <!-- Separator -->
  <line x1="20" y1="100" x2="635" y2="100" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Row 1: Gateway -->
  <text x="80" y="135" font-size="11" fill="#334155" text-anchor="middle" font-weight="500">Gateway</text>
  <text x="80" y="150" font-size="9" fill="#94a3b8" text-anchor="middle">sighted</text>

  <rect x="210" y="122" width="152" height="18" rx="2" fill="#fca5a5"/>
  <text x="260" y="135" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="600">38.1% ◄</text>

  <rect x="350" y="122" width="42" height="18" rx="2" fill="#bbf7d0"/>
  <text x="380" y="135" font-size="10" fill="#166534" text-anchor="middle">10.5%</text>

  <rect x="445" y="122" width="141" height="18" rx="2" fill="#c4b5fd"/>
  <text x="490" y="135" font-size="10" fill="#5b21b6" text-anchor="middle" font-weight="500">35.3%</text>

  <text x="595" y="135" font-size="11" fill="#475569" text-anchor="middle">1.83</text>

  <!-- Arrow showing direction -->
  <text x="152" y="135" font-size="14" fill="#dc2626">↑</text>
  <text x="152" y="150" font-size="8" fill="#94a3b8">rush &amp;</text>
  <text x="152" y="160" font-size="8" fill="#94a3b8">tech rise</text>

  <!-- Separator -->
  <line x1="20" y1="170" x2="635" y2="170" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Row 2: Early gas -->
  <text x="80" y="205" font-size="11" fill="#334155" text-anchor="middle" font-weight="500">Early gas</text>
  <text x="80" y="220" font-size="9" fill="#94a3b8" text-anchor="middle">detected</text>

  <rect x="210" y="192" width="169" height="18" rx="2" fill="#fca5a5"/>
  <text x="260" y="205" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="500">42.3%</text>

  <rect x="357" y="192" width="24" height="18" rx="2" fill="#bbf7d0"/>
  <text x="380" y="205" font-size="10" fill="#166534" text-anchor="middle">5.9%</text>

  <rect x="445" y="192" width="176" height="18" rx="2" fill="#a78bfa"/>
  <text x="490" y="205" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">44.1% ◄</text>

  <text x="595" y="205" font-size="11" fill="#475569" text-anchor="middle">1.57</text>

  <text x="152" y="205" font-size="14" fill="#7c3aed">↑</text>
  <text x="152" y="220" font-size="8" fill="#94a3b8">dt_rush</text>
  <text x="152" y="230" font-size="8" fill="#94a3b8">leads</text>

  <!-- Separator -->
  <line x1="20" y1="240" x2="635" y2="240" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Row 3: Dark Shrine — decisive -->
  <text x="80" y="275" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Dark shrine</text>
  <text x="80" y="290" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="500">decisive!</text>

  <rect x="244" y="262" width="34" height="18" rx="2" fill="#fecaca"/>
  <text x="260" y="275" font-size="10" fill="#991b1b" text-anchor="middle">8.6%</text>

  <rect x="360" y="262" width="20" height="18" rx="2" fill="#d9f99d"/>
  <text x="380" y="275" font-size="10" fill="#166534" text-anchor="middle">5.0%</text>

  <rect x="445" y="262" width="323" height="18" rx="2" fill="#7c3aed"/>
  <text x="490" y="275" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">80.7% ◄</text>

  <text x="595" y="275" font-size="11" fill="#475569" text-anchor="middle">1.01</text>

  <!-- Entropy arrow -->
  <line x1="600" y1="95" x2="600" y2="278" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="625" y="190" font-size="9" fill="#94a3b8" transform="rotate(-90, 625, 190)">entropy decreasing →</text>

  <!-- Bottom: Response -->
  <rect x="20" y="310" width="610" height="70" rx="6" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="320" y="332" font-size="12" fill="#7c3aed" font-weight="600" text-anchor="middle">Response under winning hypothesis (dt_rush):</text>

  <!-- Response bars -->
  <rect x="50" y="345" width="70" height="16" rx="2" fill="#c4b5fd"/>
  <text x="130" y="357" font-size="10" fill="#475569">defend 17%</text>

  <rect x="210" y="345" width="140" height="16" rx="2" fill="#8b5cf6"/>
  <text x="360" y="357" font-size="10" fill="#475569" font-weight="600">counter 53% ◄</text>

  <rect x="430" y="345" width="15" height="16" rx="2" fill="#ddd6fe"/>
  <text x="453" y="357" font-size="10" fill="#475569">expand 6%</text>

  <rect x="520" y="345" width="50" height="16" rx="2" fill="#c4b5fd"/>
  <text x="578" y="357" font-size="10" fill="#475569">mirror 25%</text>

  <!-- Bottom label -->
  <text x="320" y="410" font-size="12" fill="#334155" font-weight="500" text-anchor="middle">Three observations. One hypothesis dominant. Counter-attack recommended.</text>
  <text x="320" y="430" font-size="11" fill="#64748b" text-anchor="middle">All computed from composed Bayesian networks — zero LLM calls.</text>
</svg>
