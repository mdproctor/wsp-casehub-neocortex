<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" fill="#f8f9fa" rx="8"/>

  <!-- LLM Call -->
  <rect x="40" y="30" width="140" height="60" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="110" y="55" text-anchor="middle" font-size="12" font-weight="600" fill="#1565c0">Coping Prompt</text>
  <text x="110" y="72" text-anchor="middle" font-size="10" fill="#1976d2">(internal LLM call)</text>

  <!-- Arrow to JSON -->
  <line x1="180" y1="60" x2="230" y2="60" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- JSON Response -->
  <rect x="232" y="20" width="130" height="80" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="297" y="42" text-anchor="middle" font-size="12" font-weight="600" fill="#bf360c">JSON Response</text>
  <text x="297" y="58" text-anchor="middle" font-size="9" fill="#e65100">strategy, narrative,</text>
  <text x="297" y="70" text-anchor="middle" font-size="9" fill="#e65100">goalOps, driveMods,</text>
  <text x="297" y="82" text-anchor="middle" font-size="9" fill="#e65100">attentionDirectives</text>

  <!-- Trust Boundary Line -->
  <line x1="390" y1="10" x2="390" y2="390" stroke="#d32f2f" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="395" y="22" font-size="10" font-weight="700" fill="#d32f2f">TRUST BOUNDARY</text>

  <!-- Layer 1 -->
  <rect x="410" y="30" width="290" height="50" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="420" y="48" font-size="11" font-weight="600" fill="#1b5e20">Layer 1 — Enum Validation</text>
  <text x="420" y="65" font-size="9" fill="#2e7d32">valueOf() + catch → reject unknown strategies, axes</text>

  <!-- Layer 2 -->
  <rect x="410" y="95" width="290" height="50" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="420" y="113" font-size="11" font-weight="600" fill="#1b5e20">Layer 2 — Range Clamping</text>
  <text x="420" y="130" font-size="9" fill="#2e7d32">Math.clamp(delta, -0.5, 0.5) → bound magnitudes</text>

  <!-- Layer 3 -->
  <rect x="410" y="160" width="290" height="50" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="420" y="178" font-size="11" font-weight="600" fill="#1b5e20">Layer 3 — Null/Empty Guards</text>
  <text x="420" y="195" font-size="9" fill="#2e7d32">isEmpty() check → fallback for structural assumptions</text>

  <!-- Layer 4 -->
  <rect x="410" y="225" width="290" height="50" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="420" y="243" font-size="11" font-weight="600" fill="#1b5e20">Layer 4 — Length Capping</text>
  <text x="420" y="260" font-size="9" fill="#2e7d32">cap(s, 200/500) → bound free-text field lengths</text>

  <!-- Arrow from JSON through boundary to layers -->
  <line x1="362" y1="60" x2="408" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="362" y1="60" x2="408" y2="120" stroke="#666" stroke-width="1.2" marker-end="url(#arrowhead)" stroke-dasharray="3,2"/>
  <line x1="362" y1="60" x2="408" y2="185" stroke="#666" stroke-width="1.2" marker-end="url(#arrowhead)" stroke-dasharray="3,2"/>
  <line x1="362" y1="60" x2="408" y2="250" stroke="#666" stroke-width="1.2" marker-end="url(#arrowhead)" stroke-dasharray="3,2"/>

  <!-- Downstream -->
  <rect x="410" y="300" width="290" height="80" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1"/>
  <text x="555" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#4a148c">Downstream Consumers</text>
  <text x="555" y="338" text-anchor="middle" font-size="9" fill="#7b1fa2">MindMap storage · Goal proposals</text>
  <text x="555" y="352" text-anchor="middle" font-size="9" fill="#7b1fa2">Prompt rendering · Drive orchestrator</text>
  <text x="555" y="366" text-anchor="middle" font-size="9" fill="#7b1fa2">Attention mediator</text>

  <!-- Arrow from layers to downstream -->
  <line x1="555" y1="275" x2="555" y2="298" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="565" y="291" font-size="8" fill="#666">validated</text>

  <!-- Gap callout -->
  <rect x="40" y="310" width="310" height="70" rx="5" fill="#fff8e1" stroke="#f57f17" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="50" y="330" font-size="11" font-weight="600" fill="#e65100">⚠ Gap: narrative field</text>
  <text x="50" y="348" font-size="9" fill="#f57f17">Top-level free-text, flows to CopingState</text>
  <text x="50" y="363" font-size="9" fill="#f57f17">and prompt rendering — uncapped (#filed)</text>
</svg>
