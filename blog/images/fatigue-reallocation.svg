<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300">
  <defs>
    <style>
      text { font-family: -apple-system, 'Segoe UI', sans-serif; }
      .title { font-size: 14px; fill: #333; font-weight: 600; }
      .header { font-size: 12px; fill: #555; font-weight: 600; }
      .cell { font-size: 11px; fill: #444; }
      .positive { fill: #16a34a; }
      .negative { fill: #dc2626; }
      .neutral { fill: #737373; }
      .bar-pos { fill: #bbf7d0; stroke: #16a34a; stroke-width: 1; }
      .bar-neg { fill: #fecaca; stroke: #dc2626; stroke-width: 1; }
      .bar-neut { fill: #e5e5e5; stroke: #a3a3a3; stroke-width: 1; }
      .divider { stroke: #d4d4d4; stroke-width: 1; }
      .section { fill: #f5f5f5; }
    </style>
  </defs>

  <text x="310" y="24" text-anchor="middle" class="title">Fatigue Reallocation: Hockey's Compensatory Control</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#777">How personality determines what degrades under sustained intensity</text>

  <!-- Section backgrounds -->
  <rect x="10" y="55" width="600" height="30" class="section" rx="2"/>
  <rect x="10" y="145" width="600" height="30" class="section" rx="2"/>

  <!-- Headers -->
  <text x="90" y="73" text-anchor="middle" class="header">Profile</text>
  <text x="220" y="73" text-anchor="middle" class="header">Depth</text>
  <text x="330" y="73" text-anchor="middle" class="header">Breadth</text>
  <text x="440" y="73" text-anchor="middle" class="header">Convergence</text>
  <text x="555" y="73" text-anchor="middle" class="header">Mechanism</text>

  <!-- Dividers -->
  <line x1="155" y1="55" x2="155" y2="280" class="divider"/>
  <line x1="280" y1="55" x2="280" y2="280" class="divider"/>
  <line x1="390" y1="55" x2="390" y2="280" class="divider"/>
  <line x1="495" y1="55" x2="495" y2="280" class="divider"/>

  <!-- Row 1: Conscientious -->
  <text x="90" y="108" text-anchor="middle" class="cell" font-weight="600">Conscientious</text>

  <!-- Depth: protected (near zero) -->
  <rect x="192" y="94" width="6" height="14" class="bar-neut" rx="1"/>
  <text x="220" y="118" text-anchor="middle" class="neutral" font-size="10">protected</text>

  <!-- Breadth: sacrificed -->
  <rect x="308" y="94" width="40" height="14" class="bar-neg" rx="1"/>
  <text x="330" y="118" text-anchor="middle" class="negative" font-size="10">sacrificed</text>

  <!-- Convergence: accelerated (positive) -->
  <rect x="418" y="94" width="30" height="14" class="bar-pos" rx="1"/>
  <text x="440" y="118" text-anchor="middle" class="positive" font-size="10">satisficing</text>

  <text x="555" y="105" text-anchor="middle" class="cell" font-size="9">Primary task</text>
  <text x="555" y="118" text-anchor="middle" class="cell" font-size="9">protection</text>

  <!-- Divider -->
  <line x1="10" y1="130" x2="610" y2="130" class="divider"/>

  <!-- Row 2: Neurotic -->
  <text x="90" y="163" text-anchor="middle" class="header">Neurotic</text>

  <!-- Depth: vulnerable -->
  <rect x="192" y="149" width="35" height="14" class="bar-neg" rx="1"/>
  <text x="220" y="173" text-anchor="middle" class="negative" font-size="10">vulnerable</text>

  <!-- Breadth: rapidly sacrificed -->
  <rect x="295" y="149" width="55" height="14" class="bar-neg" rx="1"/>
  <text x="330" y="173" text-anchor="middle" class="negative" font-size="10">rapid loss</text>

  <!-- Convergence: blocked (negative) -->
  <rect x="415" y="149" width="35" height="14" class="bar-neg" rx="1"/>
  <text x="440" y="173" text-anchor="middle" class="negative" font-size="10">blocked</text>

  <text x="555" y="160" text-anchor="middle" class="cell" font-size="9">Worry consumes</text>
  <text x="555" y="173" text-anchor="middle" class="cell" font-size="9">resources</text>

  <!-- Divider -->
  <line x1="10" y1="185" x2="610" y2="185" class="divider"/>

  <!-- Row 3: Open -->
  <text x="90" y="210" text-anchor="middle" class="cell" font-weight="600">Open</text>

  <rect x="192" y="198" width="6" height="14" class="bar-neut" rx="1"/>
  <text x="220" y="222" text-anchor="middle" class="neutral" font-size="10">protected</text>

  <rect x="318" y="198" width="20" height="14" class="bar-neg" rx="1"/>
  <text x="330" y="222" text-anchor="middle" class="negative" font-size="10">slow loss</text>

  <rect x="430" y="198" width="6" height="14" class="bar-neut" rx="1"/>
  <text x="440" y="222" text-anchor="middle" class="neutral" font-size="10">neutral</text>

  <text x="555" y="210" text-anchor="middle" class="cell" font-size="9">Exploration</text>
  <text x="555" y="222" text-anchor="middle" class="cell" font-size="9">costs less</text>

  <!-- Divider -->
  <line x1="10" y1="235" x2="610" y2="235" class="divider"/>

  <!-- Row 4: Impulsive -->
  <text x="90" y="260" text-anchor="middle" class="cell" font-weight="600">Impulsive</text>

  <rect x="192" y="248" width="30" height="14" class="bar-neg" rx="1"/>
  <text x="220" y="272" text-anchor="middle" class="negative" font-size="10">vulnerable</text>

  <rect x="295" y="248" width="55" height="14" class="bar-neg" rx="1"/>
  <text x="330" y="272" text-anchor="middle" class="negative" font-size="10">rapid loss</text>

  <rect x="418" y="248" width="25" height="14" class="bar-pos" rx="1"/>
  <text x="440" y="272" text-anchor="middle" class="positive" font-size="10">premature</text>

  <text x="555" y="260" text-anchor="middle" class="cell" font-size="9">Executive control</text>
  <text x="555" y="272" text-anchor="middle" class="cell" font-size="9">degrades first</text>

  <!-- Bottom border -->
  <line x1="10" y1="285" x2="610" y2="285" class="divider"/>
</svg>
