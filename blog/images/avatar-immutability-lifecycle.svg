<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Avatar Lifecycle: Immutable Objects + Producer Cache</text>

  <!-- YAML Profile box -->
  <rect x="20" y="50" width="140" height="60" rx="6" fill="#e8f4f8" stroke="#4a9ebb" stroke-width="1.5"/>
  <text x="90" y="72" text-anchor="middle" font-weight="bold" fill="#2a6e85">YAML Profile</text>
  <text x="90" y="90" text-anchor="middle" font-size="11" fill="#555">stoic-mentor.yaml</text>

  <!-- Registry -->
  <rect x="200" y="50" width="160" height="60" rx="6" fill="#f0e8f8" stroke="#7b5ea7" stroke-width="1.5"/>
  <text x="280" y="72" text-anchor="middle" font-weight="bold" fill="#5a3d82">Registry</text>
  <text x="280" y="90" text-anchor="middle" font-size="11" fill="#555">CognitiveDefaultsRegistry</text>

  <!-- Producer -->
  <rect x="400" y="50" width="160" height="60" rx="6" fill="#f8f0e0" stroke="#c49a3c" stroke-width="1.5"/>
  <text x="480" y="72" text-anchor="middle" font-weight="bold" fill="#8b6914">Producer</text>
  <text x="480" y="90" text-anchor="middle" font-size="11" fill="#555">CognitiveAvatarProducer</text>

  <!-- Arrows top row -->
  <line x1="160" y1="80" x2="195" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="80" x2="395" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Cache box -->
  <rect x="400" y="140" width="160" height="50" rx="6" fill="#fff3e0" stroke="#e68a00" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="480" y="162" text-anchor="middle" font-weight="bold" fill="#b36b00">Cache</text>
  <text x="480" y="178" text-anchor="middle" font-size="11" fill="#555">ConcurrentHashMap</text>

  <!-- Avatar (immutable) -->
  <rect x="250" y="220" width="180" height="70" rx="6" fill="#e8f8e8" stroke="#3d8b3d" stroke-width="2"/>
  <text x="340" y="246" text-anchor="middle" font-weight="bold" fill="#2a6e2a">CognitiveAvatar</text>
  <text x="340" y="264" text-anchor="middle" font-size="11" fill="#555">immutable — no reload()</text>
  <text x="340" y="280" text-anchor="middle" font-size="11" fill="#555">capabilities fixed at creation</text>

  <!-- Producer to cache -->
  <line x1="480" y1="110" x2="480" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="128" font-size="10" fill="#888">create()</text>

  <!-- Cache to avatar -->
  <line x1="430" y1="190" x2="390" y2="216" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="208" font-size="10" fill="#888">miss → build</text>

  <!-- Cache hit loop -->
  <path d="M530,165 Q560,165 560,145 Q560,125 530,125" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="580" y="148" font-size="10" fill="#888">hit</text>

  <!-- Hot reload event -->
  <rect x="20" y="150" width="160" height="45" rx="6" fill="#fce4e4" stroke="#d44" stroke-width="1.5"/>
  <text x="100" y="170" text-anchor="middle" font-weight="bold" font-size="12" fill="#c33">ProfilesReloaded</text>
  <text x="100" y="184" text-anchor="middle" font-size="10" fill="#555">CDI event from filesystem</text>

  <!-- Reload arrow to cache clear -->
  <line x1="180" y1="172" x2="395" y2="165" stroke="#d44" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="290" y="158" font-size="10" fill="#c33">cache.clear()</text>

  <!-- Consumer box -->
  <rect x="510" y="230" width="150" height="50" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="585" y="252" text-anchor="middle" font-size="12" fill="#666">Consumer</text>
  <text x="585" y="268" text-anchor="middle" font-size="10" fill="#888">MCP / Agency / App</text>

  <!-- Consumer to producer -->
  <line x1="560" y1="230" x2="520" y2="195" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="558" y="215" font-size="10" fill="#888">create()</text>
</svg>
