<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="12">
  <defs>
    <marker id="arrow-a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-new" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#22c55e" stroke-width="1.2"/>
    </marker>
  </defs>

  <style>
    .box { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 6; }
    .box-new { fill: #1e293b; stroke: #22c55e; stroke-width: 2; rx: 6; }
    .title { fill: #f1f5f9; font-weight: 600; font-size: 13px; }
    .field { fill: #94a3b8; font-size: 11px; }
    .field-present { fill: #22c55e; font-size: 11px; }
    .field-new { fill: #4ade80; font-size: 11px; font-weight: 600; }
    .label { fill: #cbd5e1; font-size: 11px; font-weight: 600; }
    .note { fill: #94a3b8; font-size: 10px; font-style: italic; }
    .header { fill: #f8fafc; font-size: 16px; font-weight: 700; }
    .subheader { fill: #94a3b8; font-size: 11px; }
  </style>

  <rect width="820" height="580" fill="#0f172a" rx="8"/>

  <text x="410" y="32" text-anchor="middle" class="header">Appraisal Pipeline — After (Designed)</text>
  <text x="410" y="50" text-anchor="middle" class="subheader">Per-relationship state flows from caller through to the LLM prompt</text>

  <!-- Caller -->
  <rect x="20" y="75" width="160" height="60" class="box"/>
  <text x="100" y="100" text-anchor="middle" class="title">Caller</text>
  <text x="100" y="116" text-anchor="middle" class="field-present">passes targetAgentId</text>

  <!-- Arrow -->
  <line x1="180" y1="105" x2="220" y2="105" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-new)"/>

  <!-- CognitionTickContext -->
  <rect x="225" y="70" width="200" height="110" class="box-new"/>
  <text x="325" y="92" text-anchor="middle" class="title">CognitionTickContext</text>
  <text x="240" y="110" class="field-present">✓ agentId</text>
  <text x="240" y="124" class="field-present">✓ tenantId</text>
  <text x="240" y="138" class="field-present">✓ observation</text>
  <text x="240" y="152" class="field-new">+ targetAgentId — NEW</text>
  <text x="240" y="166" class="note">  threads to render context too</text>

  <!-- Arrow down -->
  <line x1="325" y1="180" x2="325" y2="210" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-a)"/>

  <!-- AppraisalTickParticipant -->
  <rect x="225" y="215" width="200" height="90" class="box"/>
  <text x="325" y="238" text-anchor="middle" class="title">AppraisalTickParticipant</text>
  <text x="240" y="256" class="field-present">resolves drives ✓</text>
  <text x="240" y="270" class="field-present">resolves mood ✓</text>
  <text x="240" y="284" class="field-new">+ resolves overlay → schema</text>
  <text x="240" y="298" class="field-new">+ resolves personality facets</text>

  <!-- Arrow to overlay -->
  <line x1="225" y1="280" x2="130" y2="280" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arrow-new)"/>
  <rect x="15" y="230" width="115" height="100" class="box-new"/>
  <text x="72" y="252" text-anchor="middle" class="title" font-size="11">MindMap</text>
  <text x="72" y="266" text-anchor="middle" class="title" font-size="11">Overlay</text>
  <text x="25" y="284" class="field-new" font-size="10">rel.role</text>
  <text x="25" y="296" class="field-new" font-size="10">rel.trust</text>
  <text x="25" y="308" class="field-new" font-size="10">rel.intimacy</text>
  <text x="25" y="320" class="field-new" font-size="10">rel.utility</text>

  <!-- Arrow to AppraisalContext -->
  <line x1="425" y1="260" x2="465" y2="260" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-a)"/>

  <!-- AppraisalContext -->
  <rect x="470" y="205" width="200" height="150" class="box-new"/>
  <text x="570" y="228" text-anchor="middle" class="title">AppraisalContext</text>
  <text x="485" y="248" class="field-present">✓ situation</text>
  <text x="485" y="264" class="field-present">✓ drives</text>
  <text x="485" y="280" class="field-present">✓ mood</text>
  <text x="485" y="296" class="field-present">✓ dispositionAxes</text>
  <text x="485" y="312" class="field-new">+ targetSchema — NEW</text>
  <text x="485" y="328" class="field-new">+ personalityFacets — NEW</text>
  <text x="485" y="344" class="note">  RelationalSchema from overlay</text>

  <!-- Arrow -->
  <line x1="570" y1="355" x2="570" y2="395" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-a)"/>

  <!-- LlmAppraisalStrategy -->
  <rect x="400" y="400" width="400" height="165" class="box-new"/>
  <text x="600" y="423" text-anchor="middle" class="title">LlmAppraisalStrategy prompt</text>
  <text x="415" y="443" class="field-present">✓ Drives: scheming 0.9, dominance 0.6</text>
  <text x="415" y="459" class="field-present">✓ Situation: "Someone offered you a gift"</text>
  <text x="415" y="475" class="field-present">✓ Mood: pleasure=-0.2, arousal=0.3</text>
  <text x="415" y="491" class="field-present">✓ Disposition: competitive, bold, analytical</text>
  <text x="415" y="511" class="field-new">+ Relationship: prey, trust=0.1, utility=0.9</text>
  <text x="415" y="527" class="field-new">+ "Her trust is the most useful thing about her"</text>
  <text x="415" y="547" class="field-new">+ Personality: Callousness 0.90, Manipulativeness 0.85</text>

  <!-- Result annotation -->
  <rect x="15" y="420" width="365" height="80" class="box"/>
  <text x="197" y="443" text-anchor="middle" class="label">Now the sub-LLM can distinguish:</text>
  <text x="30" y="463" class="field-new">"Gift from prey → assess for exploitation value"</text>
  <text x="30" y="479" class="field" style="fill:#64748b">"Gift from ally → cautious acceptance"</text>
  <text x="30" y="495" class="field" style="fill:#64748b">"Gift from threat → scan for hidden cost"</text>
</svg>
