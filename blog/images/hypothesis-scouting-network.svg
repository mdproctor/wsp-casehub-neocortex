<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, -apple-system, sans-serif">
  <!-- Intel slot -->
  <rect x="20" y="20" width="380" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="35" y="42" font-size="11" fill="#64748b" font-weight="600">intel slot</text>

  <!-- enemy_strategy node (hidden/latent) -->
  <rect x="140" y="60" width="140" height="36" rx="18" fill="#1e40af" stroke="none"/>
  <text x="210" y="83" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">enemy_strategy</text>

  <!-- Observation nodes -->
  <rect x="40" y="140" width="110" height="32" rx="4" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="95" y="161" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="500">first_building</text>

  <rect x="165" y="140" width="90" height="32" rx="4" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="210" y="161" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="500">gas_timing</text>

  <rect x="270" y="140" width="110" height="32" rx="4" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="325" y="161" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="500">tech_structure</text>

  <!-- Arrows from strategy to observations -->
  <line x1="175" y1="96" x2="95" y2="138" stroke="#475569" stroke-width="1.5"/>
  <polygon points="92,135 99,137 95,142" fill="#475569"/>

  <line x1="210" y1="96" x2="210" y2="138" stroke="#475569" stroke-width="1.5"/>
  <polygon points="206,138 214,138 210,143" fill="#475569"/>

  <line x1="245" y1="96" x2="325" y2="138" stroke="#475569" stroke-width="1.5"/>
  <polygon points="322,135 328,137 325,142" fill="#475569"/>

  <!-- CPT annotations -->
  <text x="95" y="190" font-size="9" fill="#94a3b8" text-anchor="middle">gateway → rush: 0.60</text>
  <text x="95" y="202" font-size="9" fill="#94a3b8" text-anchor="middle">hatchery → expand: 0.40</text>

  <text x="210" y="190" font-size="9" fill="#94a3b8" text-anchor="middle">early → rush: 0.70</text>
  <text x="210" y="202" font-size="9" fill="#94a3b8" text-anchor="middle">early → tech: 0.80</text>

  <text x="325" y="190" font-size="9" fill="#94a3b8" text-anchor="middle">dark_shrine → tech: 0.40</text>
  <text x="325" y="202" font-size="9" fill="#94a3b8" text-anchor="middle">none → rush/expand: 0.90</text>

  <!-- Legend -->
  <rect x="55" y="225" width="12" height="12" rx="6" fill="#1e40af"/>
  <text x="75" y="236" font-size="10" fill="#475569">latent — the thing we're trying to infer</text>
  <rect x="55" y="245" width="12" height="12" rx="2" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="75" y="256" font-size="10" fill="#475569">observable — what we can actually see</text>

  <!-- Response slot -->
  <rect x="430" y="20" width="190" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="445" y="42" font-size="11" fill="#64748b" font-weight="600">response slot</text>

  <!-- enemy_strategy in response (link target) -->
  <rect x="455" y="60" width="140" height="36" rx="18" fill="#1e40af" stroke="none" opacity="0.5"/>
  <text x="525" y="83" font-size="11" fill="#fff" font-weight="500" text-anchor="middle">enemy_strategy</text>

  <!-- recommended_response -->
  <rect x="445" y="110" width="160" height="28" rx="4" fill="#fff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="525" y="129" font-size="10" fill="#6d28d9" text-anchor="middle" font-weight="500">recommended_response</text>

  <line x1="525" y1="96" x2="525" y2="108" stroke="#475569" stroke-width="1.5"/>
  <polygon points="521,108 529,108 525,113" fill="#475569"/>

  <!-- Link arrow between slots -->
  <line x1="280" y1="78" x2="453" y2="78" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="450,74 450,82 456,78" fill="#f59e0b"/>
  <text x="370" y="70" font-size="9" fill="#d97706" font-weight="500" text-anchor="middle">POSTERIOR</text>
</svg>
