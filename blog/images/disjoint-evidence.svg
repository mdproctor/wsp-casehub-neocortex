<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1.2"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- LEFT: Valid composition -->
  <text x="140" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#16a34a">Disjoint evidence — correct</text>

  <!-- Evidence circles -->
  <circle cx="50" cy="70" r="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="50" y="74" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">e₁</text>
  <circle cx="140" cy="70" r="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="74" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">e₂</text>

  <!-- Network A -->
  <rect x="20" y="110" width="110" height="50" rx="6" fill="#f0f4ff" stroke="#6366f1" stroke-width="1.3"/>
  <text x="75" y="140" text-anchor="middle" font-size="12" fill="#4338ca">Network A</text>

  <!-- Network B -->
  <rect x="150" y="110" width="110" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="205" y="140" text-anchor="middle" font-size="12" fill="#15803d">Network B</text>

  <!-- Evidence arrows -->
  <line x1="50" y1="84" x2="55" y2="110" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="140" y1="84" x2="190" y2="110" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Posterior link A→B -->
  <line x1="130" y1="135" x2="150" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Result -->
  <rect x="70" y="190" width="140" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="140" y="213" text-anchor="middle" font-size="11" fill="#15803d">P(X|e₁,e₂) — exact</text>

  <line x1="140" y1="160" x2="140" y2="190" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Checkmark -->
  <text x="140" y="250" text-anchor="middle" font-size="22" fill="#16a34a">&#x2713;</text>
  <text x="140" y="270" text-anchor="middle" font-size="11" fill="#555">e₁ counted once, e₂ counted once</text>

  <!-- Divider -->
  <line x1="280" y1="10" x2="280" y2="290" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- RIGHT: Double-counting -->
  <text x="420" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">Shared evidence — double-counted</text>

  <!-- Evidence circle (shared) -->
  <circle cx="420" cy="70" r="14" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="420" y="74" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">e₁</text>

  <!-- Network A -->
  <rect x="310" y="110" width="110" height="50" rx="6" fill="#f0f4ff" stroke="#6366f1" stroke-width="1.3"/>
  <text x="365" y="140" text-anchor="middle" font-size="12" fill="#4338ca">Network A</text>

  <!-- Network B -->
  <rect x="440" y="110" width="110" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="495" y="140" text-anchor="middle" font-size="12" fill="#b45309">Network B</text>

  <!-- Evidence arrows — SAME evidence to both -->
  <line x1="410" y1="84" x2="370" y2="110" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <line x1="430" y1="84" x2="480" y2="110" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>

  <!-- Posterior link A→B -->
  <line x1="420" y1="135" x2="440" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Result -->
  <rect x="355" y="190" width="170" height="36" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="440" y="213" text-anchor="middle" font-size="11" fill="#dc2626">P(X|e₁,e₁) — overconfident</text>

  <line x1="440" y1="160" x2="440" y2="190" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- X mark -->
  <text x="440" y="250" text-anchor="middle" font-size="22" fill="#dc2626">&#x2717;</text>
  <text x="440" y="270" text-anchor="middle" font-size="11" fill="#555">e₁ enters B directly AND via A's posterior</text>
</svg>
