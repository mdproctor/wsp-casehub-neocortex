<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Inter', 'Helvetica Neue', sans-serif">
  <rect width="700" height="300" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Why Keywords Without Context Misclassify</text>

  <!-- Input text -->
  <rect x="30" y="55" width="640" height="35" rx="4" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="350" y="77" text-anchor="middle" font-size="12" font-style="italic" fill="#374151">"The child was bullied at school, but responded with remarkable kindness"</text>

  <!-- Keyword path -->
  <rect x="30" y="115" width="300" height="160" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="180" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Keyword Classifier</text>

  <text x="50" y="162" font-size="10" fill="#4b5563">Matches: "bullied" → </text>
  <text x="178" y="162" font-size="10" font-weight="600" fill="#dc2626">dominance ✗</text>

  <text x="50" y="182" font-size="10" fill="#4b5563">Misses the response entirely</text>

  <text x="50" y="210" font-size="10" fill="#4b5563">Result:</text>
  <rect x="50" y="218" width="110" height="22" rx="3" fill="#fee2e2"/>
  <text x="105" y="233" text-anchor="middle" font-size="9" font-weight="600" fill="#991b1b">dominance: 0.7</text>
  <rect x="170" y="218" width="90" height="22" rx="3" fill="#fee2e2"/>
  <text x="215" y="233" text-anchor="middle" font-size="9" font-weight="600" fill="#991b1b">failure: 0.5</text>

  <text x="180" y="262" text-anchor="middle" font-size="10" font-weight="500" fill="#dc2626">Maps words to the problem described,</text>
  <text x="180" y="276" text-anchor="middle" font-size="10" font-weight="500" fill="#dc2626">not the agent's response</text>

  <!-- LLM path -->
  <rect x="370" y="115" width="300" height="160" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="520" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">LLM Classifier</text>

  <text x="390" y="162" font-size="10" fill="#4b5563">Understands: response is kindness</text>
  <text x="390" y="182" font-size="10" fill="#4b5563">Despite adversity → prosocial activation</text>

  <text x="390" y="210" font-size="10" fill="#4b5563">Result:</text>
  <rect x="390" y="218" width="110" height="22" rx="3" fill="#dcfce7"/>
  <text x="445" y="233" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">acceptance: 0.8</text>
  <rect x="510" y="218" width="90" height="22" rx="3" fill="#dcfce7"/>
  <text x="555" y="233" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">sharing: 0.6</text>

  <text x="520" y="262" text-anchor="middle" font-size="10" font-weight="500" fill="#166534">Reads the situation semantically —</text>
  <text x="520" y="276" text-anchor="middle" font-size="10" font-weight="500" fill="#166534">understands role and response</text>
</svg>
