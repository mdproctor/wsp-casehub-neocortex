<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2d8a4e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cf4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Coping Defaults → Resting Activation Bias</text>

  <!-- CopingDefaults record box -->
  <rect x="20" y="55" width="220" height="180" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="130" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#1a56db">CopingDefaults</text>
  <line x1="30" y1="88" x2="230" y2="88" stroke="#4285f4" stroke-width="0.5"/>

  <text x="40" y="110" font-size="11" fill="#333">planfulTendency</text>
  <text x="210" y="110" text-anchor="end" font-size="11" font-weight="600" fill="#1a56db">0.8</text>

  <text x="40" y="132" font-size="11" fill="#333">reinterpretationTendency</text>
  <text x="210" y="132" text-anchor="end" font-size="11" font-weight="600" fill="#1a56db">0.3</text>

  <text x="40" y="154" font-size="11" fill="#333">avoidanceTendency</text>
  <text x="210" y="154" text-anchor="end" font-size="11" font-weight="600" fill="#1a56db">0.2</text>

  <text x="40" y="176" font-size="11" fill="#333">supportSeekingTendency</text>
  <text x="210" y="176" text-anchor="end" font-size="11" font-weight="600" fill="#1a56db">0.7</text>

  <text x="40" y="198" font-size="11" fill="#333">acceptanceTendency</text>
  <text x="210" y="198" text-anchor="end" font-size="11" font-weight="600" fill="#1a56db">0.6</text>

  <!-- copingBias formula box -->
  <rect x="290" y="110" width="210" height="60" rx="6" fill="#fff3cd" stroke="#e9a211" stroke-width="1.5"/>
  <text x="395" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#8a6d14">copingBias(tendency)</text>
  <text x="395" y="155" text-anchor="middle" font-size="13" font-family="monospace" fill="#664d03">(t − 0.5) × 0.5</text>

  <!-- Arrow from CopingDefaults to formula -->
  <line x1="240" y1="145" x2="288" y2="140" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Output nodes -->
  <rect x="560" y="55" width="220" height="260" rx="6" fill="#f0f7f0" stroke="#2d8a4e" stroke-width="1.5"/>
  <text x="670" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#1a6b35">CAPS Output Nodes</text>
  <line x1="570" y1="88" x2="770" y2="88" stroke="#2d8a4e" stroke-width="0.5"/>
  <text x="590" y="78" font-size="10" fill="#666">resting activation</text>

  <!-- Node: planning -->
  <text x="580" y="112" font-size="11" fill="#333">planning</text>
  <text x="750" y="112" text-anchor="end" font-size="11" font-weight="600" fill="#2d8a4e">+0.15</text>

  <!-- Node: positive_reinterpretation -->
  <text x="580" y="140" font-size="11" fill="#333">positive_reinterpretation</text>
  <text x="750" y="140" text-anchor="end" font-size="11" font-weight="600" fill="#cf4444">−0.10</text>

  <!-- Node: avoidance -->
  <text x="580" y="168" font-size="11" fill="#333">avoidance</text>
  <text x="750" y="168" text-anchor="end" font-size="11" font-weight="600" fill="#cf4444">−0.15</text>

  <!-- Node: seek_instrumental_support -->
  <text x="580" y="196" font-size="11" fill="#333">seek_instrumental_support</text>
  <text x="750" y="196" text-anchor="end" font-size="11" font-weight="600" fill="#2d8a4e">+0.10</text>

  <!-- Node: seek_emotional_support -->
  <text x="580" y="224" font-size="11" fill="#333">seek_emotional_support</text>
  <text x="750" y="224" text-anchor="end" font-size="11" font-weight="600" fill="#2d8a4e">+0.10</text>

  <!-- Node: coping_acceptance -->
  <text x="580" y="252" font-size="11" fill="#333">coping_acceptance</text>
  <text x="750" y="252" text-anchor="end" font-size="11" font-weight="600" fill="#2d8a4e">+0.05</text>

  <!-- Arrows from formula to nodes -->
  <line x1="500" y1="130" x2="558" y2="112" stroke="#2d8a4e" stroke-width="1" marker-end="url(#arrow-green)"/>
  <line x1="500" y1="135" x2="558" y2="138" stroke="#cf4444" stroke-width="1" marker-end="url(#arrow-red)"/>
  <line x1="500" y1="140" x2="558" y2="166" stroke="#cf4444" stroke-width="1" marker-end="url(#arrow-red)"/>
  <line x1="500" y1="145" x2="558" y2="194" stroke="#2d8a4e" stroke-width="1" marker-end="url(#arrow-green)"/>
  <line x1="500" y1="150" x2="558" y2="222" stroke="#2d8a4e" stroke-width="1" marker-end="url(#arrow-green)"/>
  <line x1="500" y1="155" x2="558" y2="250" stroke="#2d8a4e" stroke-width="1" marker-end="url(#arrow-green)"/>

  <!-- Annotation: population mean -->
  <rect x="290" y="190" width="210" height="40" rx="4" fill="#f8f8f8" stroke="#ccc" stroke-width="0.8"/>
  <text x="395" y="208" text-anchor="middle" font-size="10" fill="#666">0.5 = population mean</text>
  <text x="395" y="222" text-anchor="middle" font-size="10" fill="#666">output range: [−0.25, +0.25]</text>

  <!-- Bottom: interaction note -->
  <rect x="40" y="340" width="720" height="120" rx="6" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="365" text-anchor="middle" font-size="12" font-weight="600" fill="#555">How it interacts at settling time</text>

  <!-- Three boxes inside -->
  <rect x="60" y="380" width="200" height="60" rx="4" fill="#e8f0fe" stroke="#4285f4" stroke-width="1"/>
  <text x="160" y="400" text-anchor="middle" font-size="11" font-weight="500" fill="#1a56db">Disposition weights</text>
  <text x="160" y="416" text-anchor="middle" font-size="10" fill="#666">BIS/BAS connection</text>
  <text x="160" y="430" text-anchor="middle" font-size="10" fill="#666">modulation</text>

  <rect x="300" y="380" width="200" height="60" rx="4" fill="#fff3cd" stroke="#e9a211" stroke-width="1"/>
  <text x="400" y="400" text-anchor="middle" font-size="11" font-weight="500" fill="#8a6d14">Coping resting bias</text>
  <text x="400" y="416" text-anchor="middle" font-size="10" fill="#666">additive offset on</text>
  <text x="400" y="430" text-anchor="middle" font-size="10" fill="#666">output node baselines</text>

  <rect x="540" y="380" width="200" height="60" rx="4" fill="#fde8e8" stroke="#cf4444" stroke-width="1"/>
  <text x="640" y="400" text-anchor="middle" font-size="11" font-weight="500" fill="#cf4444">Situational input</text>
  <text x="640" y="416" text-anchor="middle" font-size="10" fill="#666">threat, reward, social</text>
  <text x="640" y="430" text-anchor="middle" font-size="10" fill="#666">signals → settling</text>

  <!-- Plus signs between boxes -->
  <text x="275" y="415" text-anchor="middle" font-size="18" font-weight="bold" fill="#999">+</text>
  <text x="515" y="415" text-anchor="middle" font-size="18" font-weight="bold" fill="#999">+</text>
</svg>