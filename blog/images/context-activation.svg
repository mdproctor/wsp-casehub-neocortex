<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1.2"/>
    </marker>
    <marker id="a-dim" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#bbb" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Context Activation — Slot Variant Swap</text>

  <!-- Economy slot (upstream, unchanged) -->
  <rect x="20" y="50" width="130" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="85" y="75" text-anchor="middle" font-weight="600" font-size="12" fill="#15803d">Economy</text>
  <text x="85" y="92" text-anchor="middle" font-size="10" fill="#16a34a">calibrated &#x2713;</text>

  <!-- Scouting slot with variants -->
  <rect x="180" y="42" width="170" height="76" rx="8" fill="white" stroke="#6366f1" stroke-width="2"/>

  <!-- Active variant (TvZ) -->
  <rect x="192" y="52" width="70" height="32" rx="4" fill="#6366f1" stroke="none"/>
  <text x="227" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="white">TvZ</text>

  <!-- Inactive variant (TvP) -->
  <rect x="272" y="52" width="70" height="32" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="307" y="72" text-anchor="middle" font-size="11" fill="#818cf8">TvP</text>

  <text x="265" y="106" text-anchor="middle" font-weight="600" font-size="12" fill="#4338ca">Scouting</text>

  <!-- activate() arrow -->
  <path d="M307,84 Q307,98 272,92" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="335" y="98" font-size="10" fill="#6366f1" font-style="italic">activate("TvZ")</text>

  <!-- Build Order slot -->
  <rect x="390" y="50" width="110" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="445" y="75" text-anchor="middle" font-weight="600" font-size="12" fill="#b45309">Build Order</text>
  <text x="445" y="92" text-anchor="middle" font-size="10" fill="#d97706">dirty &#x21bb;</text>

  <!-- Links -->
  <line x1="150" y1="80" x2="180" y2="80" stroke="#bbb" stroke-width="1.2" marker-end="url(#a-dim)"/>
  <line x1="350" y1="80" x2="390" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Re-evaluation cascade -->
  <rect x="60" y="150" width="400" height="140" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="260" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Update Pass After Activation</text>

  <!-- Step 1 -->
  <rect x="80" y="186" width="120" height="28" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="140" y="204" text-anchor="middle" font-size="11" fill="#15803d">Economy — skip</text>
  <text x="140" y="218" text-anchor="middle" font-size="9" fill="#999">calibrated, no change</text>

  <!-- Step 2 -->
  <rect x="210" y="186" width="120" height="28" rx="4" fill="#ede9fe" stroke="#6366f1" stroke-width="1.5"/>
  <text x="270" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">Scouting — run</text>
  <text x="270" y="218" text-anchor="middle" font-size="9" fill="#999">new TvZ instance</text>

  <!-- Step 3 -->
  <rect x="340" y="186" width="120" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">Build Order — run</text>
  <text x="400" y="218" text-anchor="middle" font-size="9" fill="#999">dirty downstream</text>

  <!-- Arrows between steps -->
  <line x1="200" y1="200" x2="210" y2="200" stroke="#555" stroke-width="1" marker-end="url(#a)"/>
  <line x1="330" y1="200" x2="340" y2="200" stroke="#555" stroke-width="1" marker-end="url(#a)"/>

  <!-- Step numbers -->
  <circle cx="100" cy="250" r="10" fill="#16a34a" stroke="none"/>
  <text x="100" y="254" text-anchor="middle" font-size="10" font-weight="600" fill="white">1</text>
  <text x="100" y="270" text-anchor="middle" font-size="10" fill="#666">skip</text>

  <circle cx="260" cy="250" r="10" fill="#6366f1" stroke="none"/>
  <text x="260" y="254" text-anchor="middle" font-size="10" font-weight="600" fill="white">2</text>
  <text x="260" y="270" text-anchor="middle" font-size="10" fill="#666">propagate</text>

  <circle cx="400" cy="250" r="10" fill="#d97706" stroke="none"/>
  <text x="400" y="254" text-anchor="middle" font-size="10" font-weight="600" fill="white">3</text>
  <text x="400" y="270" text-anchor="middle" font-size="10" fill="#666">re-evaluate</text>
</svg>
