<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Tri-Channel Generation from @McpDomain</text>

  <!-- Source: CorpusApi interface -->
  <rect x="230" y="55" width="260" height="80" rx="8" fill="#2563eb" opacity="0.9"/>
  <text x="360" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="white">@McpDomain("neocortex/corpus")</text>
  <text x="360" y="102" text-anchor="middle" font-size="12" fill="#dbeafe">CorpusApi — 19 operations</text>
  <text x="360" y="118" text-anchor="middle" font-size="11" fill="#93c5fd">11 @PlatformQuery · 8 @PlatformMutation</text>

  <!-- Compile-time box -->
  <rect x="40" y="175" width="300" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="190" y="195" text-anchor="middle" font-size="11" fill="#64748b">COMPILE TIME</text>
  <text x="190" y="210" text-anchor="middle" font-size="10" fill="#94a3b8">Jandex index → GraphQLResolverProcessor</text>

  <!-- Runtime box -->
  <rect x="380" y="175" width="300" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="530" y="195" text-anchor="middle" font-size="11" fill="#64748b">RUNTIME</text>
  <text x="530" y="210" text-anchor="middle" font-size="10" fill="#94a3b8">GraphQLModelScanner → DynamicToolRegistrar</text>

  <!-- Arrows from CorpusApi to processing boxes -->
  <line x1="310" y1="135" x2="190" y2="172" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="135" x2="530" y2="172" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Channel 1: REST -->
  <rect x="40" y="270" width="190" height="70" rx="8" fill="#16a34a" opacity="0.85"/>
  <text x="135" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="white">REST</text>
  <text x="135" y="314" text-anchor="middle" font-size="10" fill="#dcfce7">JAX-RS @Path + @GET/@POST</text>
  <text x="135" y="328" text-anchor="middle" font-size="10" fill="#bbf7d0">Auto-generated Resource</text>

  <!-- Channel 2: GraphQL -->
  <rect x="265" y="270" width="190" height="70" rx="8" fill="#9333ea" opacity="0.85"/>
  <text x="360" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="white">GraphQL</text>
  <text x="360" y="314" text-anchor="middle" font-size="10" fill="#f3e8ff">@GraphQLApi + @Query/@Mutation</text>
  <text x="360" y="328" text-anchor="middle" font-size="10" fill="#e9d5ff">Auto-generated Resolver</text>

  <!-- Channel 3: MCP -->
  <rect x="490" y="270" width="190" height="70" rx="8" fill="#ea580c" opacity="0.85"/>
  <text x="585" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="white">MCP Tools</text>
  <text x="585" y="314" text-anchor="middle" font-size="10" fill="#ffedd5">DynamicToolRegistrar</text>
  <text x="585" y="328" text-anchor="middle" font-size="10" fill="#fed7aa">corpus_search, corpus_reindex…</text>

  <!-- Arrows from processing to channels -->
  <line x1="135" y1="225" x2="135" y2="267" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="245" y1="225" x2="360" y2="267" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="225" x2="585" y2="267" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom: what it replaces -->
  <rect x="100" y="370" width="520" height="38" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="360" y="393" text-anchor="middle" font-size="12" fill="#991b1b">Replaces: 7 hand-written files · 991 lines · SearchEndpoint, EntryResource,</text>
  <text x="360" y="406" text-anchor="middle" font-size="11" fill="#b91c1c">ProfileResource, ReindexResource, OutcomeResource, ProvenanceResource, GardenMcpTools</text>
</svg>
