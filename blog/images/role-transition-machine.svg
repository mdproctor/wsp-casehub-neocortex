<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="a-pos" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
    <marker id="a-neg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="a-cond" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7c3aed"/>
    </marker>
    <marker id="a-rec" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="390" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Role Transition State Machine</text>
  <text x="390" y="40" text-anchor="middle" font-size="10" fill="#64748b">Trust thresholds trigger re-evaluation; personality gates determine destination</text>

  <!-- Nodes -->
  <!-- stranger -->
  <rect x="300" y="60" width="120" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="83" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">stranger</text>

  <!-- ally -->
  <rect x="80" y="160" width="100" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="130" y="183" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">ally</text>

  <!-- tool -->
  <rect x="240" y="160" width="100" height="36" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="290" y="183" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">tool</text>

  <!-- threat -->
  <rect x="560" y="160" width="100" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="610" y="183" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">threat</text>

  <!-- prey -->
  <rect x="420" y="160" width="100" height="36" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="470" y="183" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">prey</text>

  <!-- mentor -->
  <rect x="40" y="300" width="100" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="90" y="323" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">mentor</text>

  <!-- obstacle -->
  <rect x="200" y="300" width="100" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="250" y="323" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">obstacle</text>

  <!-- protectee -->
  <rect x="530" y="300" width="110" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="585" y="323" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">protectee</text>

  <!-- stranger → ally (trust ≥ 0.5) -->
  <path d="M300,85 Q220,85 180,155" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-pos)"/>
  <text x="215" y="110" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="600">trust ≥ 0.5</text>

  <!-- stranger → tool (trust ≥ 0.5 + Manip > 0.7) -->
  <path d="M340,96 Q310,130 295,155" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-cond)"/>
  <text x="290" y="128" text-anchor="middle" font-size="7" fill="#7c3aed" font-weight="600">≥ 0.5 + Manip &gt; 0.7</text>

  <!-- stranger → threat (trust ≤ -0.3) -->
  <path d="M420,85 Q500,85 560,155" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-neg)"/>
  <text x="505" y="110" text-anchor="middle" font-size="8" fill="#dc2626" font-weight="600">trust ≤ −0.3</text>

  <!-- ally → mentor (utility > 0.5) -->
  <path d="M110,196 Q100,250 95,295" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-pos)"/>
  <text x="78" y="248" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="600">utility &gt; 0.5</text>

  <!-- ally → obstacle (trust ≤ -0.3) -->
  <path d="M180,190 Q210,250 220,295" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-neg)"/>
  <text x="215" y="248" text-anchor="middle" font-size="8" fill="#dc2626" font-weight="600">≤ −0.3</text>

  <!-- prey → tool (trust ≥ 0.5 + Manip > 0.5) -->
  <path d="M420,178 Q370,178 340,178" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-cond)"/>
  <text x="380" y="172" text-anchor="middle" font-size="7" fill="#7c3aed" font-weight="600">≥ 0.5 + Manip &gt; 0.5</text>

  <!-- prey → threat (trust ≤ -0.3) -->
  <path d="M520,178 L558,178" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-neg)"/>
  <text x="540" y="172" text-anchor="middle" font-size="8" fill="#dc2626" font-weight="600">≤ −0.3</text>

  <!-- obstacle → stranger (recovery, trust ≥ 0.5) -->
  <path d="M280,300 Q350,240 360,101" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a-rec)"/>
  <text x="345" y="210" text-anchor="middle" font-size="8" fill="#0891b2" font-weight="600">recovery ≥ 0.5</text>

  <!-- threat → stranger (recovery, trust ≥ 0.5) -->
  <path d="M610,160 Q580,120 425,82" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a-rec)"/>
  <text x="540" y="120" text-anchor="middle" font-size="8" fill="#0891b2" font-weight="600">recovery ≥ 0.5</text>

  <!-- tool → ally (Callousness < 0.3, trust ≥ 0.5) -->
  <path d="M240,172 L182,172" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-pos)"/>
  <text x="210" y="198" text-anchor="middle" font-size="7" fill="#16a34a" font-weight="600">Callous &lt; 0.3</text>

  <!-- Legend -->
  <rect x="40" y="390" width="700" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="60" y1="415" x2="90" y2="415" stroke="#16a34a" stroke-width="2" marker-end="url(#a-pos)"/>
  <text x="98" y="419" font-size="9" fill="#475569">trust ≥ 0.5 (positive)</text>
  <line x1="240" y1="415" x2="270" y2="415" stroke="#dc2626" stroke-width="2" marker-end="url(#a-neg)"/>
  <text x="278" y="419" font-size="9" fill="#475569">trust ≤ −0.3 (negative)</text>
  <line x1="440" y1="415" x2="470" y2="415" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-cond)"/>
  <text x="478" y="419" font-size="9" fill="#475569">personality-gated transition</text>
  <line x1="60" y1="445" x2="90" y2="445" stroke="#0891b2" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#a-rec)"/>
  <text x="98" y="449" font-size="9" fill="#475569">recovery (dashed)</text>
  <text x="278" y="449" font-size="9" fill="#64748b">Mid-range trust (−0.3 &lt; t &lt; 0.5): no transition — roles are sticky</text>
</svg>
