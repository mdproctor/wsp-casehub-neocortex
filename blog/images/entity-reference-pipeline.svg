<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#fafaf9" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Entity Reference Pipeline — Write and Read Sides</text>
  <rect x="30" y="50" width="350" height="310" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="205" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">WRITE SIDE — Create Annotations</text>
  <rect x="50" y="95" width="130" height="40" rx="4" fill="white" stroke="#86efac"/>
  <text x="115" y="120" text-anchor="middle" font-size="11" fill="#1e293b">Biography Import</text>
  <rect x="50" y="150" width="130" height="40" rx="4" fill="white" stroke="#86efac"/>
  <text x="115" y="175" text-anchor="middle" font-size="11" fill="#1e293b">LLM Extraction</text>
  <rect x="50" y="205" width="130" height="40" rx="4" fill="white" stroke="#86efac"/>
  <text x="115" y="230" text-anchor="middle" font-size="11" fill="#1e293b">Memory Events</text>
  <rect x="230" y="135" width="130" height="60" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="295" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Annotation</text>
  <text x="295" y="175" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Index</text>
  <line x1="180" y1="115" x2="228" y2="155" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="170" x2="228" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="225" x2="228" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="275" width="300" height="65" rx="4" fill="white" stroke="#d4d4d8" stroke-dasharray="4,3"/>
  <text x="210" y="295" text-anchor="middle" font-size="10" fill="#71717a">Stored text (unchanged):</text>
  <text x="210" y="312" text-anchor="middle" font-size="11" font-family="monospace" fill="#1e293b">"Alice walked to the park"</text>
  <text x="210" y="330" text-anchor="middle" font-size="10" fill="#71717a">+ annotation: chars 0–5 → node:alice</text>
  <rect x="420" y="50" width="350" height="310" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="595" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">READ SIDE — Resolve at Render Time</text>
  <rect x="450" y="115" width="140" height="50" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="520" y="137" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Entity Reference</text>
  <text x="520" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Resolver</text>
  <line x1="360" y1="165" x2="448" y2="145" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="630" y="115" width="120" height="50" rx="4" fill="white" stroke="#93c5fd"/>
  <text x="690" y="137" text-anchor="middle" font-size="11" fill="#1e293b">MindMap</text>
  <text x="690" y="152" text-anchor="middle" font-size="11" fill="#1e293b">Store</text>
  <line x1="628" y1="140" x2="592" y2="140" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="450" y="195" width="140" height="40" rx="4" fill="white" stroke="#93c5fd"/>
  <text x="520" y="220" text-anchor="middle" font-size="11" fill="#1e293b">Prompt Sections</text>
  <rect x="450" y="250" width="140" height="40" rx="4" fill="white" stroke="#93c5fd"/>
  <text x="520" y="275" text-anchor="middle" font-size="11" fill="#1e293b">API Responses</text>
  <line x1="520" y1="165" x2="520" y2="193" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="520" y1="235" x2="520" y2="248" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="440" y="305" width="310" height="45" rx="4" fill="white" stroke="#d4d4d8" stroke-dasharray="4,3"/>
  <text x="595" y="322" text-anchor="middle" font-size="10" fill="#71717a">If Alice was renamed to Alicia:</text>
  <text x="595" y="340" text-anchor="middle" font-size="11" font-family="monospace" fill="#1e40af">"Alicia walked to the park"</text>
</svg>
