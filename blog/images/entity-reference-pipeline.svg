<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="800" height="380" fill="#fafaf9" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Entity Tokenisation Pipeline</text>

  <!-- Entity Records -->
  <rect x="280" y="50" width="240" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Entity Records</text>
  <text x="400" y="90" text-anchor="middle" font-size="10" fill="#92400e">canonical names, variants, pronouns, aliases</text>

  <!-- Surface Form Table -->
  <rect x="580" y="50" width="180" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="670" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Surface Form Table</text>
  <text x="670" y="90" text-anchor="middle" font-size="10" fill="#92400e">derived from records</text>

  <!-- Arrow records → table -->
  <line x1="520" y1="77" x2="578" y2="77" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Write side -->
  <rect x="30" y="130" width="350" height="220" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="205" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">WRITE — Tokenise</text>

  <rect x="50" y="175" width="130" height="35" rx="4" fill="white" stroke="#86efac"/>
  <text x="115" y="197" text-anchor="middle" font-size="11" fill="#1e293b">Raw text in</text>

  <rect x="230" y="170" width="130" height="45" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="295" y="190" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Tokeniser</text>
  <text x="295" y="205" text-anchor="middle" font-size="9" fill="#166534">scan → replace</text>

  <line x1="180" y1="192" x2="228" y2="192" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow from surface form table to tokeniser -->
  <line x1="670" y1="105" x2="670" y2="145" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="670" y1="145" x2="362" y2="180" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Stored text callout -->
  <rect x="50" y="240" width="310" height="90" rx="4" fill="white" stroke="#d4d4d8" stroke-dasharray="4,3"/>
  <text x="205" y="260" text-anchor="middle" font-size="10" fill="#71717a">Stored text (tokenised):</text>
  <text x="205" y="280" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#1e293b">{{person_001:full:Alice Smith}}</text>
  <text x="205" y="296" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#1e293b">walked to {{place_001:short:CDMX}}</text>
  <text x="205" y="316" text-anchor="middle" font-size="10" fill="#71717a">One system. Token IS the reference.</text>

  <!-- Read side -->
  <rect x="420" y="130" width="350" height="220" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="595" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">READ — Resolve</text>

  <rect x="450" y="175" width="140" height="45" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="520" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Token Renderer</text>
  <text x="520" y="210" text-anchor="middle" font-size="9" fill="#1e40af">resolve from records</text>

  <!-- Arrow from entity records to renderer -->
  <line x1="400" y1="105" x2="400" y2="145" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="400" y1="145" x2="490" y2="173" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>

  <rect x="450" y="240" width="140" height="35" rx="4" fill="white" stroke="#93c5fd"/>
  <text x="520" y="262" text-anchor="middle" font-size="11" fill="#1e293b">Prompt Sections</text>

  <rect x="630" y="175" width="120" height="35" rx="4" fill="white" stroke="#93c5fd"/>
  <text x="690" y="197" text-anchor="middle" font-size="11" fill="#1e293b">EntityTokens</text>

  <line x1="520" y1="220" x2="520" y2="238" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Output callout -->
  <rect x="440" y="295" width="310" height="45" rx="4" fill="white" stroke="#d4d4d8" stroke-dasharray="4,3"/>
  <text x="595" y="313" text-anchor="middle" font-size="10" fill="#71717a">If Alice Smith renamed to Alicia:</text>
  <text x="595" y="330" text-anchor="middle" font-size="11" font-family="monospace" fill="#1e40af">Alicia walked to CDMX</text>
</svg>
