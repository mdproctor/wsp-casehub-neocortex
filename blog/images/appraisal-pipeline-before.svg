<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="12">
  <defs>
    <marker id="arrow-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-gap" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    </marker>
  </defs>

  <style>
    .box { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 6; }
    .box-gap { fill: #1e293b; stroke: #dc2626; stroke-width: 2; rx: 6; stroke-dasharray: 6,3; }
    .title { fill: #f1f5f9; font-weight: 600; font-size: 13px; }
    .field { fill: #94a3b8; font-size: 11px; }
    .field-present { fill: #22c55e; font-size: 11px; }
    .field-missing { fill: #dc2626; font-size: 11px; font-weight: 600; }
    .label { fill: #cbd5e1; font-size: 11px; font-weight: 600; }
    .note { fill: #94a3b8; font-size: 10px; font-style: italic; }
    .header { fill: #f8fafc; font-size: 16px; font-weight: 700; }
    .subheader { fill: #94a3b8; font-size: 11px; }
  </style>

  <rect width="820" height="520" fill="#0f172a" rx="8"/>

  <text x="410" y="32" text-anchor="middle" class="header">Appraisal Pipeline — Before (Current State)</text>
  <text x="410" y="50" text-anchor="middle" class="subheader">The system doesn't know who the agent is talking to</text>

  <!-- Caller -->
  <rect x="20" y="75" width="160" height="60" class="box"/>
  <text x="100" y="100" text-anchor="middle" class="title">Caller</text>
  <text x="100" y="116" text-anchor="middle" class="field-present">knows targetAgentId</text>

  <!-- Arrow -->
  <line x1="180" y1="105" x2="220" y2="105" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-b)"/>

  <!-- CognitionTickContext -->
  <rect x="225" y="70" width="200" height="100" class="box"/>
  <text x="325" y="92" text-anchor="middle" class="title">CognitionTickContext</text>
  <text x="240" y="110" class="field-present">✓ agentId</text>
  <text x="240" y="124" class="field-present">✓ tenantId</text>
  <text x="240" y="138" class="field-present">✓ observation (String)</text>
  <text x="240" y="152" class="field-missing">✗ targetAgentId — MISSING</text>

  <!-- Arrow down -->
  <line x1="325" y1="170" x2="325" y2="200" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-b)"/>

  <!-- AppraisalTickParticipant -->
  <rect x="225" y="205" width="200" height="80" class="box"/>
  <text x="325" y="228" text-anchor="middle" class="title">AppraisalTickParticipant</text>
  <text x="240" y="246" class="field-present">resolves drives ✓</text>
  <text x="240" y="260" class="field-present">resolves mood ✓</text>
  <text x="240" y="274" class="field-missing">resolves target ✗</text>

  <!-- Arrow -->
  <line x1="425" y1="245" x2="465" y2="245" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-b)"/>

  <!-- AppraisalContext -->
  <rect x="470" y="195" width="200" height="130" class="box"/>
  <text x="570" y="218" text-anchor="middle" class="title">AppraisalContext</text>
  <text x="485" y="238" class="field-present">✓ situation</text>
  <text x="485" y="254" class="field-present">✓ drives</text>
  <text x="485" y="270" class="field-present">✓ mood</text>
  <text x="485" y="286" class="field-present">✓ dispositionAxes</text>
  <text x="485" y="302" class="field-missing">✗ targetSchema — MISSING</text>
  <text x="485" y="316" class="field-missing">✗ personalityFacets — MISSING</text>

  <!-- Arrow -->
  <line x1="570" y1="325" x2="570" y2="365" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-b)"/>

  <!-- LlmAppraisalStrategy -->
  <rect x="440" y="370" width="260" height="130" class="box"/>
  <text x="570" y="393" text-anchor="middle" class="title">LlmAppraisalStrategy</text>
  <text x="455" y="413" class="label">Prompt includes:</text>
  <text x="455" y="429" class="field-present">✓ Drives (name + intensity)</text>
  <text x="455" y="445" class="field-present">✓ Situation (narrative text)</text>
  <text x="455" y="461" class="field-present">✓ Mood (PAD values)</text>
  <text x="455" y="477" class="field-present">✓ Disposition (5 axes)</text>
  <text x="455" y="493" class="field-missing">✗ WHO they're talking to</text>

  <!-- Gap callout -->
  <rect x="20" y="370" width="390" height="130" class="box-gap"/>
  <text x="215" y="395" text-anchor="middle" class="field-missing" font-size="14">THE GAP</text>
  <text x="35" y="418" class="note">The appraisal sub-LLM generates first-person emotional</text>
  <text x="35" y="434" class="note">narrative and SEC dimensions without knowing:</text>
  <text x="35" y="456" class="field-missing">• Who is the agent interacting with?</text>
  <text x="35" y="472" class="field-missing">• What is their relationship (prey/ally/threat)?</text>
  <text x="35" y="488" class="field-missing">• What personality traits filter interpretation?</text>
</svg>
