<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Prose Composition — How the Prompt Assembles</text>

  <!-- Three prose sources -->
  <rect x="30" y="52" width="180" height="60" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="120" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Normal Description</text>
  <text x="120" y="87" text-anchor="middle" font-size="9" fill="#4ade80">"Several angles present themselves"</text>
  <text x="120" y="100" text-anchor="middle" font-size="8" fill="#86efac">always generated</text>

  <rect x="250" y="52" width="180" height="60" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="340" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Extreme Description</text>
  <text x="340" y="87" text-anchor="middle" font-size="9" fill="#d97706">"Pressure sharpens your focus"</text>
  <text x="340" y="100" text-anchor="middle" font-size="8" fill="#fbbf24">when fatigue/extreme configured</text>

  <rect x="470" y="52" width="180" height="60" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
  <text x="560" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Constrained Description</text>
  <text x="560" y="87" text-anchor="middle" font-size="9" fill="#dc2626">"Your reach exceeds your grasp"</text>
  <text x="560" y="100" text-anchor="middle" font-size="8" fill="#f87171">when capacityConfig present</text>

  <!-- Decision diamond -->
  <polygon points="340,148 400,178 340,208 280,178" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="340" y="175" text-anchor="middle" font-size="9" font-weight="500" fill="#475569">capacity</text>
  <text x="340" y="186" text-anchor="middle" font-size="9" font-weight="500" fill="#475569">constrained?</text>

  <!-- Arrows from sources to diamond -->
  <line x1="120" y1="112" x2="120" y2="148" stroke="#64748b" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="120" y1="148" x2="278" y2="174" stroke="#64748b" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="560" y1="112" x2="560" y2="148" stroke="#64748b" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="560" y1="148" x2="402" y2="174" stroke="#64748b" stroke-width="1" marker-end="url(#arr)"/>

  <!-- YES path -->
  <line x1="340" y1="208" x2="340" y2="230" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="355" y="222" font-size="9" font-weight="600" fill="#dc2626">yes</text>

  <!-- Composed result -->
  <rect x="140" y="235" width="400" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="340" y="254" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Composed: constrained + base</text>
  <text x="340" y="270" text-anchor="middle" font-size="9" fill="#64748b">"Your reach exceeds your grasp. Several angles present themselves..."</text>
  <text x="340" y="282" text-anchor="middle" font-size="8" font-style="italic" fill="#94a3b8">constrained prepends to normal or extreme</text>

  <!-- NO paths (left and right) -->
  <line x1="280" y1="178" x2="80" y2="178" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="80" y1="178" x2="80" y2="300" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr)"/>
  <text x="170" y="173" font-size="9" font-weight="600" fill="#16a34a">no</text>

  <rect x="20" y="305" width="130" height="30" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="85" y="324" text-anchor="middle" font-size="9" fill="#166534">Base prose only</text>

  <!-- Continuum modulation -->
  <line x1="400" y1="178" x2="600" y2="178" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="600" y1="178" x2="600" y2="300" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr)"/>

  <rect x="530" y="305" width="130" height="30" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="595" y="318" text-anchor="middle" font-size="9" fill="#6d28d9">Continuum modulation</text>
  <text x="595" y="330" text-anchor="middle" font-size="8" fill="#a78bfa">fixation/obsession/rumination</text>
</svg>
